name: Audio E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voicerender-speech:
    name: Real VoiceRender speech smoke (Ubuntu, Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Readio and Kokoro through VoiceRender
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[spacy]" "voicerender[kokoro]>=0.2.6,<0.3"
          python -m pip check
      - name: Resolve and synthesize real speech
        run: |
          python - <<'PY'
          import numpy as np

          import readio.speech

          playback_calls = []
          readio.speech.play_audio = lambda audio, sample_rate: playback_calls.append(
              (audio, sample_rate)
          )
          rendered = readio.speech.speak(
              "A short Readio speech synthesis smoke test.",
              voice="kokoro:v1.0/af_sarah",
              language="en-US",
          )
          assert rendered.audio.size > 0
          assert np.isfinite(rendered.audio).all()
          assert playback_calls and playback_calls[0][1] == rendered.sample_rate
          PY
