name: pre-commit

on:
  pull_request:
  push:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.6"
      - uses: pre-commit/action@v3.0.1
