name: Test Readio

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify dependency resolution
        run: python -m pip check
      - name: Dependency firewall and packaging metadata
        run: >-
          python -m pytest -q
          tests/test_dependency_boundaries.py
          tests/test_packaging_metadata.py
          tests/test_audioio.py
      - name: Public API import smoke without synthesis engines
        run: python -c "import readio, readio.api, readio.plan, readio.project"
      - name: Run test suite
        run: python -m pytest -q

  ssmdconvert-minimum:
    name: ssmdconvert 0.1.2 + utterplan 0.3.3 public API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install minimum released converter/compiler and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ssmdconvert[pdf,docx]==0.1.2" "utterplan==0.3.3"
          python -m pip install -e ".[dev,documents]"
      - name: Verify dependency resolution
        run: python -m pip check
      - name: Test public conversion boundary at minimum release
        env:
          READIO_TEST_SSMD_CONVERT_MINIMUM: "1"
          READIO_TEST_UTTERPLAN_MINIMUM: "1"
        run: >-
          python -m pytest -q
          tests/test_ssmdconvert_api_contract.py
          tests/test_document_conversion.py
          tests/test_packaging_metadata.py
          tests/test_audiobook_project.py
          tests/test_utterplan_v3_linguistics.py
          tests/test_audiobook_cli.py
  engine-compatibility:
    name: ${{ matrix.engine }} ${{ matrix.channel }} API (Ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: kokoro
            channel: minimum
            package: pykokoro
            specifier: "==0.10.2"
            python-version: "3.10"
          - engine: kokoro
            channel: current
            package: pykokoro
            specifier: ">=0.10.2,<0.11"
            python-version: "3.13"
          - engine: piper
            channel: minimum
            package: pipersynth
            specifier: "==0.2.1"
            python-version: "3.10"
          - engine: piper
            channel: current
            package: pipersynth
            specifier: ">=0.2.1,<0.3"
            python-version: "3.13"
          - engine: pocket
            channel: minimum
            package: "pocketsynth[cpu]"
            specifier: "==0.2.3"
            python-version: "3.10"
          - engine: pocket
            channel: current
            package: "pocketsynth[cpu]"
            specifier: ">=0.2.3,<0.3"
            python-version: "3.13"
          - engine: supertonic
            channel: minimum
            package: "supertonicsynth[cpu]"
            specifier: "==0.1.2"
            python-version: "3.10"
          - engine: supertonic
            channel: current
            package: "supertonicsynth[cpu]"
            specifier: ">=0.1.2,<0.2"
            python-version: "3.13"
          - engine: kitten
            channel: minimum
            package: "kittensynth[cpu]"
            specifier: "==0.1.0"
            python-version: "3.10"
          - engine: kitten
            channel: current
            package: "kittensynth[cpu]"
            specifier: ">=0.1.0,<0.2"
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install selected engine package
        env:
          ENGINE_PACKAGE: ${{ matrix.package }}
          ENGINE_SPECIFIER: ${{ matrix.specifier }}
        run: python -m pip install "${ENGINE_PACKAGE}${ENGINE_SPECIFIER}"
      - name: Verify dependency resolution
        run: python -m pip check
      - name: Run released-package API contract without model downloads
        env:
          READIO_TEST_ENGINE: ${{ matrix.engine }}
        run: python -m pytest -q tests/test_released_engine_apis.py

  released-engine-api:
    name: Released engine API integration (Ubuntu, Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install exact released engine packages
        run: |
          python -m pip install \
            "pykokoro==0.10.2" \
            "pipersynth==0.2.1" \
            "pocketsynth[cpu]==0.2.3" \
            "supertonicsynth[cpu]==0.1.2" \
            "kittensynth[cpu]==0.1.0"
      - name: Verify dependency resolution
        run: python -m pip check
      - name: Run released-package API contracts without model downloads
        run: python -m pytest -q tests/test_released_engine_apis.py tests/test_supertonicsynth_engine.py

  quality:
    name: Static quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Public API type-check
        run: mypy --follow-imports=silent --strict tests/typecheck/public_api_consumer.py
      - name: Compile sources
        run: python -m compileall -q readio

  package:
    name: Package and installed-wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build artifacts
        run: python -m build
      - name: Validate artifact metadata
        run: python -m twine check dist/*
      - name: Installed-wheel smoke (base)
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/readio-wheel-smoke-base"
          "${RUNNER_TEMP}/readio-wheel-smoke-base/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/readio-wheel-smoke-base/bin/python" -m pip check
          cd "${RUNNER_TEMP}"
          PYTHONPATH="${GITHUB_WORKSPACE}/tests" "${RUNNER_TEMP}/readio-wheel-smoke-base/bin/python" - <<'PY'
          import importlib.metadata
          import importlib.resources
          from pathlib import Path

          import readio
          import ssmdconvert
          from readio.api import document_from_file

          distribution_version = importlib.metadata.version("readio")
          assert readio.__version__ == distribution_version
          assert importlib.metadata.version("ssmdconvert")
          assert importlib.resources.files("readio").joinpath("py.typed").is_file()
          assert importlib.resources.files("readio.resources.templates").joinpath(
              "podcast.ssmd"
          ).is_file()

          root = Path.cwd()
          html = root / "sample.html"
          html.write_text("<html><body><p>HTML wheel smoke</p></body></html>", encoding="utf-8")
          text = root / "sample.txt"
          text.write_text("Plain-text wheel smoke.", encoding="utf-8")
          markdown = root / "sample.md"
          markdown.write_text("# Markdown wheel smoke\n", encoding="utf-8")
          ssmd = root / "sample.ssmd"
          ssmd.write_text("SSMD wheel smoke.\n", encoding="utf-8")
          for source in (html, text, markdown, ssmd):
              document = document_from_file(source)
              assert document.format == "ssmd"
          PY
          "${RUNNER_TEMP}/readio-wheel-smoke-base/bin/readio" --version
      - name: Installed-wheel smoke (documents extra)
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/readio-wheel-smoke-documents"
          WHEEL="$(ls "${PWD}"/dist/*.whl | head -n 1)"
          "${RUNNER_TEMP}/readio-wheel-smoke-documents/bin/python" -m pip install \
            "readio[documents] @ file://${WHEEL}"
          "${RUNNER_TEMP}/readio-wheel-smoke-documents/bin/python" -m pip check
          cd "${RUNNER_TEMP}"
          PYTHONPATH="${GITHUB_WORKSPACE}/tests" "${RUNNER_TEMP}/readio-wheel-smoke-documents/bin/python" - <<'PY'
          from pathlib import Path

          from document_support import write_test_docx, write_test_pdf
          from readio.api import document_from_file

          root = Path.cwd()
          pdf = root / "sample.pdf"
          write_test_pdf(pdf, "PDF wheel smoke")
          docx = root / "sample.docx"
          write_test_docx(docx)
          for source in (pdf, docx):
              document = document_from_file(source)
              assert document.format == "ssmd"
          PY
      - name: Installed-wheel smoke (engines)
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/readio-wheel-smoke-engines"
          "${RUNNER_TEMP}/readio-wheel-smoke-engines/bin/python" -m pip install \
            "pykokoro==0.10.2" \
            "pipersynth==0.2.1" \
            "pocketsynth[cpu]==0.2.3" \
            "supertonicsynth[cpu]==0.1.2" \
            "kittensynth[cpu]==0.1.0"
          "${RUNNER_TEMP}/readio-wheel-smoke-engines/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/readio-wheel-smoke-engines/bin/python" -m pip check
          PYTHONPATH="${GITHUB_WORKSPACE}/tests" "${RUNNER_TEMP}/readio-wheel-smoke-engines/bin/python" -m pytest -q \
            "${GITHUB_WORKSPACE}/tests/test_released_engine_apis.py"
          "${RUNNER_TEMP}/readio-wheel-smoke-engines/bin/readio" --version
