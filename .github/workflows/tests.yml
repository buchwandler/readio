name: Test Readio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify dependency resolution
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q
      - name: Static checks
        run: |
          ruff check .
          mypy readio
          python -m compileall -q readio

  semantic-stack-minimum:
    name: Minimum specialist releases (Ubuntu, Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install minimum released specialist stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "ssmdconvert[pdf,docx]==0.2.1" \
            "utterplan[spacy]==0.6.5" \
            "voicerender==0.2.3" \
            "audiocompose==0.3.2" \
            "audioexport==0.1.2"
          python -m pip install -e ".[dev,documents,spacy]"
      - name: Verify dependency resolution
        run: python -m pip check
      - name: Test specialist integration boundaries
        run: >-
          python -m pytest -q
          tests/test_book.py
          tests/test_speech.py
          tests/test_doctor_v05.py
          tests/test_packaging_metadata.py

  package:
    name: Wheel contents and dependency-light import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools and build artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Inspect wheel contents and smoke test clean installation
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/readio-wheel-smoke"
          WHEEL="$(ls "${PWD}"/dist/*.whl | head -n 1)"
          "${RUNNER_TEMP}/readio-wheel-smoke/bin/python" -m pip install "${WHEEL}"
          "${RUNNER_TEMP}/readio-wheel-smoke/bin/python" -m pip check
          cd "${RUNNER_TEMP}"
          WHEEL="${WHEEL}" "${RUNNER_TEMP}/readio-wheel-smoke/bin/python" - <<'PY'
          import importlib.util
          import os
          import zipfile
          from pathlib import Path

          import readio
          import readio.api

          wheel = Path(os.environ["WHEEL"])
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          forbidden = (
              "readio/engines/",
              "readio/rendering/",
              "readio/stages/",
              "readio/planning/",
              "readio/migrations/",
              "readio/project.py",
              "readio/verification/",
          )
          assert not any(any(name.startswith(prefix) for prefix in forbidden) for name in names)
          assert importlib.util.find_spec("readio.book")
          assert importlib.util.find_spec("readio.speech")
          for backend in ("pykokoro", "pipersynth", "pocketsynth", "kittensynth", "supertonicsynth", "inflectsynth", "voicefolio"):
              assert importlib.util.find_spec(backend) is None
          PY
          "${RUNNER_TEMP}/readio-wheel-smoke/bin/readio" --help
          "${RUNNER_TEMP}/readio-wheel-smoke/bin/readio" doctor --json
