name: Test Readio

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Readio runtime dependencies
        run: |
          python -m pip install "pykokoro[playback]==0.9.11"
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q


  minimum-compatibility:
    name: Minimum PyKokoro compatibility (Ubuntu, Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install minimum PyKokoro runtime
        run: python -m pip install "pykokoro[playback]==0.9.11"
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run minimum-version test suite
        run: python -m pytest -q
  current-compatibility:
    name: Current PyKokoro compatibility (Ubuntu, Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install current supported PyKokoro range
        run: python -m pip install "pykokoro[playback]>=0.9.11,<0.10"
      - name: Show installed PyKokoro version
        run: python -c "import importlib.metadata; print('PyKokoro', importlib.metadata.version('pykokoro'))"
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run current-range test suite
        run: python -m pytest -q
  quality:
    name: Static quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Readio runtime dependencies
        run: |
          python -m pip install "pykokoro[playback]==0.9.11"
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Compile sources
        run: python -m compileall -q readio

  package:
    name: Package and installed-wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build artifacts
        run: python -m build
      - name: Validate artifact metadata
        run: python -m twine check dist/*
      - name: Installed-wheel smoke
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/readio-wheel-smoke"
          "${RUNNER_TEMP}/readio-wheel-smoke/bin/python" -m pip install "pykokoro[playback]==0.9.11"
          "${RUNNER_TEMP}/readio-wheel-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/readio-wheel-smoke/bin/python" -m pip check
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/readio-wheel-smoke/bin/python" - <<'PY'
          import importlib.metadata
          import importlib.resources
          import readio

          distribution_version = importlib.metadata.version("readio")
          assert readio.__version__ == distribution_version
          assert importlib.resources.files("readio.resources.templates").joinpath(
              "podcast.ssmd"
          ).is_file()
          PY
          "${RUNNER_TEMP}/readio-wheel-smoke/bin/readio" --version
