name: Test Readio

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Readio runtime dependencies
        run: python -m pip install "pykokoro[playback]>=0.10.0,<0.11"
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q

  engine-compatibility:
    name: ${{ matrix.engine }} ${{ matrix.channel }} API (Ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: pykokoro
            channel: minimum
            package: "pykokoro[playback]"
            specifier: "==0.10.0"
            python-version: "3.10"
          - engine: pykokoro
            channel: current
            package: "pykokoro[playback]"
            specifier: ">=0.10.0,<0.11"
            python-version: "3.13"
          - engine: piper
            channel: minimum
            package: pipersynth
            specifier: "==0.2.0"
            python-version: "3.10"
          - engine: piper
            channel: current
            package: pipersynth
            specifier: ">=0.2.0,<0.3"
            python-version: "3.13"
          - engine: pocket
            channel: minimum
            package: "pocketsynth[cpu]"
            specifier: "==0.2.0"
            python-version: "3.10"
          - engine: pocket
            channel: current
            package: "pocketsynth[cpu]"
            specifier: ">=0.2.0,<0.3"
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install selected engine package
        env:
          ENGINE_PACKAGE: ${{ matrix.package }}
          ENGINE_SPECIFIER: ${{ matrix.specifier }}
        run: python -m pip install "${ENGINE_PACKAGE}${ENGINE_SPECIFIER}"
      - name: Verify dependency resolution
        run: python -m pip check
      - name: Run released-package API contract without model downloads
        env:
          READIO_TEST_ENGINE: ${{ matrix.engine }}
        run: python -m pytest -q tests/test_released_engine_apis.py

  released-engine-api:
    name: Released engine API integration (Ubuntu, Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install exact released engine packages
        run: |
          python -m pip install \
            "pykokoro[playback]==0.10.0" \
            "pipersynth==0.2.0" \
            "pocketsynth[cpu]==0.2.0"
      - name: Verify dependency resolution
        run: python -m pip check
      - name: Run released-package API contracts without model downloads
        run: python -m pytest -q tests/test_released_engine_apis.py

  quality:
    name: Static quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Public API type-check
        run: mypy --follow-imports=silent --strict tests/typecheck/public_api_consumer.py
      - name: Compile sources
        run: python -m compileall -q readio

  package:
    name: Package and installed-wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build artifacts
        run: python -m build
      - name: Validate artifact metadata
        run: python -m twine check dist/*
      - name: Installed-wheel smoke
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/readio-wheel-smoke"
          "${RUNNER_TEMP}/readio-wheel-smoke/bin/python" -m pip install \
            "pykokoro[playback]==0.10.0" \
            "pipersynth==0.2.0" \
            "pocketsynth[cpu]==0.2.0"
          "${RUNNER_TEMP}/readio-wheel-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/readio-wheel-smoke/bin/python" -m pip check
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/readio-wheel-smoke/bin/python" - <<'PY'
          import importlib.metadata
          import importlib.resources
          import readio

          distribution_version = importlib.metadata.version("readio")
          assert readio.__version__ == distribution_version
          assert importlib.resources.files("readio").joinpath("py.typed").is_file()
          assert importlib.resources.files("readio.resources.templates").joinpath(
              "podcast.ssmd"
          ).is_file()
          PY
          "${RUNNER_TEMP}/readio-wheel-smoke/bin/readio" --version
