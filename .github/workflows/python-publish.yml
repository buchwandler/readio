# Build and publish Readio when a GitHub Release is published.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build package
        run: python -m build
      - name: Validate artifact metadata
        run: python -m twine check dist/*
      - name: Verify wheel requires AudioExport
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          from zipfile import ZipFile

          from packaging.requirements import Requirement
          from packaging.specifiers import SpecifierSet

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected one wheel, found {len(wheels)}"
          with ZipFile(wheels[0]) as wheel:
              metadata_files = [
                  name for name in wheel.namelist() if name.endswith(".dist-info/METADATA")
              ]
              assert len(metadata_files) == 1, metadata_files
              metadata = BytesParser(policy=default).parsebytes(wheel.read(metadata_files[0]))

          requirements = [
              Requirement(value)
              for value in metadata.get_all("Requires-Dist", [])
              if Requirement(value).name.lower() == "audioexport"
          ]
          assert len(requirements) == 1, requirements
          assert requirements[0].specifier == SpecifierSet(">=0.1.8,<0.2"), requirements[0]
          PY
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_wheel_filename

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected one wheel, found {len(wheels)}"
          _, version, _, _ = parse_wheel_filename(wheels[0].name)
          assert str(version) == expected, (
              f"wheel version {version} does not match release tag {expected}"
          )
          PY
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
