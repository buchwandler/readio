    section_hash: 0752c67f19fa7a577af02a2d61d374596f652c6afd3569b0acd286730e4dc25c
    summary: Manual specialist workflow
    text:
      "## Manual specialist workflow\n\nUse specialist CLIs directly when package-specific\
      \ controls or detailed diagnostics are needed. Preserve the exact variant returned\
      \ by UtterPlan:\n\n```bash\nssmdconvert book convert novel.epub -o novel.ssmdbook\n\
      utterplan compile-book novel.ssmdbook\nvoicerender profile create --engine kokoro\
      \ --target v1.0 --voice af_heart \\\n  --language en-US -o novel.ssmdbook/narrator.renderprofile.toml\n\
      utterplan render-book novel.ssmdbook \\\n  --profile novel.ssmdbook/narrator.renderprofile.toml\n\
      \nVARIANT=\"<exact variant returned by utterplan render-book>\"\nvoicerender render-book\
      \ novel.ssmdbook --variant \"$VARIANT\"\naudiocompose compose-book novel.ssmdbook\
      \ --variant \"$VARIANT\"\naudioexport export-book novel.ssmdbook --variant \"\
      $VARIANT\" --output novel.m4b\n```\n\nFor Readio's equivalent orchestration, see\
      \ the [CLI reference](cli.md). For detailed specialist options, consult the owning\
      \ package documentation."
    links: []
