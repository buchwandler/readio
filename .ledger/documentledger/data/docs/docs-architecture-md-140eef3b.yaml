  section_hash: be535688ac4583da706964e502765d6b851694e141e0360fe830bc4acd85db42
  summary: Manual specialist workflow
  text: "## Manual specialist workflow\n\nUse specialist CLIs directly when package-specific\
    \ controls or detailed diagnostics are needed. Preserve the exact variant returned\
    \ by UtterPlan:\n\n```bash\nssmdconvert bundle convert novel.epub -o novel.ssmd-bundle\n\
    utterplan bundle compile novel.ssmd-bundle\nvoicerender profile create --engine\
    \ kokoro --target v1.0 --voice af_heart \\\n  --language en-US -o novel.ssmd-bundle/narrator.renderprofile.toml\n\
    utterplan bundle render novel.ssmd-bundle \\\n  --profile novel.ssmd-bundle/narrator.renderprofile.toml\n\
    \nVARIANT=\"<exact variant returned by utterplan bundle render>\"\nvoicerender\
    \ bundle render novel.ssmd-bundle --variant \"$VARIANT\"\naudiocompose bundle\
    \ compose novel.ssmd-bundle --variant \"$VARIANT\"\naudioexport bundle export\
    \ novel.ssmd-bundle --variant \"$VARIANT\" --output novel.m4b\n```\n\nConsult\
    \ each specialist package for complete package-specific options."
  links: []
