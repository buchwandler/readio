    section_hash: c601274d34f30876352be68bce783e42b5d5d3c9426e3c5c6aeb04716e4e8682
    summary: Persistent state and compatibility
    text: "## Persistent state and compatibility


      `.ssmdoc` and `.ssmdbook` bundles and all stage artifacts remain specialist-owned.
      Readio writes no parallel project state, project manifest, stage status, RenderPlan,
      render manifest, composition job, or export format. Its `WorkspaceRef`, progress
      events, and pipeline results are in-memory routing/adaptation values only.


      Version 0.5 is a clean break from Readio's former project and pipeline formats.
      Old Readio project directories and settings are unsupported and are not read or
      attached. There is no migration command, compatibility alias, or runtime shim.
      Recreate work from source material with SSMDConvert, or use the specialist packages
      directly."
