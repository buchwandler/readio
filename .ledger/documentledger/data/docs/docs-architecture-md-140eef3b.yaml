  section_hash: 5a65111dbd96796a0deb936e2441cdef66d54526df4e9aa8bf9df879d1936a8f
  summary: Ownership
  text: '## Ownership


    | Concern                                          | Owner                  |
    Readio''s role                                                         |

    | ------------------------------------------------ | ---------------------- |
    --------------------------------------------------------------------- |

    | Requested render settings and intent file        | User                   |
    Readio validates/resolves and orchestrates; no hidden workspace state |

    | Voice roles and RenderProfile                    | VoiceRender / user     |
    Readio references the profile; does not define a cast schema          |

    | Source conversion, `.ssmd-bundle`, manifest kind | SSMDConvert            |
    Forward conversion requests and resolve validated bundles             |

    | Semantic plans and RenderPlan projection         | UtterPlan / RenderPlan |
    Forward bundle requests and preserve the exact returned variant       |

    | Profiles, voices, engines, models, and synthesis | VoiceRender            |
    Delegate management and bundle rendering                              |

    | ONNX Runtime build and provider policy           | VoiceRender            |
    Expose status and provider selection; do not manage distributions     |

    | Composition and audio-job artifacts              | AudioCompose           |
    Forward one bundle compose request and return the native result       |

    | Encoding and export artifacts                    | AudioExport            |
    Forward one bundle export request; integration is optional            |

    | CLI, sequencing, and playback convenience        | Readio                 |
    Coordinate public calls and adapt progress                            |


    `WorkspaceRef.kind` is an informational consistency check, not a selector for
    Readio-specific implementations. SSMDConvert determines source/bundle kind, specialists
    own chapter validation and kind-sensitive dispatch, and Readio rejects a resolved
    workspace whose kind contradicts the intent.'
  links: []
