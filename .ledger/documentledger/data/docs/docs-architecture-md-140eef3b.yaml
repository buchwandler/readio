  section_hash: e831e621983d000c8950b74f6f72b9641bf8b29caa44baf8efdcfd8af60abe44
  summary: Machine-level runtime policy
  text: '## Machine-level runtime policy


    Readio exposes VoiceRender''s ONNX Runtime status and provider-policy APIs through
    `readio.api` and `readio runtime`. The imported runtime distribution/build is
    not the same as an execution provider; provider selection affects future compatible
    sessions and does not prove which provider an existing session used. Environment
    variables such as `ONNXVOICE_PROVIDER` override a saved preference, and reset
    does not unset those variables. Explicit engine options and RenderProfile provider
    settings remain overrides. Provider aliases, precedence, validation, persistence,
    and installation guidance stay with VoiceRender; Readio does not install or switch
    runtime distributions or add runtime state to bundles, profiles, RenderPlans,
    or other project artifacts.'
  links: []
