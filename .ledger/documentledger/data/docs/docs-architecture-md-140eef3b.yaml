    section_hash: f53faa95b366b075e875db17bb1a4524eebc4cc77298bad7bcc2cc40a52fea88
    summary: Book workspaces
    text:
      "### Book workspaces\n\n```text\nEPUB\n  → SSMDConvert: convert to native\
      \ .ssmdbook\n  → UtterPlan: compile chapters and project a variant\n  → VoiceRender:\
      \ render selected chapters\n  → AudioCompose: compose book audio and chapter timeline\n\
      \  → AudioExport: optionally encode the book\n```\n\n`readio run` sequences the\
      \ stages for either workspace kind. Its RenderPlan result supplies the exact variant\
      \ sent to VoiceRender, AudioCompose, and AudioExport. The manual CLI and Python\
      \ service expose the same specialist stages for workflows that need stage-by-stage\
      \ control. Readio does not normalize or reconstruct the variant."
    links: []
