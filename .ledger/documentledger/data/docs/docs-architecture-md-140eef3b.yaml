  section_hash: 4ad800609619d24ccc45c47115a3e0a51dc450ea868df0506fafb7f04c735f97
  summary: Readio architecture
  text: '# Readio architecture


    Readio is a workflow gateway over specialist public APIs. A visible, user-owned
    `readio.render.v2` intent describes a complete request; the separate VoiceRender
    RenderProfile defines voice roles. SSMDConvert owns conversion and editable `.ssmd-bundle`
    workspaces, whose manifest determines whether content is a book or document. UtterPlan,
    VoiceRender, AudioCompose, and AudioExport own their stage contracts and perform
    kind-sensitive dispatch. File renders use temporary storage by default; a persistent
    bundle is always explicit.'
