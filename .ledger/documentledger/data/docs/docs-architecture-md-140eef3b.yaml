    section_hash: 7f45b058f6cc97d589242acf6560ed01276c2e1c3930cebada7e8e85e9041aab
    summary: Persistent state and compatibility
    text: "## Persistent state and compatibility


      The `.ssmdbook` workspace and all stage artifacts are specialist-owned. Readio
      writes no project manifest, cache, stage status, plan, render manifest, or compatibility
      metadata.


      Version 0.5.0 is a clean break. Readio no longer supports its former generic `*.readio`
      projects, `project.json`, old plan/render-manifest formats, project migrations,
      or old project pipeline APIs. There is no migration command. Existing legacy files
      are not imported into `.ssmdbook` workspaces. Convert the original source with
      SSMDConvert or use the specialist packages directly."
