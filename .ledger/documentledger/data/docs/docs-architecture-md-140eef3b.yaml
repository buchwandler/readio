    section_hash: 5ba295b411e9c06773f769f4cfeba8ffa096527797d4b31029b1dcd322ad00f0
    summary: Readio orchestration
    text:
      "## Readio orchestration\n\n`readio audiobook convert` uses SSMDConvert to\
      \ convert an EPUB and write a specialist-owned workspace. `readio audiobook build`\
      \ runs the selected stages in order:\n\n```text\nSSMDConvert workspace\n  → UtterPlan\
      \ compile_book\n  → UtterPlan render_book\n  → VoiceRender render_book\n  → AudioCompose\
      \ compose_book\n  → AudioExport export_book\n```\n\nThe variant returned by `utterplan.render_book`\
      \ is passed unchanged to VoiceRender, AudioCompose, and AudioExport. Readio's\
      \ in-memory `BookBuildResult` holds those original stage result objects; it is\
      \ not a new stage manifest. `force`, `fail_fast`, chapter selection, profile,\
      \ output, and stop-after options are forwarded where the specialist APIs support\
      \ them.\n\n`readio speak` is a separate convenience path for literal text. It\
      \ parses an optional neutral `engine:target/voice` selector, calls VoiceRender's\
      \ public resolve/session/synthesis APIs, then passes the returned samples and\
      \ sample rate to Readio's generic audio-device playback helper. It does not use\
      \ UtterPlan, book composition, or AudioExport.\n\n`readio doctor` reports installed\
      \ specialist package versions and engine availability through VoiceRender's public\
      \ engine-list and engine-status functions. Readio does not inspect private specialist\
      \ modules or load backend implementations for the report."
