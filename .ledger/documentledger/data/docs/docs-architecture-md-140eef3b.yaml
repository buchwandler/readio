- section_id: md:section:docs/architecture.md::intent-driven-bundle-workflow
  doc_path: docs/architecture.md
  heading_path:
  - Readio architecture
  - Intent-driven bundle workflow
  heading_slug: intent-driven-bundle-workflow
  line_span:
