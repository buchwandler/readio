  section_hash: 721e0fdd3ce47ddfadaeaccae3feb0f9ca7412190bbcbddc2c327ee6adc84438
  summary: Persistent state
  text: '## Persistent state


    The editable bundle and all stage artifacts remain specialist-owned. Readio may
    read or create a user-selected `*.readio.toml` intent file, but never stores it
    as hidden project state. Readio writes no `.readio/` workspace directory, parallel
    manifest, stage status, RenderPlan, render manifest, composition job, export format,
    or status database. Its workflow plans, results, and progress events are in-memory
    orchestration values; inspection derives state read-only from specialist APIs.'
  links: []
