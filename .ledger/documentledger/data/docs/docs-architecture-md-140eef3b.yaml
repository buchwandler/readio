  section_hash: a5e816d234c5b3b817d2707ab6f5b7e905584df0aeb372b875d2735a933733f2
  summary: Intent-driven bundle workflow
  text: "## Intent-driven bundle workflow\n\nThe intent and profile live at user-selected\
    \ paths, typically outside a persistent bundle. Readio resolves paths, validates\
    \ configuration, and inspects specialist state before execution; temporary runs\
    \ use a unique system temp directory and clean it on success or failure. Readio\
    \ does not add workflow state to a workspace.\n\n```text\nsource material\n  →\
    \ SSMDConvert bundle convert\n  → <name>.ssmd-bundle/\n      manifest kind: book\
    \ | document\n  → UtterPlan bundle compile\n  → UtterPlan bundle render (profile-specific\
    \ RenderPlan)\n  → VoiceRender bundle render\n  → AudioCompose bundle compose\n\
    \  → AudioExport bundle export (optional)\n```\n\n`readio render` owns the complete\
    \ workflow. With no explicit bundle it converts and processes inside temporary\
    \ storage; `--bundle PATH` selects persistent storage, and a bundle supplied as\
    \ `SOURCE` is reused as persistent input. Persistent book creation converts the\
    \ full source inventory while the selected chapter scope controls downstream work.\
    \ Readio preserves UtterPlan's exact projected variant through VoiceRender, AudioCompose,\
    \ and AudioExport. `--rebuild-from` and `--replace-output` are separate explicit\
    \ safety controls. Specialist CLIs remain available for deliberate stage-level\
    \ debugging; Readio does not provide a parallel stage-runner command tree.\n\n\
    A book bundle may contain multiple chapter items; a document bundle represents\
    \ a single document item. This is a content distinction recorded by the manifest,\
    \ not a second workspace format or Readio routing policy."
  links: []
