    section_hash: 2db998de382705ea22f308f9a1c05e280888fe9dfeba6547fed685cb53843784
    summary: Dependency boundary
    text: "## Dependency boundary


      Readio directly depends on the specialist package roots it calls, plus NumPy for
      audio arrays and sounddevice for local playback. Engine extras are installed through
      VoiceRender, for example `voicerender[kokoro]`. Readio does not pin backend packages
      or depend directly on Voicefolio. Its optional `spacy` and `documents` extras
      only pass through UtterPlan and SSMDConvert extras."
