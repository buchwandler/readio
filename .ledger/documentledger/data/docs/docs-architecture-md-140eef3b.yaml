    summary: Document workspaces
    text:
      "### Document workspaces\n\n```text\nsource document\n  → SSMDConvert: convert\
      \ to native .ssmdoc\n  → UtterPlan: compile semantic speech plan\n  → UtterPlan\
      \ / RenderPlan: project a profile-specific variant\n  → VoiceRender: preflight\
      \ and synthesize\n  → AudioCompose: compose WAV output\n  → AudioExport: optionally\
      \ encode a delivery format\n```"
    links: []
