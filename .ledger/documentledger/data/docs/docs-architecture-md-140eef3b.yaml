    section_hash: 946f0d2a8c897447a8ba0f66ccd8a6f2bfff14710bfa9c2a47195e88205f1df5
    summary: Direct speech and management
    text: "### Direct speech and management


      `readio speak` is a separate literal-text path through VoiceRender and local playback;
      it does not create a workspace or invoke planning, composition, or export. Engine/model,
      voice/source, and RenderProfile operations delegate to VoiceRender's public management
      APIs. Backend engines are installed through VoiceRender extras.


      | Concern | Owner | Readio's role |

      | --- | --- | --- |

      | Document/book conversion and native bundles | SSMDConvert | Select the workspace
      kind and forward conversion options |

      | Semantic plans and RenderPlan projection | UtterPlan / RenderPlan | Forward
      planner and profile requests; preserve the returned variant |

      | Profiles, voices, engines, models, and synthesis | VoiceRender | Delegate management
      and render calls |

      | Composition and audio-job artifacts | AudioCompose | Forward options and return
      the native result |

      | Encoding and export artifacts | AudioExport | Forward supported options; the
      export extra is optional |

      | CLI, sequencing, playback convenience | Readio | Coordinate public calls and
      adapt progress |"
    links: []
