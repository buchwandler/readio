  section_hash: f0a5edf8c4476353231739e294788547741e16ac2fac7b070e1c6d11c53af8e0
  summary: Dependency boundary
  text: '## Dependency boundary


    Readio imports specialist package-root public APIs only: SSMDConvert, UtterPlan,
    VoiceRender, AudioCompose, and AudioExport. It does not import specialist private
    submodules or backend SDKs. Playback and audio I/O helpers unrelated to bundle
    stages remain in Readio.'
