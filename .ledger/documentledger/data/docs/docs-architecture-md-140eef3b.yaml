    summary: Readio architecture
    text: "# Readio architecture


      Readio coordinates a small set of specialist packages. The specialist that owns
      a stage also owns its validation, artifacts, reports, reuse rules, and detailed
      errors. Readio does not create a parallel project manifest or stage state."
