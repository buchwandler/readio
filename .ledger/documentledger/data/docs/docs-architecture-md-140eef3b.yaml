    summary: Readio architecture
    text: "# Readio architecture


      Readio is a thin orchestration layer over specialist public APIs. Each specialist
      package owns its domain schemas, validation, persisted artifacts, reports, and
      reuse rules. Readio owns workspace routing, request sequencing, CLI convenience,
      and small in-memory event/result adapters."
