    section_hash: 8bdb02319c91152f23e7e9be96cdf43bd330a2e21eb35c51543336b747514c1d
    summary: Workflow progress
    text: "## Workflow progress


      Readio forwards specialist progress synchronously through `WorkflowEvent` callbacks.
      Executed stages emit `stage.started`, specialist progress events, then `stage.completed`;
      reused stages emit only `stage.reused` and perform no specialist work. The progress
      adapter preserves determinate counters and specialist elapsed time when provided,
      while chapter keys are canonicalized in `details` only when chapter identity is
      available. Generic counters are not reinterpreted as chapter numbers.


      AudioExport's public `export_bundle` API does not expose a progress callback.
      Readio therefore keeps export indeterminate and does not fabricate progress or
      ETA. TTSForge or another caller owns wall-clock timing and terminal presentation.

      A book bundle may contain multiple chapter items; a document bundle represents
      a single document item. This is a content distinction recorded by the manifest,
      not a second workspace format or Readio routing policy."
