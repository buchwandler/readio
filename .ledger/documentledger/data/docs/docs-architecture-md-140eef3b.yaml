    section_hash: 598651aedfaf64a5ebd87bcc74c8bc2c867b9515533cc7894d5f949b748bd121
    summary: Public workflow API
    text: "## Public workflow API


      `readio.api` is the public gateway for source and render workflows. `inspect_source()`
      returns normalized source metadata and chapter inventory without creating a workspace.
      `render_request_from_intent()` translates persisted user configuration into the
      canonical `RenderRequest`; it does not orchestrate stages itself. `Readio.inspect(RenderRequest)`
      and `Readio.render(RenderRequest)` are the shared read-only inspection and execution
      workflows. The `inspect_intent()` and `render_intent()` convenience methods delegate
      through that same request mapping and workflow rather than maintaining a second
      stage runner. Specialist stage request schemas remain owned by their packages."
