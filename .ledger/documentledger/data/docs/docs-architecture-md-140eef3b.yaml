    section_hash: 567f781c6a30aeebdc311ebf43c1d95436bdecd9913315d4c1abaf4d888d6a88
    summary: Dependency boundary
    text: "## Dependency boundary


      Readio imports specialist package-root public APIs only: SSMDConvert, UtterPlan,
      VoiceRender, AudioCompose, and optional AudioExport. It does not import specialist
      private submodules or backend SDKs. The dependency-boundary tests enforce this
      rule and guard against reintroducing legacy persistence identifiers. Playback
      and audio I/O helpers unrelated to workspace stages remain in Readio."
