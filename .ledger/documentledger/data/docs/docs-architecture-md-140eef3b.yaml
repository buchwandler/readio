    section_hash: 9056e8ab12126c6e9b25718107474c8cbaaf3b71f74c1bd2bbd6e8c682aebb7d
    summary: Manual specialist workflow
    text:
      "## Manual specialist workflow\n\nThe canonical book workflow is:\n\n```text\n\
      EPUB\n  │\n  ▼\nSSMDConvert\n  │  converts the source and owns the .ssmdbook workspace\n\
      \  ▼\nUtterPlan\n  │  compiles semantic plans and projects a RenderPlan variant\n\
      \  ▼\nVoiceRender\n  │  resolves the profile and synthesizes the selected chapters\n\
      \  ▼\nAudioCompose\n  │  composes chapter audio and applies composition policy\n\
      \  ▼\nAudioExport\n     encodes the composed book, including M4B assembly\n```\n\
      \n| Concern | Owner | Readio's role |\n| --- | --- | --- |\n| Source conversion\
      \ and `.ssmdbook` layout | SSMDConvert | Call public conversion and workspace\
      \ APIs |\n| Semantic compilation and chapter selection | UtterPlan | Forward the\
      \ selector and compile options |\n| RenderPlan and variant projection | UtterPlan\
      \ and RenderPlan | Pass the returned variant unchanged to later stages |\n| Voice\
      \ and backend resolution, capacity, synthesis | VoiceRender | Call public resolve,\
      \ session, and book-render APIs |\n| Composition, pause policy, emphasis, and\
      \ loudness | AudioCompose | Forward book composition options |\n| Encoding, metadata,\
      \ cover art, and M4B output | AudioExport | Forward export options and output\
      \ path |\n| Cross-stage convenience | Readio | Coordinate calls, expose progress,\
      \ and return the specialist results |\n\nA user can stop after any specialist\
      \ stage and continue with its owning CLI. Readio does not mirror specialist result\
      \ models or parse their reports to decide whether a stage is current."
