    section_hash: 2928527732b235411cac5ddebc6e08ad91b03c582a879abe2cedf5e16f2e4215
    summary: readio
    text: "# readio


      `readio` is a terminal text to speech tool. It plays local speech with PyKokoro,
      renders bounded memory WAV, MP3, M4A, or OGG files, and publishes completed audio
      through the external `save-to-spotify` CLI."
    links: []
  - section_id: md:section:README.md::install
    doc_path: README.md
    heading_path:
      - readio
      - Install
    heading_slug: install
    line_span:
      - 5
      - 18
    section_hash: 392dabf0a0ccfbc401a2be07b45a5007dc95c709d60cf0e0a6b62d936dc1b4d4
    summary: Install
    text: '## Install


      ```bash

      python -m pip install -e ".[cpu]"

      ```


      For GPU ONNX Runtime:


      ```bash

      python -m pip install -e ".[gpu]"

      ```


      PyKokoro may download model and voice assets on first use. Spotify publishing
      requires the separately installed `save-to-spotify` executable and its authenticated
      session. Readio never reads Spotify credential files.'
    links: []
  - section_id: md:section:README.md::optional-spacy-linguistic-planning
    doc_path: README.md
