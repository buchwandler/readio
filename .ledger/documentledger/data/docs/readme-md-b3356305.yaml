    section_hash: f8e5b584476793a194450f20cc805061fa1f51ecd32f5510b5380211aab9e31f
    summary: Readio
    text: "# Readio


      Readio is a workflow gateway over specialist speech packages. It orchestrates
      complete text-to-audio and file-to-audio workflows, using a run-scoped temporary
      workspace by default or an explicitly requested persistent SSMDConvert `.ssmd-bundle`.
      User-owned render intents describe the requested workflow without duplicating
      specialist schemas or creating hidden `.readio/` state.


      Specialist packages own validation, schemas, persisted artifacts, reports, and
      kind-sensitive dispatch. Readio coordinates conversion, planning, RenderPlan projection,
      rendering, composition, and optional export. One-shot literal speech and local
      playback remain available."
