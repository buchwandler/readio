    summary: Doctor
    text: "## Doctor


      ```bash

      readio doctor

      ```


      Doctor is offline/local by default and supports `readio doctor --json`. It reports
      Readio configuration, directories, TTS/SSMD dependencies, audio formats, and the
      upstream `save-to-spotify` path/version probe. It does not authenticate, inspect
      credentials, or perform Spotify network operations; use `readio spotify doctor`
      for the explicit external integration check."
