    summary: Agent Skill
    text: "## Agent Skill


      The portable skill is in `skill/readio/SKILL.md`. It uses Readio templates and
      commands directly. It does not teach raw SSMD voice discovery, create, lint, temporary
      file management, or manual cleanup for normal podcast workflows."
    links: []
