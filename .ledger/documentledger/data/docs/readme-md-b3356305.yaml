    section_hash: 09344b056380c31009739f9358488ef688eddbb2e7ba85cc89cbe21ef72d316b
    summary: Readio
    text: "# Readio


      Readio is a thin orchestrator over specialist speech packages and native SSMDConvert
      workspaces. It creates and resolves `.ssmdoc` and `.ssmdbook` bundles, then delegates
      planning, RenderPlan projection, synthesis, composition, and export to the package
      that owns each stage. One-shot literal speech and local playback remain available.


      Readio does not maintain a second project directory, settings file, stage manifest,
      RenderPlan, or audio-job format. Specialist workspaces, artifacts, reports, and
      stage decisions are authoritative."
