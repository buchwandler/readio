    summary: Agent Skill
    text: "## Agent Skill


      The portable skill is in `skill/readio/SKILL.md`. It uses Readio's consumer and
      rendering commands; SSMD creation, templates, portable binding materialization,
      and structural lint are handed off to SSMDStudio 0.1.1."
    links: []
  - section_id: md:section:README.md::ssmd-voice-resolution-and-project-role-targets
    doc_path: README.md
    heading_path:
      - readio
      - SSMD voice resolution and project role targets
    heading_slug: ssmd-voice-resolution-and-project-role-targets
    line_span:
      - 435
      - 476
    section_hash: 0a8e95ddea89302297b43eb8ea4176eb367895ad57bb5143e4be3d6c29231b20
    summary: SSMD voice resolution and project role targets
    text:
      "## SSMD voice resolution and project role targets\n\nDocument-local SSMD\
      \ bindings retain the provider-qualified `voice_bindings` syntax. They keep a\
      \ portable document's speaker choices with the source:\n\n```yaml\nvoice_bindings:\n\
      \  kokoro:\n    moderator: af_sarah\n    architect: am_michael\n```\n\nSSMD syntax\
      \ is unchanged. A role bound in more than one provider namespace in the same document\
      \ is ambiguous; Readio reports an error rather than selecting one. Resolution\
      \ precedence is document binding, invocation `--voice-bind`, project role target,\
      \ global configured role, then a direct semantic reference or context-resolved\
      \ native voice ID. Document bindings remain authoritative.\n\nDiscover runnable\
      \ voices with `readio voices list --json` or filter with `readio voices list --lang\
      \ de`. Semantic references replace numbered voice selectors. For example, bind\
      \ Kokoro with `kokoro:v1.0/af_heart` and Piper with `piper:en_US-amy-medium`.\
      \ Persist global roles with `readio roles bind ROLE REF`; use `--engine ENGINE`\
      \ for a native voice ID when its engine cannot be inferred, and prefer a semantic\
      \ reference when its target must be explicit. `readio roles list` reports engine-qualified\
      \ targets. v0.3 `[voices.<provider>.roles]` settings are converted only by the\
      \ explicit `readio config migrate` command; normal runtime code does not read\
      \ them.\n\nFor deterministic one-run automation, use repeatable `--voice-bind\
      \ ROLE=REF` options. Readio resolves semantic references to engine-qualified targets;\
      \ document bindings continue to take precedence:\n\n```bash\nreadio render --file\
      \ episode.ssmd \\\n  --voice-bind moderator=kokoro:v1.0/af_sarah \\\n  --voice-bind\
      \ architect=kokoro:v1.0/am_michael\n```\n\n`--resolve-voices` prompts only when\
      \ explicitly requested from an interactive TTY. It never persists choices. JSON,\
      \ agents, scripts, and non-TTY execution must use `--voice-bind`. For portable\
      \ source bindings, use `ssmdstudio ssmd bind FILE --provider PROVIDER --voice-bind\
      \ ROLE=VOICE --output OUTPUT.ssmd`; Readio's voice bindings remain invocation-only\
      \ or runtime configuration and ordinary consumption never edits SSMD.\n\nProject-local\
      \ role targets let one SSMD document use multiple synthesis engines without changing\
      \ the semantic SSMD speaker references:\n\n```bash\ncd episode.readio\nreadio\
      \ plan bind host kokoro:v1.0/af_sarah\nreadio plan bind guest piper:en_US-amy-medium\n\
      readio plan roles\nreadio plan\nreadio synth\n```\n\nNew bindings are stored role-centrically\
      \ in `project.json` under `settings.ssmd.role_bindings`, with each target's `engine`,\
      \ canonical `voice`, and optional `target_id`. Selector provenance is not persisted.\
      \ Binding a semantic reference retains its structured engine and target identity\
      \ and does not set a project-wide provider. Use `readio plan bind ROLE REF PROJECT`\
      \ or `--project PROJECT` from outside the project; nested working directories\
      \ are discovered. For native voice IDs, pass `--engine` when needed and use a\
      \ semantic reference if the target is ambiguous.\n\nv0.3 manifests with `settings.ssmd.voice_bindings`\
      \ require explicit `readio project migrate PROJECT`; normal project reads do not\
      \ fall back to provider-keyed data. After migration, `settings.ssmd.role_bindings`\
      \ supports multiple engines without a project-wide provider. Use `readio plan\
      \ roles --engine ENGINE` to filter inspection.\n\n`readio plan bind` does not\
      \ rewrite SSMD or change the semantic plan ID. It changes acoustic synthesis settings,\
      \ so `readio status` leaves planning current and reports synthesis stale; run\
      \ `readio synth` to refresh it. Synthesis routes bound segments through each target's\
      \ engine and uses the normal project synthesis selection for unbound segments.\
      \ Engines and sessions are resolved per route, so a mixed-engine project does\
      \ not require one project-wide provider."
    links: []
  - section_id: md:section:README.md::persistent-incremental-projects
    doc_path: README.md
    heading_path:
      - readio
      - Persistent incremental projects
    heading_slug: persistent-incremental-projects
    line_span:
      - 477
      - 518
    section_hash: 80c7835efdf7fc02a3273fc51e22a6db2de4b9bf8bfc3f47858dc92fe66e5a14
    summary: Persistent incremental projects
    text: "## Persistent incremental projects


      For resumable builds, create a project and use explicit stages:


      ```bash

      readio project init manuscript.md -o manuscript.readio

      cd manuscript.readio

      readio plan                         # semantic only; no TTS

      readio preview manuscript.readio --select first:3 --voice de-ko-01 -o preview.wav

      readio synth manuscript.readio --voice de-ko-01

      readio compose manuscript.readio --target-lufs -18

      readio export manuscript.readio --format mp3

      readio status manuscript.readio --json

      readio render manuscript.readio --format mp3  # build stale stages

      ```


      Chapter-aware audiobook projects accept EPUB files and `.ssmdbook` directories
      or `.ssmdbook.zip` bundles produced by ssmdconvert. EPUB and ZIP inputs are materialized
      as standalone editable `.ssmdbook` directories. Readio attaches disposable project
      state under `.readio/` and indexes the canonical chapter files in place instead
      of copying them.


      ```bash

      readio audiobook chapters novel.epub

      readio audiobook init novel.epub --chapters 2-20

      readio audiobook chapters novel.ssmdbook.zip

      readio audiobook init novel.ssmdbook --chapters 3-4,7

      cd novel.ssmdbook

      readio plan roles

      readio plan

      readio synth --voice en-ko-01

      readio compose

      readio export --format m4a

      readio audiobook export . --format m4b --cover cover.jpg

      # Or build all stale stages with:

      readio render novel.ssmdbook --format m4a

      ```


      Chapter selectors use the available 1-based source chapter numbers reported by
      `readio audiobook chapters` and preserve source order, including non-contiguous
      bundle subsets. Edit canonical chapter files under `chapters/` (or paths listed
      in `manifest.json`). Readio reads edits immediately, refreshes only its local
      index, and replans/resynthesizes affected content. After chapter edits, run `ssmdconvert
      book refresh novel.ssmdbook` to update canonical manifest hashes; Readio never
      does this automatically. Deleting `.readio/` removes local plans, caches, and
      outputs but leaves the editable book intact; `readio audiobook init novel.ssmdbook`
      can recreate that state. Generic EPUB rendering remains one combined document,
      so use audiobook commands for chapter-aware processing.


      Audiobook projects can be exported as M4B with embedded chapters: `readio audiobook
      export . --format m4b`. Title and author default from the book's metadata and
      can be overridden with `--title` and `--author`. Readio's AAC bitrate default
      is 192k; use `--bitrate` to choose another supported bitrate.


      Cover art is explicit-only: pass `--cover cover.jpg` or a PNG path. Readio validates,
      hashes, attaches, and tracks the image. Automatic source cover extraction is not
      part of the current ssmdconvert integration; provide a JPEG/PNG cover explicitly.
      M4B is audiobook-only; generic `readio export` supports WAV, FLAC, MP3, M4A, Ogg/Vorbis,
      and Opus, never M4B.


      See `docs/projects.md` and `docs/incremental-rendering.md` for the project layout,
      cache identities, status diagnostics, and invalidation matrix.

      Project synthesis, composition, and export defaults can be saved before execution
      with `readio project settings set PROJECT ...`; inspect with `readio project settings
      show PROJECT --json`. Requestless project operations use saved settings, while
      explicit invocation overrides remain transient. Audiobook M4B output, metadata,
      cover, and bitrate can also be saved and are checked by `readio status`. See [project
      settings](docs/projects.md#desired-pipeline-settings), [CLI reference](docs/cli.md#saved-project-pipeline-settings),
      and [Python API](docs/api.md#projects-and-audiobooks)."
    links: []
