    section_hash: 719374c76f754af29f35086522dfeacf47f6ba92ebabc712d509a0c0b5768546
    summary: Breaking change in v0.5.0
    text: "## Breaking change in v0.5.0


      This is a clean break. Readio-owned generic projects, `.readio` state, `project.json`,
      legacy plan and render-manifest formats, old project and pipeline commands, and
      the mirrored engine/runtime APIs have been removed. There is no migration command
      or runtime compatibility layer. Readio does not read or attach legacy project
      state. Start from source material and convert it to an SSMDConvert-owned `.ssmdbook`
      workspace, or use the specialist packages directly.


      The old Readio engine, composition, and export implementations are gone. Install
      engine extras through VoiceRender, and use UtterPlan, AudioCompose, and AudioExport
      for their respective specialist operations. See the [v0.5.0 release notes](docs/changelog.md)
      for the full removal list."
