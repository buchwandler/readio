    section_hash: 56900eca48fffad34336a0c1a989157ca320b11c3d4072b7682808af696366a9
    summary: Model discovery and language defaults
    text: '### Model discovery and language defaults


      Readio uses one registry for `kokoro`, `piper`, `pocket`, `supertonic`, `kitten`,
      and `inflect`; model, voice, and lexicon discovery use the selected engine''s
      catalog and capabilities. Run `readio doctor` to check whether an engine package
      and its required public API are available.


      Supported engine package floors are PyKokoro >=0.10.2,<0.11, PiperSynth >=0.2.1,<0.3,
      PocketSynth >=0.2.3,<0.3, SupertonicSynth >=0.1.2,<0.2, KittenSynth >=0.1.1,<0.2,
      and InflectSynth >=0.1.1,<0.2. Each engine package owns its own runtime dependencies;
      Readio does not require OnnxVoice. Install Kokoro or Piper with a runtime extra
      such as `readio[kokoro,cpu]` or `readio[piper,cpu]`, and install Pocket, Supertonic,
      Kitten, and Inflect with `readio[pocket]`, `readio[supertonic]`, `readio[kitten]`,
      or `readio[inflect]`. PDF and DOCX ingestion requires the `readio[documents]`
      extra. `readio[all,cpu]` also installs optional spaCy support.


      `readio voices list` shows runnable voices with semantic references. Canonical
      engine IDs are `kokoro`, `piper`, `pocket`, `supertonic`, `kitten`, and `inflect`;
      upstream package names such as `pykokoro`, `pipersynth`, `supertonicsynth`, and
      `inflectsynth` are accepted only as input aliases where applicable. Filters use
      `--engine`, `--model`, `--lang`, and `--gender`.


      Voice references use `SYSTEM:TARGET[/VOICE]`: `kokoro:v1.0/af_heart`, `piper:en_US-amy-medium`,
      `pocket:english_2026-04/alba`, `supertonic:supertonic-3/F1`, or `inflect:nano-v2/default`.
      The system and target identify the engine and model/bundle; the voice suffix is
      omitted when the target itself is the voice. `readio voices show REF` inspects
      one reference. Native voice IDs can be used when discovery context resolves them
      uniquely; supply engine or target context where the command supports it. References
      identify voices, while `--lang` and `--gender` filter their descriptive metadata.


      Kitten can be inspected and selected without changing the other engine workflows:


      ```bash

      readio voices list --engine kitten

      readio speak --engine kitten --model nano-0.8-int8 --voice Jasper "Hello"

      ```


      Supertonic targets are discovered from its model catalog. Readio maps locale tags
      to the engine''s base-language key, so `en-us` is synthesized as `en`; unsupported
      language bases are rejected.


      ```bash

      readio voices list --engine supertonic --lang en-us

      readio render --engine supertonic --model supertonic-3 --voice F1 --lang en-us
      "Hello"

      ```


      InflectSynth is an optional English-only engine (`readio[inflect]`, or `readio[all,cpu]`).
      Its public catalog supplies the current model targets, including `nano-v2` and
      `micro-v2`; each uses the fixed `default` voice. `inflectsynth` is accepted as
      an input alias for canonical engine ID `inflect`.


      ```bash

      readio voices list --engine inflect --lang en-us

      readio voices show inflect:nano-v2/default

      readio render --engine inflect --model nano-v2 --voice default --lang en-us --speed
      1.1 --voice-level calibrated "Hello from Inflect."

      ```


      InflectSynth supports speed, variation, seed, and calibrated voice-level controls;
      the CLI exposes the shared speed and voice-level options, while variation and
      seed are API engine options. It does not support speaker selection, reference
      voices, pronunciation overrides, or native word timings. Readio owns request boundaries
      and capacity policy; InflectSynth owns G2P and model/runtime internals, with ONNXVoice
      remaining a transitive InflectSynth dependency that Readio neither imports nor
      manages.


      A Pocket bundle advertising generic `en` can satisfy `--lang en-us`; a bundle
      explicitly advertising `en-GB` does not. Generic language metadata stays generic
      and is not assigned unsupported locale specificity.

      Common `--speed` is a positive synthesis multiplier, not a composition tempo:
      Kokoro receives it directly and PiperSynth converts it to `length_scale = 1 /
      speed`. PocketSynth supports only `1.0`; other explicit values fail validation.
      Supertonic and InflectSynth forward the multiplier to their native synthesis APIs.
      `--voice-level off|calibrated` selects the engine''s voice-level handling and
      participates in speech identity.


      Adapters make one strict native synthesis request for each Readio-shaped child
      and do not invoke native text splitters. Readio owns capacity measurement and
      exact-text subdivision, preserves linguistic and pronunciation boundaries, and
      merges child audio and local timings. InflectSynth 0.1.1 does not advertise a
      trustworthy maximum in its public capacity contract, so Readio treats its capacity
      as unknown rather than guessing a token limit. Unsupported explicit semantics
      and unsplittable requests fail with stable Readio errors instead of being discarded
      or truncated.


      ```bash

      readio models list --language de --offline

      readio models show de-thorsten --offline

      readio voices list --model de-thorsten --json

      readio models list --preference huggingface --json

      readio voices list --model de-thorsten --preference github --json

      readio lexicons list --lang de --offline --json

      readio lexicons show crane --lang de --offline --json

      ```


      Piper voice bundles are discovered through PiperSynth without loading ONNX during
      planning:


      ```bash

      readio voices list --engine piper --lang de

      readio voices list --model piper --lang de

      readio voices list --engine piper --model de_DE-thorsten-medium --lang de

      readio render --engine piper --voice de_DE-thorsten-medium --lang de --dry-run
      --json "Hallo Welt"

      readio speak --engine piper --voice de_DE-thorsten-medium --lang de "Hallo Welt"

      readio render --engine piper --voice de_DE-thorsten-medium --lang de --manifest
      -o article.wav "Hallo Welt"

      readio render --engine pipersynth --voice de_DE-thorsten-medium --lang de --dry-run
      --json "Hallo Welt"

      ```


      Pocket targets are bundle IDs. `--voice` selects a bundle''s predefined voice,
      `--voice-file` uses a local reference WAV, and `--voice-prompt` selects a managed
      Kyutai prompt. These selectors are mutually exclusive. Tune only the Pocket-specific
      generation controls you need:


      ```bash

      readio voices list --engine pocket --lang en-us

      readio render --engine pocket --model BUNDLE_ID --voice VOICE --precision int8
      "Hello"

      readio render --engine pocket --model BUNDLE_ID --voice-file reference.wav --temperature
      0.6 --lsd-steps 3 "Hello"

      readio voices prompts --engine pocket --dataset alba

      readio voices prompts --engine pocket --variant casual --license cc-by-4.0

      readio render --engine pocket --model BUNDLE_ID --voice-prompt kyutai-tts-voices:alba-mackenna/casual
      --temperature 0.6

      ```


      Local reference voice files are user or project assets. Readio records their content
      hash in `readio.plan.v2`; local paths are not included in acoustic render identity.
      Managed Pocket prompts are catalog assets: plans pin the prompt reference, SHA-256,
      source revision, and available provenance. Pocket verifies prepared provenance
      and records its normalized-audio fingerprint separately from the source hash.
      This selector applies to the default synthesis voice, not per-role bindings. Piper''s
      published text API does not accept Readio token or pronunciation annotations,
      so explicit pronunciation directives are diagnosed instead of silently discarded.


      Use `--speaker NAME_OR_ID` for a multi-speaker Piper bundle. Live rendering depends
      on the selected engine''s declared capability.


      Use `--refresh` to refresh registry metadata only. `--offline --refresh` is invalid.
      Offline metadata requires a cached registry; offline synthesis additionally requires
      cached model and voice assets.


      Persist a validated default per language. Language keys are normalized, and locale-specific
      profiles fall back to their base language:


      ```bash

      readio defaults set de --model de-thorsten --lexicon crane --offline

      readio defaults show de --json

      readio defaults show de-at --json

      readio render --lang de --file notes.md

      ```


      When a model is selected, Readio fills its normalized source, default voice, and
      preferred quality, then validates language compatibility, voice roster, quality,
      named lexicons, and experimental frontend permission before saving. `--no-lexicons`
      selects explicit provider-only pronunciation (`lexicons=[]`); `--auto-lexicons`
      returns to engine language defaults (`lexicons=null`). Repeat `--lexicon` to preserve
      ordered layered lookup.

      Readio owns pause placement. Its `pause_mode` defaults to `auto`; `tts` leaves
      natural sentence timing to the engine, while `manual` uses explicit semantic boundary
      pauses. A persisted `reader.pause_mode` remains the default for that installation.

      Named lexicons use engine selectors, not backend asset IDs:

      crane = named selection token

      de-de:crane = language-qualified Lexphon asset resolved downstream

      de-crane = separate acoustic model ID


      ````


      For reproducible German synthesis:


      ```bash

      readio models show de-thorsten

      readio defaults set de --model de-thorsten --lexicon crane --g2p-fallback espeak
      --lexicon-data-policy auto

      readio render --file article.md --lang de --dry-run --json

      readio render --file article.md --lang de --model de-thorsten --no-lexicons --g2p-fallback
      espeak --format mp3

      ````


      The plan also records optional PyKokoro language detection. SSMD documents may
      use `language_detection: {mode: auto, languages: [de, en]}`; this routes pronunciation
      fragments while retaining the selected acoustic language.'
    links: []
