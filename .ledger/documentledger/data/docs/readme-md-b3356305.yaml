    section_hash: 297ce8be6f4aab829e66c49f9dd0f7e2f5bcc31f25694a4c22514f181404c9c2
    summary: Install
    text: '## Install


      ```bash

      python -m pip install readio

      python -m pip install "readio[kokoro]"  # or another supported VoiceRender engine
      extra

      ```


      `readio[documents]` enables SSMDConvert''s optional PDF and DOCX support; `readio[spacy]`
      enables UtterPlan''s optional spaCy support. Readio requires Python 3.10 or newer.


      Use `readio.api.inspect_spacy_model(language, tier)` to check a local model and
      `readio.api.ensure_spacy_model(language, tier)` to explicitly provision one. Readio
      conversion and UtterPlan stages do not download models. `PreparationOptions` controls
      conversion speech semantics, spaCy tier, and explicit speech profiles; `ProjectionOptions`
      controls RenderPlan pause timing separately from AudioCompose pause policy.'
