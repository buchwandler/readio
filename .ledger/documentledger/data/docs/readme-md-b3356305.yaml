    heading_slug: quick-start
    line_span:
      - 16
      - 39
    section_hash: 5a5dd9c996b1515c1a67c0d8f7aed5fa625f830acd89d4454ac20e8730b7766e
    summary: Quick start
    text:
      "## Quick start\n\nCreate a VoiceRender RenderProfile, then create and review\
      \ a user-owned Readio render intent. The two TOML files have separate responsibilities:\
      \ the RenderProfile defines voice roles; the intent describes the requested conversion,\
      \ planning, composition, and output.\n\n```bash\nreadio profile create --engine\
      \ kokoro --target v1.0 --voice af_heart \\\n  --language en-US -o narrator.renderprofile.toml\n\
      readio intent document create chapter.docx \\\n  --profile narrator.renderprofile.toml\
      \ --language en-US\nreadio intent show chapter.readio.toml --resolved\nreadio\
      \ intent validate chapter.readio.toml\nreadio render --config chapter.readio.toml\
      \ --dry-run\nreadio render --config chapter.readio.toml\n```\n\nBook intents default\
      \ to M4B and support chapter selection; document intents default to MP3. Without\
      \ an explicit bundle, renders use temporary intermediate storage. Specify `--bundle\
      \ PATH` in the intent or render command to persist an editable workspace; an existing\
      \ bundle supplied as the source is also persistent. UtterPlan's exact projected\
      \ variant is preserved through VoiceRender, AudioCompose, and AudioExport.\n\n\
      ```bash\nreadio intent book create novel.epub \\\n  --profile narrator.renderprofile.toml\
      \ --language en-US --chapters 5-17 \\\n  --bundle novel.ssmd-bundle\nreadio render\
      \ --config novel.readio.toml\n```"
    links: []
  - section_id: md:section:README.md::create-profiles-from-ssmd-voice-roles
    doc_path: README.md
    heading_path:
      - Readio
      - Quick start
      - Create profiles from SSMD voice roles
    heading_slug: create-profiles-from-ssmd-voice-roles
    line_span:
      - 40
      - 82
    section_hash: aff432c32dd98791d1d04c49561daa9f7fe2e4ae50d9cd5e0d51d04bb8f2b51b
    summary: Create profiles from SSMD voice roles
    text:
      "### Create profiles from SSMD voice roles\n\nFor an SSMD document with one\
      \ explicit `narrator` role, inspect and create its profile directly:\n\n```bash\n\
      readio profile document inspect chapter.ssmd.md\nreadio profile document create\
      \ chapter.ssmd.md \\\n  --engine kokoro --target v1.0 --language en-US \\\n  --voice\
      \ narrator=af_heart \\\n  -o chapter.renderprofile.toml\n```\n\nFor a multi-speaker\
      \ source, assign each logical role in one command. Logical roles stay distinct\
      \ even when they intentionally share one physical TTS voice:\n\n```bash\nreadio\
      \ profile document inspect meeting.ssmd.md\nreadio profile document create meeting.ssmd.md\
      \ \\\n  --engine kokoro --target v1.0 --language en-US \\\n  --voice narrator=af_heart\
      \ \\\n  --voice host=af_sarah \\\n  --voice guest=am_michael \\\n  --same-as analyst=guest\
      \ \\\n  --default-role narrator \\\n  -o meeting.renderprofile.toml\n\nreadio\
      \ intent document create meeting.ssmd.md \\\n  --profile meeting.renderprofile.toml\
      \ --language en-US\nreadio intent show meeting.readio.toml --resolved\n```\n\n\
      Here four logical roles use three physical voices: `analyst` receives a copy of\
      \ `guest`'s complete binding. The reviewable VoiceRender RenderProfile remains\
      \ separate from the Readio intent; Readio does not choose voices or create a profile\
      \ automatically.\n\nFor a one-off render without saving a Readio intent, provide\
      \ the source and separate RenderProfile directly:\n\n```bash\nreadio render chapter.docx\
      \ --profile narrator.renderprofile.toml --language en-US\n```\n\n`readio render\
      \ --dry-run` and `readio status` share a read-only workflow inspection; neither\
      \ creates a temporary workspace or mutates artifacts. Use `--rebuild-from STAGE`\
      \ for explicit downstream rebuilds and `--replace-output` separately to authorize\
      \ replacing an existing final output. AudioExport is included in the core installation;\
      \ `--ffmpeg` and `--ffprobe` select tool executables.\n\nIntent files are visible\
      \ user-owned configuration, not hidden workspace state. Readio creates no `.readio/`\
      \ directory. `readio status --config novel.readio.toml` inspects a saved intent,\
      \ while `readio status novel.ssmd-bundle --profile narrator.renderprofile.toml\
      \ --chapters 5-17` inspects an existing persistent workspace."
    links: []
