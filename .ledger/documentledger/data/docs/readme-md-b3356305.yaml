    section_hash: b2b3563f0c09b337f6f134ef95bf24d48d6c64c278ac38bfe85283807688ed58
    summary: Readio shorthand
    text:
      "## Readio shorthand\n\nInstall Readio and the backend through VoiceRender,\
      \ then speak literal text through the current audio device:\n\n```bash\npython\
      \ -m pip install readio \"voicerender[kokoro]>=0.2.0,<0.3\"\nreadio speak --voice\
      \ kokoro:v1.0/af_heart --lang en-US \"Hello from Readio.\"\n```\n\nReadio can\
      \ also run the book stages as one operation:\n\n```bash\nreadio audiobook convert\
      \ novel.epub --chapters 5-17 --output novel.ssmdbook\nreadio audiobook build novel.ssmdbook\
      \ \\\n  --profile narration.renderprofile.toml \\\n  --chapters 5-17 \\\n  --output\
      \ novel.m4b\n```\n\nSee [`readio --help`](docs/cli.md) for the retained commands\
      \ and [`readio.api`](docs/api.md) for Python use. `readio doctor` reports specialist\
      \ package versions and VoiceRender engine availability."
