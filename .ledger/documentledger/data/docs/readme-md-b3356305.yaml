    section_hash: 2a8dd681512c82213f3471abaab5f296e66ebf59c656a0590158177dd53a7057
    summary: Python API
    text:
      "## Python API\n\n```python\nfrom pathlib import Path\nfrom readio.api import\
      \ Readio, RenderRequest\n\nservice = Readio()\nrequest = RenderRequest(\n    source=Path(\"\
      chapter.docx\"),\n    profile=Path(\"narrator.renderprofile.toml\"),\n    bundle=None,\
      \  # temporary by default; pass a path to persist the SSMD bundle\n)\nplan = service.inspect(request)\
      \  # read-only WorkflowPlan\nresult = service.render(request)\nprint(plan.steps,\
      \ result.output, result.workspace_mode)\n```\n\nThe primary gateway API is `Readio.speak()`,\
      \ `Readio.inspect(RenderRequest)`, and `Readio.render(RenderRequest)`. `speak`\
      \ synthesizes semantic text in memory; `inspect` reports specialist-backed workflow\
      \ state without writing; `render` executes the complete file-to-audio workflow.\
      \ Specialist CLIs remain available for deliberate package-level debugging. See\
      \ the [Python API guide](docs/api.md)."
