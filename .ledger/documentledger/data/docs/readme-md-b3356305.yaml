    section_hash: 84eebbb09975da684f7e3c0281e4f17f2ee863b2cb7a2f807bd90c890492145b
    summary: readio
    text: "# readio


      `readio` is a terminal text-to-speech tool. It plans speech with UtterPlan, resolves
      engine targets, and owns segment synthesis orchestration, AudioCompose timelines,
      and output. It plays local speech, renders WAV, FLAC, MP3, M4A, Ogg/Vorbis, or
      Opus files, exports audiobook M4B with embedded chapters, and can publish completed
      audio through the external `save-to-spotify` CLI."
    links: []
  - section_id: md:section:README.md::install
    doc_path: README.md
    heading_path:
      - readio
      - Install
    heading_slug: install
    line_span:
      - 5
      - 20
    section_hash: a05e2ac22e6c9b4dd7b50130b47f35cf9fb904260391615f14abc511afdb86ce
    summary: Install
    text: '## Install


      ```bash

      python -m pip install "readio[kokoro,cpu]"

      ```


      For GPU ONNX Runtime:


      ```bash

      python -m pip install "readio[kokoro,gpu]"

      ```


      For the other engines, install `readio[piper,cpu]`, `readio[pocket]`, `readio[supertonic]`,
      `readio[kitten]`, or `readio[inflect]`. `readio[all,cpu]` installs all supported
      engine packages and optional spaCy planning support for a CPU environment.


      Engine adapters may download target and voice assets on first use. Spotify publishing
      requires the separately installed `save-to-spotify` executable and its authenticated
      session. Readio never reads Spotify credential files.'
    links: []
