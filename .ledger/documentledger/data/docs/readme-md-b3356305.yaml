    section_hash: 44e5334ad0f2bc92c67590db1788fa65d0450b0e224021ecc4881089722d1297
    summary: Configuration
    text: "## Configuration


      Initialize one user-owned Readio configuration and its storage:


      ```bash

      readio config init

      readio config show

      readio config validate

      readio config set reader.voice bf_emma

      readio config set voices.kokoro.roles.analyst am_michael

      readio config set reader.pause_mode auto

      readio config set ssmd.voice_provider kokoro

      ```


      The default configuration uses `platformdirs` for the config, template, ingest,
      and output locations. `READIO_CONFIG` overrides the config file path. Existing
      legacy files containing only `[reader]` continue to load and are upgraded to schema
      2 when saved.


      The configuration contains reader settings, SSMD defaults, provider-specific voice
      IDs, and logical role bindings. Templates refer to roles such as `host`, `analyst`,
      `guest`, and `narrator`, while ordinary literal text continues to use `reader.voice`."
    links: []
