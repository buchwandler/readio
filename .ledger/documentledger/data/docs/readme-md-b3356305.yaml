    section_hash: 97c155e37dc8d0e4e694c4c2463a259fc6983d40c42cb1d053c91ad2f3b48bbd
    summary: Standalone LLM authoring guides
    text: "## Standalone LLM authoring guides


      `llm-guides/ssmd/` contains standalone Markdown instructions for generic LLMs.
      These guides are distinct from the runtime `.ssmd` templates managed by `readio
      template`.


      No Readio or Python installation is needed on the authoring system: choose one
      guide and attach it with the task and source material. When the harness supports
      artifacts, ask it to create and return one downloadable `.ssmd` file; otherwise
      save the raw SSMD response as a file. Rendering and final validation happen later
      on a system where Readio is installed.


      See [`llm-guides/README.md`](llm-guides/README.md) for the catalog and the authoring-to-rendering
      workflow."
    links: []
