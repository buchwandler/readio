    section_hash: 7f6704e1027cdbc96d7d34aae71831a4e809253024b2b1bddd6139f2bdf75850
    summary: Readio
    text: "# Readio


      Readio 0.5.0 is a small speech and audiobook convenience layer over specialist
      packages. SSMDConvert owns `.ssmdbook` workspaces, UtterPlan owns semantic compilation
      and RenderPlan projection, VoiceRender owns voice resolution and synthesis, AudioCompose
      owns composition, and AudioExport owns encoded exports. Readio keeps a direct
      speech command and orchestration across those APIs."
