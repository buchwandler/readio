    section_hash: e7e4d3a864d35f2c6e2c48c267c07e60170eafee7b58666050f75eb59b324a93
    summary: Command migration
    text: "### Command migration


      | Former Readio command | SSMDStudio 0.1.1 replacement / boundary |

      |---|---|

      | `readio template path/list/show/add/remove/reset` | Corresponding `ssmdstudio
      template` command (`path`, `list`, `show`, `add`, `remove`, `reset`) |

      | `readio template validate [NAME]` / `--all` | `ssmdstudio template validate
      [NAME]` / `--all`; `--roundtrip` is optional structural validation |

      | `readio template use NAME --name FILE` | `ssmdstudio template use NAME --output
      FILE` |

      | `readio ingest new --name FILE [--template NAME]` | `ssmdstudio draft new --output
      FILE [--template NAME]` |

      | `readio ingest path/list` | Studio has no managed ingest directory; use filesystem
      paths. Existing user files and directories are left untouched. |

      | `readio ssmd bind FILE --voice-bind ROLE=ID` | `ssmdstudio ssmd bind FILE --provider
      PROVIDER --voice-bind ROLE=ID [--output FILE]` |

      | `readio ssmd check FILE --roundtrip` | `ssmdstudio ssmd lint FILE --roundtrip`
      for authoring lint; `readio ssmd check` remains consumer preflight without `--roundtrip`.
      |


      `readio config init` initializes Readio configuration and its runtime output location
      only. Legacy `paths.templates`, `paths.ingest`, and `ssmd.validate_before_render`,
      `ssmd.roundtrip`, or `ssmd.fail_on_warn` entries warn, are ignored, and are omitted
      from new configuration writes. Readio does not move, rewrite, or delete existing
      authoring files."
    links: []
  - section_id: md:section:README.md::planning-before-rendering
    doc_path: README.md
    heading_path:
      - readio
      - Planning before rendering
    heading_slug: planning-before-rendering
    line_span:
      - 251
      - 322
    section_hash: 270586076c20402db69902603c7d02ff6a4169b3f148a64360e19f8ab98893ca
    summary: Planning before rendering
    text:
      "## Planning before rendering\n\nEvery non-live `readio render` resolves an\
      \ explicit synthesis plan before TTS work. Use `readio render --dry-run` to inspect\
      \ the same plan without loading a model; a normal render executes exactly the\
      \ plan it resolved:\n\n```bash\nreadio render --file episode.ssmd --format mp3\
      \ --dry-run --json\nreadio render --file episode.ssmd --dry-run          # human\
      \ output\nreadio render --file episode.ssmd                    # resolves the\
      \ same plan, then executes it\n```\n\nPlanning, discovery, defaults, and render\
      \ results are distinct layers:\n\n- **`readio models` / `readio voices` (discovery)**\
      \ list what the installed engine runtime _could_ provide — model IDs, languages,\
      \ voices, qualities, lexicons, status.\n- **`readio defaults` (defaults)** persist\
      \ validated per-language policy that resolution _prefers_.\n- **`readio plan`\
      \ (project planning)** builds semantic plans for persistent projects and provides\
      \ `roles`, `bind`, and `unbind` for project-local SSMD cast settings. It does\
      \ not resolve one-shot engine/model/output choices or load TTS.\n- **`readio render`\
      \ (render result)** executes the plan; the plan JSON's synthesis, SSMD bindings,\
      \ and output path are the values actually used. A render that fails planning exits\
      \ 1 with the plan and its diagnostics instead of loading TTS.\n\n`readio.plan.v2`\
      \ JSON exposes `schema`, `ok`, `input`, `planning`, `semantic_plan`, `render`\
      \ (with engine-neutral target), `output` (format, encoder backend, path, path\
      \ origin, `force`), `environment` (generic package versions), `decisions` (winning\
      \ source per field), and `diagnostics`:\n\n```json\n{\n  \"schema\": \"readio.plan.v2\"\
      ,\n  \"ok\": true,\n  \"operation\": \"render\",\n  \"input\": {\n    \"source_path\"\
      : \"article.md\",\n    \"source_kind\": \"file\",\n    \"requested_format\": \"\
      markdown\",\n    \"format\": \"markdown\",\n    \"source_sha256\": \"...\",\n\
      \    \"selector\": \"all\"\n  },\n  \"planning\": { \"language\": \"de\", \"unit\"\
      : \"sentence\", \"pause_mode\": \"auto\" },\n  \"semantic_plan\": {\n    \"format\"\
      : \"utterplan\",\n    \"schema_version\": 4,\n    \"plan_id\": \"...\",\n    \"\
      sha256\": \"...\",\n    \"path\": \"plan/document.utterplan.toml\"\n  },\n  \"\
      render\": {\n    \"engine\": \"piper\",\n    \"target\": {\n      \"id\": \"de_DE-thorsten-medium\"\
      ,\n      \"language\": \"de\",\n      \"voice\": \"thorsten\"\n    },\n    \"\
      rate\": 1.0,\n    \"options\": { \"ssmd_voice_bindings\": { \"narrator\": \"thorsten\"\
      \ } }\n  },\n  \"output\": {\n    \"mode\": \"file\",\n    \"format\": \"mp3\"\
      ,\n    \"encoder_backend\": \"soundfile\",\n    \"path\": \".../article.mp3\"\
      ,\n    \"path_origin\": \"explicit\",\n    \"force\": false\n  },\n  \"environment\"\
      : { \"packages\": {}, \"ffmpeg_available\": true },\n  \"decisions\": [\n    {\n\
      \      \"field\": \"ssmd.bindings.narrator\",\n      \"origin\": \"cli\",\n  \
      \    \"locator\": \"request.voice_bindings\"\n    }\n  ],\n  \"diagnostics\":\
      \ []\n}\n```\n\nOne-shot planning is deterministic and non-interactive. Use repeatable\
      \ `--voice-bind ROLE=VOICE_ID` options for invocation-only choices or persist\
      \ project-local role choices with `readio plan bind`; `--resolve-voices` is rejected\
      \ by `render --dry-run`."
    links: []
  - section_id: md:section:README.md::durable-render-manifests
    doc_path: README.md
    heading_path:
      - readio
      - Durable render manifests
    heading_slug: durable-render-manifests
    line_span:
      - 323
      - 336
    section_hash: b3bfd2332dd969f182f41cc12b95543ba904501c71d5ccd3e699e21860076287
    summary: Durable render manifests
    text: "## Durable render manifests


      For bounded renders that will be reused, published, compared, or handed to another
      agent, request an opt-in post-render manifest:


      ```bash

      readio render --file episode.ssmd --format mp3 --dry-run --json

      readio render --file episode.ssmd --format mp3 --manifest

      readio render --file episode.ssmd --format mp3 --manifest --json

      ```


      A successful render writes the audio and a colocated `<audio>.readio.json` sidecar.
      The sidecar uses schema `readio.render-manifest.v2` and records the exact executed
      `readio.plan.v2`, its canonical SHA-256, the semantic plan identity, the final
      encoded audio hash and byte count, render summary facts, document metadata, and
      final marker offsets. The plan is pre-execution intent; the manifest is post-execution
      evidence.


      Human stdout remains only the audio path. JSON render output remains one object
      and adds `manifest` with the sidecar schema and path, or `null` when the flag
      is absent. `--manifest` is available only for bounded rendering, not `--live`,
      `speak`, planning, dry runs, or publishing. If sidecar writing fails, Readio preserves
      the committed audio and returns `render.manifest_error`."
    links: []
  - section_id: md:section:README.md::multi-format-audio-output
    doc_path: README.md
    heading_path:
      - readio
      - Multi-format audio output
    heading_slug: multi-format-audio-output
    line_span:
      - 337
      - 357
    section_hash: ec724cabdbfc3ff762e283e862e2adf981fdcb3b18c5ebcc5c5393a9c8c5a759
    summary: Multi-format audio output
    text: '## Multi-format audio output


      The output path is optional and WAV remains the default:


      ```bash

      readio render "Hello from a file."

      readio render --file "$draft" -o episode.wav

      readio render "Hello" -o episode.mp3

      readio render --file episode.ssmd --format m4a

      readio render "Hello" --format ogg

      ```


      Project exports support lossless FLAC and Opus in addition to the existing formats:


      ```bash

      readio export project.readio --format flac

      readio export project.readio --format opus --bitrate 96k

      ```


      `.ogg` remains Ogg/Vorbis; `.opus` selects Opus and is a separate format. Readio''s
      generic Opus default is 96k; this is Readio''s setting, not a claim of TTSForge
      default parity.'
    links: []
  - section_id: md:section:README.md::progress
    doc_path: README.md
    heading_path:
      - readio
      - Progress
    heading_slug: progress
    line_span:
      - 358
      - 374
    section_hash: ffafaf5c2db2c93d4f5040cd5facd00899a0bbcc4431ae1d4803dfcad88a13cc
    summary: Progress
    text: '## Progress


      `render`, `synth`, `preview`, `compose`, project render, and `spotify` report
      low-noise progress on stderr. It is enabled automatically on an interactive terminal.
      Use `--progress` to force it or `--no-progress` to suppress it:


      ```bash

      readio compose manuscript.readio

      readio compose manuscript.readio --progress

      readio compose manuscript.readio --no-progress

      readio compose manuscript.readio --json --progress

      readio render --file episode.ssmd -o episode.mp3 --progress

      readio spotify publish --file episode.ssmd --title "Episode" --json

      ```


      Composition progress shows the current speech segment, active operation, completed
      and total segments, elapsed time, and an approximate ETA after enough segment
      work has completed. The ETA covers segment processing only. Assembly, complete-output
      loudness and true-peak processing, and composition artifact writing are shown
      as separate final stages.


      `--json` keeps stdout to one machine-readable result object. Progress remains
      on stderr, automatic progress is disabled in JSON mode, and explicit `--progress`
      remains stderr-only. Verbose mode uses line-oriented stderr output instead of
      in-place terminal rewriting.'
    links: []
  - section_id: md:section:README.md::verbose-diagnostics
    doc_path: README.md
    heading_path:
      - readio
      - Verbose diagnostics
    heading_slug: verbose-diagnostics
    line_span:
      - 375
      - 389
    section_hash: 61a30112ca540ec9dbb7daae1393fca564feee31856ead61347910f89500f953
    summary: Verbose diagnostics
    text: '## Verbose diagnostics


      Use the global repeatable verbosity option for live operational diagnostics:


      ```bash

      readio -v speak "Hello"

      readio -vv render episode.ssmd -o episode.mp3

      readio speak "literal --verbose" --

      ```


      `-v` shows timestamped lifecycle records at INFO level. `-vv` enables DEBUG-level
      Readio and selected engine details; additional repetitions are clamped to DEBUG.
      Verbose records always go to stderr, so ordinary output and `--json` results remain
      on stdout and stay machine-parseable. `--progress` is a separate user-facing progress
      control. When verbose mode and progress are combined, progress uses line-oriented
      stderr records instead of in-place terminal rewriting. Logs can contain paths
      and model or voice identifiers, so review them before sharing and never treat
      verbose mode as permission to expose document text, audio, or credentials.

      When `-o` is supplied, `.wav`, `.flac`, `.mp3`, `.m4a`, `.ogg`, and `.opus` suffixes
      select the corresponding render encoder. `.ogg` means Ogg/Vorbis; `.opus` is distinct.
      Use `--format` when the output path is omitted or to select the automatic filename
      suffix. An explicit format and suffix must agree. Extensionless output paths receive
      the selected suffix, and unsupported suffixes fail before synthesis. Automatic
      names use the configured output directory and never overwrite an existing file.
      Explicit output remains atomic and requires `--force` for replacement.


      M4A and Opus require an `ffmpeg` executable on `PATH`. WAV and FLAC use PCM16;
      MP3 and Ogg/Vorbis use the installed SoundFile/libsndfile codecs.'
    links: []
  - section_id: md:section:README.md::ssmd-consumer-checks
    doc_path: README.md
    heading_path:
      - readio
      - SSMD consumer checks
    heading_slug: ssmd-consumer-checks
    line_span:
      - 390
      - 403
    section_hash: 2a670ea7adcc8480d4eafb2f782945297fe5002e43b636fd5f5ef60f67393353
    summary: SSMD consumer checks
    text: "## SSMD consumer checks


      For `.ssmd` and `.ssmd.md` inputs, Readio compiles SSMD through UtterPlan, resolves
      document-local `voice_bindings` and missing invocation or configured roles, then
      lowers semantic segments to neutral engine requests. Document bindings remain
      authoritative, and unsupported explicit semantics fail before a synthesis session
      opens. Normal `speak`, `render`, and `spotify` commands do not rewrite source
      SSMD. Readio always performs consumer compatibility and voice checks during planning;
      the explicit check is a no-audio preflight:


      Readio requires SSMD >=0.9.3,<0.10 and UtterPlan >=0.4.0,<0.5/schema v4. SSMD
      0.8 syntax, raw `<div>` directives, and legacy prosody aliases are rejected, not
      rewritten or migrated. Indexed legacy UtterPlan JSON artifacts (including schema
      v1–3) are reported stale and require source re-planning with `readio plan`; normal
      loading does not migrate them. This does not change Readio's own `readio.plan.v2`
      response schema.


      ```bash

      readio ssmd check episode.ssmd

      readio ssmd check episode.ssmd --json

      ```


      Structural and roundtrip authoring lint belongs to SSMDStudio (`ssmdstudio ssmd
      lint FILE --roundtrip`). Unknown logical roles fail before model inference with
      a Readio diagnostic."
    links: []
  - section_id: md:section:README.md::spotify-publishing
    doc_path: README.md
    heading_path:
      - readio
      - Spotify publishing
    heading_slug: spotify-publishing
    line_span:
      - 404
      - 422
    section_hash: d20762ba3d24bcdb106b470a78ee3a8d60a3031579feaa8b5451abb45fc3095a
    summary: Spotify publishing
    text: '## Spotify publishing


      Publishing is explicit and uses the clean command family:


      ```bash

      readio spotify publish --file "$draft" --title "Weekly Review" --format mp3 --wait

      producer-command | readio spotify publish --live --title "Live episode" --format
      mp3

      readio spotify upload recording.m4a --title "Lecture 3" --show-id spotify:show:abc
      --wait 2m

      readio spotify shows --json

      readio spotify status spotify:episode:abc --wait

      readio spotify doctor --json

      ```


      Publish renders and uploads Readio source. Direct upload starts from caller-owned
      WAV, MP3, M4A, or OGG and never deletes or overwrites it. Without `--output`,
      generated publish media is temporary and deleted after success or failure; with
      `--output`, it is retained. `--chapters-from-markers` and caller-owned `--timeline
      FILE` are mutually exclusive, and either timeline path waits for READY before
      publishing. `--wait` optionally accepts a duration; `--wait-timeout` is deprecated.
      `--api-timeout` controls an upstream request separately from readiness waiting.


      `spotify publish --live` reads plain-text stdin and leaves live rendering, engine
      capability checks, and temporary audio-file ownership to the application services.
      Without `--output`, generated audio is temporary and removed after success or
      failure; with `--output`, the file is retained.


      Readio invokes `save-to-spotify --json`, reports its detected version in diagnostics,
      and does not inspect credentials, expose tokens, or perform authentication.'
    links: []
  - section_id: md:section:README.md::doctor
    doc_path: README.md
    heading_path:
      - readio
      - Doctor
    heading_slug: doctor
    line_span:
      - 423
      - 430
    section_hash: 68ebe4f88bfc02fe55f445f50801ed24ec27313bca3b453c9b1127a656b7d093
    summary: Doctor
    text: "## Doctor


      ```bash

      readio doctor

      ```


      Doctor is offline/local by default and supports `readio doctor --json`. It reports
      Readio configuration, directories, TTS/SSMD dependencies, audio formats, and the
      upstream `save-to-spotify` path/version probe. For synthesis engines it reports
      the package/module versions and path, request API contract, missing public symbols
      or methods, and the stage and cause of probe failures. Probing is offline and
      does not download models or run inference. It does not authenticate, inspect credentials,
      or perform Spotify network operations; use `readio spotify doctor` for the explicit
      external integration check."
    links: []
