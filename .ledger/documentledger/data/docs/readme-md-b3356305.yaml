    section_hash: c5564a1b8616c9dd63f68536c195105554f83a78f22f0d3e00157d2d848d80ff
    summary: Manual specialist workflow
    text:
      "## Manual specialist workflow\n\nUse the specialist CLIs when you need package-specific\
      \ controls. Preserve UtterPlan's exact variant through every stage:\n\n```bash\n\
      ssmdconvert book convert novel.epub -o novel.ssmdbook\nutterplan compile-book\
      \ novel.ssmdbook\nvoicerender profile create --engine kokoro --target v1.0 --voice\
      \ af_heart \\\n  --language en-US -o novel.ssmdbook/narrator.renderprofile.toml\n\
      utterplan render-book novel.ssmdbook \\\n  --profile novel.ssmdbook/narrator.renderprofile.toml\n\
      \nVARIANT=\"<exact variant returned by utterplan render-book>\"\nvoicerender render-book\
      \ novel.ssmdbook --variant \"$VARIANT\"\naudiocompose compose-book novel.ssmdbook\
      \ --variant \"$VARIANT\"\naudioexport export-book novel.ssmdbook --variant \"\
      $VARIANT\" --output novel.m4b\n```"
    links: []
