    section_hash: 23489e499c6f32d8949057dd0711925948ef8fa0345cf32e5ab12d3817391135
    summary: Quick start
    text:
      "## Quick start\n\nCreate a native document workspace, create a VoiceRender\
      \ profile, and run the pipeline:\n\n```bash\nreadio init chapter.docx -o chapter.ssmdoc\n\
      readio profile create --engine kokoro --target v1.0 --voice af_heart \\\n  --language\
      \ en-US -o narrator.renderprofile.toml\nreadio run chapter.ssmdoc --profile narrator.renderprofile.toml\
      \ --language en-US\n```\n\nFor a book, convert the EPUB first. Keeping its RenderProfile\
      \ in the workspace also makes its provenance available to UtterPlan:\n\n```bash\n\
      readio init novel.epub -o novel.ssmdbook\nreadio profile create --engine kokoro\
      \ --target v1.0 --voice af_heart \\\n  --language en-US -o novel.ssmdbook/narrator.renderprofile.toml\n\
      readio run novel.ssmdbook --profile novel.ssmdbook/narrator.renderprofile.toml\
      \ \\\n  --chapters 5-17 --language en-US --export --output novel.m4b\n```\n\n\
      `run` compiles, projects the RenderPlan, renders, and composes in order. If export\
      \ is selected, Readio also runs AudioExport. It forwards UtterPlan's exact projected\
      \ variant unchanged to every downstream stage. To operate one stage at a time\
      \ or inspect the available options, see the [CLI reference](docs/cli.md)."
    links: []
