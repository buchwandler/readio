    section_hash: 9ce16c4738b91c5a030efc12c73519bfddff1a068b32ae6bd61524dd663381ee
    summary: Breaking change in v0.5.0
    text: "## Breaking change in v0.5.0


      SSMDConvert owns conversion and workspace bundles; UtterPlan owns semantic plans
      and variants; RenderPlan and VoiceRender own their public contracts, profiles,
      and synthesis; AudioCompose owns composition; AudioExport owns encoding. Readio
      coordinates these public APIs and does not reproduce their schemas or validations.


      Version 0.5 is a deliberate clean break. Existing Readio project directories,
      settings, plans, manifests, and stage records are unsupported; there is no migration
      command or compatibility layer. Start from source material and create a native
      workspace with `readio init`, or use the specialist packages directly."
