    section_hash: dd46cb124b331d15eddd42f3318d68b5f2c51a7aa06c4f65e415ca97cfb00613
    summary: Model discovery and language defaults
    text: '### Model discovery and language defaults


      PyKokoro >=0.9.11,<0.10 is the runtime contract and owns the model, language,
      voice, quality, frontend, and named-lexicon catalog. Readio also requires OnnxVoice
      >=0.1.6,<0.2 for the runtime model and timing integration. Discovery is metadata-only
      and does not download model weights:

      Readio v0.2.5 is tested against PyKokoro 0.9.11.


      Readio selects synthesis through an explicit engine registry. PyKokoro and Piper
      are the supported engines; engine identity is recorded separately from distribution
      provider metadata so future adapters can be added without changing selectors or
      configuration.


      The canonical engine IDs are `pykokoro` and `piper`. The alias `pipersynth` is
      accepted as a compatibility alias for `piper`.


      ```bash

      readio models list --language de --offline

      readio models show de-thorsten --offline

      readio voices list --model de-thorsten --json

      readio models list --preference huggingface --json

      readio voices list --model de-thorsten --preference github --json

      readio lexicons list --lang de --offline --json

      readio lexicons show crane --lang de --offline --json

      ```


      Piper voice bundles are discovered through PiperSynth without loading ONNX during
      planning:


      ```bash

      readio voices list --engine piper --lang de

      readio render --engine piper --voice de_DE-thorsten-medium --lang de --dry-run
      --json --text "Hallo Welt"

      readio speak --engine piper --voice de_DE-thorsten-medium --lang de "Hallo Welt"

      readio render --engine piper --voice de_DE-thorsten-medium --lang de --manifest
      -o article.wav --text "Hallo Welt"

      readio render --engine pipersynth --voice de_DE-thorsten-medium --lang de --dry-run
      --json --text "Hallo Welt"

      ```


      Use `--speaker NAME_OR_ID` for a multi-speaker Piper bundle. Piper live mode is
      not supported yet; use bounded input.


      Use `--refresh` to refresh registry metadata only. `--offline --refresh` is invalid.
      Offline metadata requires a cached registry; offline synthesis additionally requires
      cached model and voice assets.


      Persist a validated default per language. Language keys are normalized, and locale-specific
      profiles fall back to their base language:


      ```bash

      readio defaults set de --model de-thorsten --lexicon crane --offline

      readio defaults show de --json

      readio defaults show de-at --json

      readio render --lang de --file notes.md

      ```


      When a model is selected, Readio fills its normalized source, default voice, and
      preferred quality, then validates language compatibility, voice roster, quality,
      named lexicons, and experimental frontend permission before saving. `--no-lexicons`
      selects explicit provider-only pronunciation (`lexicons=[]`); `--auto-lexicons`
      returns to engine language defaults (`lexicons=null`). Repeat `--lexicon` to preserve
      ordered layered lookup.

      Readio defaults `pause_mode` to `auto`, enabling PyKokoro''s automatic pause analysis.
      Use `--pause-mode tts` to leave pause timing to the acoustic model or `--pause-mode
      manual` for explicit boundary pauses. A persisted `reader.pause_mode` remains
      the default for that installation.

      Named lexicons use engine selectors, not backend asset IDs:

      crane = named selection token

      de-de:crane = language-qualified Lexphon asset resolved downstream

      de-crane = separate acoustic model ID


      ````


      For reproducible German synthesis:


      ```bash

      readio models show de-thorsten

      readio defaults set de --model de-thorsten --lexicon crane --g2p-fallback espeak
      --lexicon-data-policy auto

      readio render --file article.md --lang de --dry-run --json

      readio render --file article.md --lang de --model de-thorsten --no-lexicons --g2p-fallback
      espeak --format mp3

      ````


      The plan also records optional PyKokoro language detection. SSMD documents may
      use `language_detection: {mode: auto, languages: [de, en]}`; this routes pronunciation
      fragments while retaining the selected acoustic language.'
