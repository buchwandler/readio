    section_hash: 516269ac0a37f6c27cc304b0b4ff84947cb6af8939aeb48f5df2596bc95e472f
    summary: Optional spaCy linguistic planning
    text: '### Optional spaCy linguistic planning


      Install the optional Utterplan spaCy support when local grammatical annotations
      are desired:


      ```bash

      python -m pip install "readio[spacy]"

      ```


      Install a compatible local spaCy language model separately. Readio never downloads
      models implicitly. The default `reader.spacy = "auto"` tries the best locally
      installed model and falls back to Utterplan''s analyzer when none is available.
      The explicit `sm`, `md`, `lg`, and `trf` settings require the selected local model
      tier and fail if it is unavailable. `off` disables spaCy analysis.


      `readio plan` stores token annotations and linguistic provenance in the Utterplan
      v2 artifact. Rendering an existing project plan consumes those stored annotations
      and does not rerun spaCy when the engine, voice, or acoustic settings change.
      Direct one-shot commands such as `readio speak` may use the selected backend''s
      local frontend because they do not consume a persisted semantic plan.'
    links: []
  - section_id: md:section:README.md::playback
    doc_path: README.md
    heading_path:
      - readio
      - Playback
    heading_slug: playback
    line_span:
      - 31
      - 63
    section_hash: 709832a62e6c1bb1a7d3dd19120fbda4a805d22f52af84964c429f7d6eccd697
    summary: Playback
    text: '## Playback


      ```bash

      readio speak "Hello from the terminal."

      printf ''%s\n'' "Read this from stdin." | readio speak

      readio speak --file notes.md              # parsed as Markdown

      readio speak --file notes.md --input-format text  # literal text fallback

      readio speak --file notes.md --select last-paragraph

      readio speak --file notes.md --select paragraph:3

      producer-command | readio speak --live

      ```


      A single existing positional token is also treated as a file path by `speak`,
      `render`, and `spotify publish`, including `.ssmd` and Markdown files:


      ```bash

      readio speak README.md

      readio render episode.ssmd -o episode.mp3

      readio spotify publish episode.ssmd --title "Episode"

      ```


      For scripts, prefer the explicit `--file PATH` form. A missing path-like token
      fails instead of being spoken as a filename. Use `--input-format text` to force
      an existing filename to remain literal text.


      Readio parses `.md`, `.markdown`, `.mdown`, and `.mkd` as Markdown before synthesis.
      Headings, lists, links, images, code blocks, block quotes, tables, task lists,
      HTML text, and front matter are projected into speech-friendly text. Ordinary
      Markdown is isolated from SSMD controls; use `.ssmd` when explicit voices, rate,
      volume, pitch, breaks, or markers are required.


      Markdown can also be supplied explicitly through stdin or literal input:


      ```bash

      cat README.md | readio speak --input-format markdown

      readio render --input-format markdown ''# Title'' ''This is **important**.''

      ```


      Use `--input-format text` when a Markdown-looking file should be read as literal
      text.'
    links: []
