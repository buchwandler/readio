    section_hash: a723ddbe3e7ca31c3d466d8098f034db004ded63d83825b12a2d4ef1795cd76c
    summary: Python API
    text:
      "## Python API\n\n```python\nfrom readio.api import BookBuildRequest, build_book,\
      \ convert_book, open_book, speak\n\nworkspace = convert_book(\"novel.epub\", \"\
      novel.ssmdbook\", chapters=\"5-17\")\nbook = open_book(workspace.path)\nresult\
      \ = build_book(\n    BookBuildRequest(\n        workspace=book.path,\n       \
      \ profile=\"narration.renderprofile.toml\",\n        chapters=\"5-17\",\n    \
      \    output=\"novel.m4b\",\n    )\n)\nprint(result.variant)\n\nspeak(\"A short\
      \ sentence.\", voice=\"kokoro:v1.0/af_heart\", language=\"en-US\")\n```\n\n`build_book`\
      \ returns the original specialist result objects inside a small Readio orchestration\
      \ result. Specialist exceptions are not translated into Readio-specific error\
      \ codes."
