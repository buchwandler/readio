    section_hash: cd1aca5801c8aa158ef2906a3c6ea84e9cfa37e4566fee8f5ecf1ffebaf29995
    summary: Templates
    text: '## Templates


      Built-in templates are copied into the user template directory during initialization.
      They are user-owned and are not overwritten by normal initialization or package
      upgrades.


      ```bash

      readio template path

      readio template list

      readio template show podcast

      readio template add custom --file custom.ssmd

      readio template remove custom

      readio template reset podcast

      readio template reset --all

      ```


      Create an agent-editable draft with an automatic filename:


      ```bash

      draft="$(readio template use podcast)"

      ```


      The returned path is under the configured ingest directory. A caller can request
      a filename with `readio template use podcast --name weekly-review.ssmd`.'
    links: []
