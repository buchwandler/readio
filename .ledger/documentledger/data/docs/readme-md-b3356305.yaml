    section_hash: 713755162b45287d4018c0a71eb09f3d9d1bee15bd77ac60ed2c26fc7b050ba2
    summary: Python API
    text:
      "## Python API\n\n```python\nfrom pathlib import Path\nfrom readio.api import\
      \ PlanRequest, Readio, RenderPlanRequest\n\nservice = Readio()\nworkspace = service.create_workspace(\"\
      chapter.txt\")  # writes chapter.ssmdoc\ncompiled = service.plan(workspace, PlanRequest(language=\"\
      en-US\"))\nprojection = service.render_plan(\n    workspace,\n    RenderPlanRequest(profile=Path(\"\
      narrator.renderprofile.toml\")),\n)\nprint(workspace.root, projection.variant)\n\
      ```\n\nUse `Readio.run()` and `RunRequest` for complete sequencing. The service\
      \ returns specialist results and preserves the exact UtterPlan-projected variant.\
      \ See the [Python API guide](docs/api.md)."
