    section_hash: a1f3b62876abd84c070b007bba4c820475a7c996b91346ead83eba9cc9919530
    summary: CLI help and discovery
    text: "## CLI help and discovery


      ```bash

      readio

      readio --help

      readio COMMAND --help

      readio engines

      readio formats

      ```


      Running `readio` without arguments shows the command overview. `readio engines`
      lists known synthesis engines, and `readio formats` lists generic audio and audiobook
      output formats. See [CLI reference](docs/cli.md) for help behavior and examples."
