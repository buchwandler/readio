    section_hash: 2f83c97f05f8473d51033ff41770067abf3a7c95e6b86d6a4eb552ab00e6fe96
    summary: ONNX Runtime controls
    text: "## ONNX Runtime controls


      Inspect the ONNX Runtime distribution/build and provider policy, or choose providers
      for future compatible sessions:


      ```bash

      readio runtime status

      readio runtime list

      readio runtime use cpu

      readio runtime use cuda

      readio runtime use auto

      readio runtime use cuda,cpu

      readio runtime reset

      ```


      An installed ONNX Runtime distribution/build is distinct from its execution providers.
      `runtime status` reports the imported build and its available providers; `runtime
      list` shows detected distributions and providers reported by that build. A selected/resolved
      provider policy is for new sessions, not proof of an active inference session.
      Readio does not install, uninstall, or switch ONNX Runtime distributions; package
      changes are managed outside Readio. Environment variables such as `ONNXVOICE_PROVIDER`
      override the saved preference, and `runtime reset` does not unset environment
      variables. Explicit `--engine-option providers=...` or a provider configured in
      a RenderProfile remains an intentional override of the global default."
    links: []
