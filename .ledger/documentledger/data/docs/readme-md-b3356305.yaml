    section_hash: c1fad5de947fa7aa02fafe973c99610ab5208f23b4347e790f6d6cc84042e9ed
    summary: Multi-format audio output
    text: '## Multi-format audio output


      The output path is optional and WAV remains the default:


      ```bash

      readio render "Hello from a file."

      readio render --file "$draft" -o episode.wav

      readio render "Hello" -o episode.mp3

      readio render --file episode.ssmd --format m4a

      readio render "Hello" --format ogg

      ```'
    links: []
  - section_id: md:section:README.md::progress
    doc_path: README.md
    heading_path:
      - readio
      - Progress
    heading_slug: progress
    line_span:
      - 283
      - 299
    section_hash: ffafaf5c2db2c93d4f5040cd5facd00899a0bbcc4431ae1d4803dfcad88a13cc
    summary: Progress
    text: '## Progress


      `render`, `synth`, `preview`, `compose`, project render, and `spotify` report
      low-noise progress on stderr. It is enabled automatically on an interactive terminal.
      Use `--progress` to force it or `--no-progress` to suppress it:


      ```bash

      readio compose manuscript.readio

      readio compose manuscript.readio --progress

      readio compose manuscript.readio --no-progress

      readio compose manuscript.readio --json --progress

      readio render --file episode.ssmd -o episode.mp3 --progress

      readio spotify publish --file episode.ssmd --title "Episode" --json

      ```


      Composition progress shows the current speech segment, active operation, completed
      and total segments, elapsed time, and an approximate ETA after enough segment
      work has completed. The ETA covers segment processing only. Assembly, complete-output
      loudness and true-peak processing, and composition artifact writing are shown
      as separate final stages.


      `--json` keeps stdout to one machine-readable result object. Progress remains
      on stderr, automatic progress is disabled in JSON mode, and explicit `--progress`
      remains stderr-only. Verbose mode uses line-oriented stderr output instead of
      in-place terminal rewriting.'
    links: []
  - section_id: md:section:README.md::verbose-diagnostics
    doc_path: README.md
    heading_path:
      - readio
      - Verbose diagnostics
    heading_slug: verbose-diagnostics
    line_span:
      - 300
      - 314
    section_hash: 3fd298d508b34e4c62f41afabfcec484d9319bd1e7e7d102d421f42b81ffb533
    summary: Verbose diagnostics
    text: '## Verbose diagnostics


      Use the global repeatable verbosity option for live operational diagnostics:


      ```bash

      readio -v speak "Hello"

      readio -vv render episode.ssmd -o episode.mp3

      readio speak "literal --verbose" --

      ```


      `-v` shows timestamped lifecycle records at INFO level. `-vv` enables DEBUG-level
      Readio and PyKokoro details; additional repetitions are clamped to DEBUG. Verbose
      records always go to stderr, so ordinary output and `--json` results remain on
      stdout and stay machine-parseable. `--progress` is a separate user-facing progress
      control. When verbose mode and progress are combined, progress uses line-oriented
      stderr records instead of in-place terminal rewriting. Logs can contain paths
      and model or voice identifiers, so review them before sharing and never treat
      verbose mode as permission to expose document text, audio, or credentials.

      When `-o` is supplied, its `.wav`, `.mp3`, `.m4a`, or `.ogg` suffix selects the
      encoder. Use `--format` when the output path is omitted or to select the automatic
      filename suffix. An explicit format and suffix must agree. Extensionless output
      paths receive the selected suffix, and unsupported suffixes fail before synthesis.
      Automatic names use the configured output directory and never overwrite an existing
      file. Explicit output remains atomic and requires `--force` for replacement.


      M4A output requires an `ffmpeg` executable on `PATH`. WAV uses PCM16, while MP3
      and OGG use the installed SoundFile/libsndfile codecs.'
    links: []
  - section_id: md:section:README.md::ssmd-consumption-and-authoring-checks
    doc_path: README.md
    heading_path:
      - readio
      - SSMD consumption and authoring checks
    heading_slug: ssmd-consumption-and-authoring-checks
    line_span:
      - 315
      - 328
    section_hash: 5e5ce6232f56575d798096538c5fa157edbb0a145686882f4368ffebdd26a078
    summary: SSMD consumption and authoring checks
    text: "## SSMD consumption and authoring checks


      For `.ssmd` inputs, Readio parses the document through the supported SSMD 0.8.x
      API and passes a PyKokoro 0.9 `SSMDRenderConfig` containing only missing Readio
      role defaults. Document `voice_bindings` remain authoritative, invocation `--voice-bind`
      values override configured provider roles, and concrete targets must belong to
      the active model roster. Normal `speak`, `render`, and `spotify` commands do not
      invoke `ssmd create`, rewrite the source, or require generic round-trip validation.


      Inspect a document before rendering:


      ```bash

      readio ssmd check episode.ssmd

      readio ssmd check episode.ssmd --json

      readio ssmd check episode.ssmd --roundtrip

      ```


      `readio template validate --all` checks shipped or configured templates with the
      same consumer preflight. Add `--roundtrip` for strict SSMD authoring validation.
      Unknown logical roles fail before model inference with a Readio diagnostic."
    links: []
  - section_id: md:section:README.md::spotify-publishing
    doc_path: README.md
    heading_path:
      - readio
      - Spotify publishing
    heading_slug: spotify-publishing
    line_span:
      - 329
      - 344
    section_hash: 963591b142fefc56fc9389dd1c4dc1248237cea5160f098df44e706af59fb841
    summary: Spotify publishing
    text: '## Spotify publishing


      Publishing is explicit and uses the clean command family:


      ```bash

      readio spotify publish --file "$draft" --title "Weekly Review" --format mp3 --wait

      readio spotify upload recording.m4a --title "Lecture 3" --show-id spotify:show:abc
      --wait 2m

      readio spotify shows --json

      readio spotify status spotify:episode:abc --wait

      readio spotify doctor --json

      ```


      Publish renders and uploads Readio source. Direct upload starts from caller-owned
      WAV, MP3, M4A, or OGG and never deletes or overwrites it. Without `--output`,
      generated publish media is temporary and deleted after success or failure; with
      `--output`, it is retained. `--chapters-from-markers` and caller-owned `--timeline
      FILE` are mutually exclusive, and either timeline path waits for READY before
      publishing. `--wait` optionally accepts a duration; `--wait-timeout` is deprecated.
      `--api-timeout` controls an upstream request separately from readiness waiting.


      Readio invokes `save-to-spotify --json`, reports its detected version in diagnostics,
      and does not inspect credentials, expose tokens, or perform authentication.'
    links: []
