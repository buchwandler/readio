    section_hash: 8ccc558f0d1a63132fb46d62db956550019408d8a20268e13a87c0e12147a3fe
    summary: Creating SSMD documents
    text:
      "## Creating SSMD documents\n\nReadio consumes SSMD and renders audio; **SSMDStudio\
      \ owns authoring**: creating drafts, managing starter templates and LLM prompts,\
      \ writing portable voice bindings, and structural/roundtrip lint. The handoff\
      \ is a portable `.ssmd` or `.ssmd.md` file. Readio does not depend on or import\
      \ SSMDStudio. SSMDStudio **0.1.1** is the verified handoff version; install its\
      \ authoring tools on the authoring system. If bundled starters are not in the\
      \ user library, restore them intentionally with `ssmdstudio template reset --all`:\n\
      \n```bash\npython -m pip install \"ssmdstudio[authoring]==0.1.1\"\nssmdstudio\
      \ template list\nssmdstudio template use podcast --output episode.ssmd.md\nssmdstudio\
      \ draft new --output notes.ssmd.md\nssmdstudio draft new --output another-episode.ssmd.md\
      \ --template podcast\nssmdstudio ssmd lint episode.ssmd.md --roundtrip --json\n\
      ```\n\nTo write explicit portable bindings, choose voices for the selected provider.\
      \ Studio writes the source but does not verify that Readio can use those voices;\
      \ Readio performs that consumer-specific check:\n\n```bash\nssmdstudio ssmd bind\
      \ episode.ssmd.md --provider kokoro \\\\\n  --voice-bind host=af_heart --output\
      \ episode.bound.ssmd.md\nssmdstudio ssmd lint episode.bound.ssmd.md --roundtrip\
      \ --json\nreadio ssmd check episode.bound.ssmd.md --json\nreadio render --file\
      \ episode.bound.ssmd.md --dry-run --json\n```"
    links: []
