    section_hash: 8734ec18d95b8c9ba683ac000ba77b57df315994d148215b995e1de324ec56d6
    summary: Doctor
    text: "## Doctor


      ```bash

      readio doctor

      ```


      Doctor is offline. It reports Readio configuration, configured directories and
      their existence, PyKokoro, SSMD module and executable availability, the selected
      provider, voice IDs, logical roles, sound dependencies, and `save-to-spotify`.
      It does not create directories, modify configuration, inspect credentials, or
      call the network."
    links: []
