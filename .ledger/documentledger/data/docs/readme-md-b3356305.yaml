      - readio
      - Playback
    heading_slug: playback
    line_span:
      - 52
      - 88
    section_hash: 3c6d4e76efb6da89082d6e861ad03f8c89faec41e9b44ad6e4f3502171990104
    summary: Playback
    text: '## Playback


      ```bash

      readio speak "Hello from the terminal."

      printf ''%s\n'' "Read this from stdin." | readio speak

      readio speak --file notes.md              # parsed as Markdown

      readio speak --file notes.md --input-format text  # literal text fallback

      readio speak --file notes.md --select last-paragraph

      readio speak --file notes.md --select paragraph:3

      producer-command | readio speak --live

      ```


      `speak` submits synthesized segments to Readio''s bounded audio-device queue as
      they are produced; playback does not wait for the whole document and does not
      apply whole-program mastering. File rendering remains a separate full-document
      path that keeps mastering. Both paths share speech synthesis and composition semantics,
      while Readio owns playback setup and queueing.


      A single existing positional token is also treated as a file path by `speak`,
      `render`, and `spotify publish`, including `.ssmd`, `.ssmd.md`, and Markdown files:


      ```bash

      readio speak README.md

      readio render episode.ssmd -o episode.mp3

      readio spotify publish episode.ssmd --title "Episode"

      ```


      For scripts, prefer the explicit `--file PATH` form. A missing path-like token
      fails instead of being spoken as a filename. Use `--input-format text` to force
      an existing filename to remain literal text.


      In auto mode, filesystem documents are converted to canonical SSMD by `ssmdconvert`
      before synthesis. This includes supported text, Markdown, HTML, PDF, DOCX, EPUB,
      and SSMD files. Explicit `--input-format text`, `markdown`, or `ssmd` forces textual
      interpretation instead of conversion. Headings, lists, links, images, code blocks,
      block quotes, tables, task lists, HTML text, and front matter are projected according
      to the converter; ordinary Markdown remains isolated from SSMD controls.


      Auto-converted `InputDocument` values retain public `DocumentProvenance`: source
      format, media type, source name, converter and version, and converter metadata.
      Explicit text, Markdown, or SSMD input is not mislabeled as converted.


      Markdown can also be supplied explicitly through stdin or literal input:


      ```bash

      cat README.md | readio speak --input-format markdown

      readio render --input-format markdown ''# Title'' ''This is **important**.''

      ```


      Use `--input-format text` when a Markdown-looking file should be read as literal
      text.'
