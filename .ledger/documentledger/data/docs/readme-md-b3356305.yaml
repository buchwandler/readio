    section_hash: 0293e40d73de6bba3d5d279a599cfa018403c4f40217aaa1c26a3b60f570922e
    summary: Manual specialist workflow
    text:
      "## Manual specialist workflow\n\nUse specialist CLIs for package-specific\
      \ controls. Preserve UtterPlan's exact variant through every stage:\n\n```bash\n\
      ssmdconvert bundle convert novel.epub -o novel.ssmd-bundle\nutterplan bundle compile\
      \ novel.ssmd-bundle\nvoicerender profile create --engine kokoro --target v1.0\
      \ --voice af_heart \\\n  --language en-US -o novel.ssmd-bundle/narrator.renderprofile.toml\n\
      utterplan bundle render novel.ssmd-bundle \\\n  --profile novel.ssmd-bundle/narrator.renderprofile.toml\n\
      \nVARIANT=\"<exact variant returned by utterplan bundle render>\"\nvoicerender\
      \ bundle render novel.ssmd-bundle --variant \"$VARIANT\"\naudiocompose bundle\
      \ compose novel.ssmd-bundle --variant \"$VARIANT\"\naudioexport bundle export\
      \ novel.ssmd-bundle --variant \"$VARIANT\" --output novel.m4b\n```"
    links: []
