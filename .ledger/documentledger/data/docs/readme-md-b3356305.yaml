    section_hash: 940bcadb316b08f031122c9950d073e2e5543e1e244e0c3e5cd4b705dc679110
    summary: Configuration
    text: "## Configuration


      Initialize one user-owned Readio configuration and its storage:


      ```bash

      readio config init

      readio config show

      readio config validate

      readio config set reader.voice bf_emma

      readio roles bind analyst am_michael --engine kokoro

      readio config set reader.pause_mode auto

      ```


      The default configuration uses `platformdirs` for config and runtime output locations.
      `READIO_CONFIG` overrides the configuration path. New files use schema 3 and canonical
      engine IDs. v0.3 configuration requires the explicit `readio config migrate` command;
      Readio does not silently apply legacy provider fallbacks.


      Schema-3 configuration contains reader settings, paths, language policies, and
      engine-qualified global role bindings. A role target stores its canonical `engine`,
      `voice`, and optional `target_id`; provider-specific voice tables are not runtime
      configuration. Run `readio config migrate` to convert a v0.3 config explicitly.
      Portable SSMD documents can use roles such as `host`, `analyst`, `guest`, and
      `narrator`, while literal narration may use `reader.voice`.

      Project manifests also use schema 3. Before opening a v0.3 project, run `readio
      project migrate PROJECT`; both migration commands preserve a backup and stop on
      conflicts rather than guessing."
    links: []
