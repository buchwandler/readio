    section_hash: 73580e98205244c879ab86a3ca2fddbcbc47bd01c474c8690cd40c44a5ec52e0
    summary: Python API
    text:
      "## Python API\n\n```python\nfrom pathlib import Path\nfrom readio.api import\
      \ Readio, RenderRequest\n\nservice = Readio()\nrequest = RenderRequest(\n    source=Path(\"\
      chapter.docx\"),\n    profile=Path(\"narrator.renderprofile.toml\"),\n    bundle=None,\
      \  # temporary by default; pass a path to persist the SSMD bundle\n)\nplan = service.inspect(request)\
      \  # read-only WorkflowPlan\nresult = service.render(request)\nprint(plan.steps,\
      \ result.output, result.workspace_mode)\n```\n\nThe primary gateway API is `Readio.synthesize()`,\
      \ `Readio.inspect(RenderRequest)`, and `Readio.render(RenderRequest)`. `synthesize`\
      \ returns semantic audio in memory without playback or output files; `Readio.speak()`\
      \ optionally plays that result. `inspect` reports specialist-backed workflow state\
      \ without writing; `render` executes the complete file-to-audio workflow. Specialist\
      \ CLIs remain available for deliberate package-level debugging. See the [Python\
      \ API guide](docs/api.md).\n\n`Readio.list_models()` and `Readio.model_status()`\
      \ provide normalized engine-model records; `Readio.install_model()`, `Readio.verify_model()`,\
      \ and `Readio.remove_model()` delegate explicit actions to VoiceRender. VoiceRender\
      \ 0.2.12 does not provide authoritative update semantics, model sizes, or storage\
      \ identity, so those values remain unknown; `Readio.update_model()` reports unsupported\
      \ operation rather than treating force-install as update. `readio models list`\
      \ uses normalized human output, while `--json` preserves the legacy provider result\
      \ and `--normalized-json` opts into `readio.engine-models.v1`. See the [model\
      \ API contract](docs/api.md#engine-model-inventory-and-lifecycle).\n\nSource inventory\
      \ and saved intents use the same gateway:\n\n```python\nfrom pathlib import Path\n\
      from readio.api import Readio, load_render_intent, render_request_from_intent\n\
      \nservice = Readio()\nsource = service.inspect_source(Path(\"novel.epub\"))\n\
      intent_path = Path(\"novel.readio.toml\")\nintent = load_render_intent(intent_path)\n\
      request = render_request_from_intent(intent, config_path=intent_path)\nplan =\
      \ service.inspect(request)\n```\n\n`inspect_source()` is read-only and does not\
      \ create a workspace. `inspect_intent()` and `render_intent()` are convenience\
      \ methods over the same `RenderRequest` mapping and canonical inspect/render workflow.\
      \ Use `service.render_intent(intent, dry_run=True)` for a read-only workflow plan."
