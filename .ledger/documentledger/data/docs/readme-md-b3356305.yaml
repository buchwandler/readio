    section_hash: 2c3995e7b9b83bc43d3db29d5d6ac2e8fab791d009290035b1278ebc3f596186
    summary: Install
    text: '## Install


      ```bash

      python -m pip install readio

      python -m pip install "readio[kokoro]"  # or another supported VoiceRender engine
      extra

      python -m pip install "readio[audioexport]"  # optional export stage

      ```


      `readio[documents]` enables SSMDConvert''s optional PDF and DOCX support; `readio[spacy]`
      enables UtterPlan''s optional spaCy support. Backend engines are provided by VoiceRender
      extras. Readio requires Python 3.10 or newer.'
    links: []
  - section_id: md:section:README.md::quick-start
