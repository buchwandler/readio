    section_hash: 86531d4aa9bfaa839fa4117447d69a7b1932c16df9bcda9b2a5d395dc90d9339
    summary: SSMD voice resolution
    text:
      "## SSMD voice resolution\n\nUse document-local bindings when a portable SSMD\
      \ file should carry its speaker choices:\n\n```yaml\nvoice_bindings:\n  kokoro:\n\
      \    moderator: af_sarah\n    architect: am_michael\n```\n\nDiscover runnable\
      \ registry voices and stable selectors with `readio voices list --json` or `readio\
      \ voices list --lang de`. For Kokoro, a real en-US identity is `en_us-ko-4` ->\
      \ `af_heart` (Kokoro v1.0); `--lang en-us` filters the inventory, while `en_us-ko-4`\
      \ is the normalized stable selector. Inspect it with `readio voices show en_us-ko-4\
      \ --json`. Kokoro selectors use `<lang>-ko-<slot>` and Piper selectors use `<lang>-pi-<slot>`;\
      \ these identities come from the authoritative voice registry, while canonical\
      \ engine voice IDs remain visible and accepted. Persist reusable SSMD roles with\
      \ `readio roles bind ROLE VOICE_ID` and inspect them with `readio roles list`.\
      \ Selectors are stable short lookup aliases; persisted configuration and SSMD\
      \ continue to use canonical concrete voice IDs. For deterministic one-run automation,\
      \ use repeatable options:\nRuntime voice inventories are model-specific. Use `readio\
      \ voices list --model MODEL --json` for concrete IDs; a configured portable role\
      \ such as `host` must be bound to a voice supported by the selected model. Readio\
      \ reports the active model and valid voices before inference when a binding is\
      \ incompatible.\n\n```bash\nreadio render --file episode.ssmd \\\n  --voice-bind\
      \ moderator=af_sarah \\\n  --voice-bind architect=am_michael\n```\n\n`--resolve-voices`\
      \ prompts only when explicitly requested from an interactive TTY. It never persists\
      \ choices. JSON, agents, scripts, and non-TTY execution must use `--voice-bind`\
      \ instead. Document bindings remain authoritative, and unresolved roles are reported\
      \ before TTS or external publishing work begins. `readio ssmd bind FILE --voice-bind\
      \ ROLE=VOICE_ID -o OUTPUT.ssmd` explicitly materializes bindings into a new source\
      \ file; ordinary consumption never edits SSMD.\n\n\nProject-local role choices\
      \ belong to the project rather than portable SSMD or user-global config:\n\n```bash\n\
      cd episode.readio\nreadio plan roles\nreadio plan bind narrator en_us-ko-4\nreadio\
      \ plan unbind narrator\nreadio plan\n```\n\nResolution precedence is document\
      \ binding, invocation `--voice-bind`, project binding, global configured role,\
      \ then direct concrete voice. `readio plan bind` does not rewrite SSMD or change\
      \ the semantic plan ID. It changes acoustic synthesis settings, so `readio status`\
      \ leaves planning current and reports synthesis stale; run `readio synth` to refresh\
      \ it."
    links: []
