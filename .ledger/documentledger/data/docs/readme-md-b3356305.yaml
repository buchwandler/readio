    section_hash: 348b3c1cf531ea8e064e75169e1abedf91905a9d00514029ff19c444b3a419a1
    summary: Manual specialist workflow
    text:
      "## Manual specialist workflow\n\nThe specialist commands are the detailed\
      \ and canonical workflow. Install the stack and one VoiceRender engine extra:\n\
      \n```bash\npython -m pip install \\\n  \"ssmdconvert>=0.2.0,<0.3\" \\\n  \"utterplan>=0.6.3,<0.7\"\
      \ \\\n  \"voicerender>=0.2.0,<0.3\" \\\n  \"audiocompose>=0.3.0,<0.4\" \\\n  \"\
      audioexport>=0.1.2,<0.2\"\npython -m pip install \"voicerender[kokoro]>=0.2.0,<0.3\"\
      \n```\n\nConvert a book, compile it, and create a VoiceRender profile:\n\n```bash\n\
      ssmdconvert book convert novel.epub --chapters 5-17 -o novel.ssmdbook\nutterplan\
      \ compile-book novel.ssmdbook --chapters 5-17\nvoicerender profile create \\\n\
      \  --engine kokoro \\\n  --target v1.0 \\\n  --voice af_heart \\\n  --language\
      \ en-US \\\n  -o narration.renderprofile.toml\nutterplan render-book novel.ssmdbook\
      \ \\\n  --chapters 5-17 \\\n  --profile narration.renderprofile.toml\n```\n\n\
      Use the exact variant returned by UtterPlan for every later stage:\n\n```bash\n\
      VARIANT=\"<exact variant returned by utterplan render-book>\"\nvoicerender render-book\
      \ novel.ssmdbook --chapters 5-17 --variant \"$VARIANT\" \\\n  --emphasis-policy\
      \ defer-to-compose\naudiocompose compose-book novel.ssmdbook --chapters 5-17 --variant\
      \ \"$VARIANT\"\naudioexport export-book novel.ssmdbook --chapters 5-17 --variant\
      \ \"$VARIANT\" \\\n  --output novel.m4b\n```\n\nSpecialist artifacts and reports\
      \ remain authoritative. Use specialist CLIs and profiles when you need package-specific\
      \ controls or detailed diagnostics."
