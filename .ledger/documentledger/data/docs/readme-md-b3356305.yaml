    section_hash: c170b457d69e05cadaa5b5d3cf4bfee7e5692499b8bf5f29cfe31befd723ce8b
    summary: Direct speech
    text: '### Direct speech


      ```bash

      readio speak --voice kokoro:v1.0/af_heart --lang en-US "Hello from Readio."

      ```


      `speak` sends literal text through VoiceRender and plays the returned audio locally
      by default. Use `--output FILE.wav --no-play` to save without playback. Readio
      also retains playback and audio I/O helpers for Python callers.'
