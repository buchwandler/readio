    section_hash: 496a26c7ffbf32b69a5f098f743c208585828cf7e68df9b0627b2b564188b0ee
    summary: Installation options
    text: "## Installation options


      Readio requires Python 3.10 or newer. Install only the core convenience layer
      with `python -m pip install readio`, then install a backend extra through VoiceRender,
      for example `voicerender[kokoro]`, `voicerender[piper]`, or `voicerender[inflect]`.
      Readio does not mirror backend packages as its own extras.


      The `readio[spacy]` extra passes through UtterPlan's optional spaCy support.
      The `readio[documents]` extra passes through SSMDConvert's PDF and DOCX support.
      Neither is required for EPUB audiobook conversion or direct literal-text speech."
    links: []
