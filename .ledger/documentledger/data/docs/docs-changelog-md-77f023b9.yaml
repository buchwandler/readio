    summary: Changed
    text: '### Changed


      - Changed Readio''s runtime integration for fixed timestamp-capable releases and
      OnnxVoice diagnostics

      - Requires OnnxVoice 0.1.8+ and exposes additive stable en-US Kokoro selectors
      through voices list --engine kokoro --lang en-us without changing de-ko-\* identities

      - Added observable composition progress for segment processing, operations, assembly,
      loudness, and artifact writing'
