    section_hash: 30ec2aea7fbe75a402c7b69947611448d53762c5477660273af0a3d7f022b896
    summary: ONNX Runtime provider controls
    text: "## ONNX Runtime provider controls


      ```bash

      readio runtime status

      readio runtime status --json

      readio runtime list

      readio runtime list --json

      readio runtime use cpu

      readio runtime use cuda

      readio runtime use auto

      readio runtime use cuda,cpu

      readio runtime reset

      ```


      `runtime status` distinguishes the imported ONNX Runtime distribution/build from
      its available providers, configured policy, source, and providers resolved for
      new sessions. `runtime list` lists detected distributions and providers reported
      by the imported build; its `SELECTED` column is not an active-session report.
      Provider availability is determined by the imported build. `runtime use` saves
      a default policy for future compatible sessions and does not install, uninstall,
      or switch runtime distributions. Environment variables such as `ONNXVOICE_PROVIDER`
      override saved configuration; `runtime reset` removes the saved preference but
      does not unset environment variables. An explicit `--engine-option providers=...`
      or provider set in a RenderProfile overrides the global default. Runtime package/distribution
      changes are performed outside Readio."
    links: []
