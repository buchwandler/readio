    text: "# CLI reference


      Readio exposes four operations: `speak`, `audiobook convert`, `audiobook build`,
      and `doctor`.


      ```bash

      readio --help

      readio speak --help

      readio audiobook --help

      readio audiobook convert --help

      readio audiobook build --help

      readio doctor --help

      ```"
