    summary: CLI reference
    text: "# CLI reference


      Readio's primary workflow surface is centered on `render`, `status`, and `speak`.
      Specialist CLIs remain available when developers deliberately need direct stage-level
      control; Readio does not duplicate those stage commands.


      ```bash

      readio --help

      readio intent --help

      readio render --help

      readio status --help

      readio speak --help

      readio doctor --help

      ```"
