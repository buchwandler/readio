    section_hash: 4d732066989af5248b5845dbcc2b614866cb1d6e1b6c631de157f96d412bd2d6
    summary: Audiobook build
    text:
      "## Audiobook build\n\n```bash\nreadio audiobook build novel.ssmdbook --profile\
      \ narration.renderprofile.toml\nreadio audiobook build novel.ssmdbook --profile\
      \ narration.renderprofile.toml \\\n  --chapters 5-17 --output novel.m4b\nreadio\
      \ audiobook build novel.ssmdbook --profile narration.renderprofile.toml \\\n \
      \ --stop-after synth --json\n```\n\nThe build calls UtterPlan compile and RenderPlan\
      \ projection, VoiceRender synthesis, AudioCompose composition, then AudioExport.\
      \ Use the exact RenderPlan variant returned by UtterPlan when resuming with specialist\
      \ tools.\n\nOptions include `--chapters`, `--profile`, `--variant`, `--force`,\
      \ `--fail-fast`, `--stop-after`, `--output`, `--export-profile`, `--cover`, `--bitrate`,\
      \ `--json`, and `--no-progress`. `--stop-after` accepts `compile`, `render-plan`,\
      \ `synth`, `compose`, or `export`. The profile is a VoiceRender RenderProfile.\
      \ Use specialist profiles and CLIs for more detailed backend, composition, or\
      \ export settings.\n\nJSON output contains the workspace path, returned variant,\
      \ and the names of stages whose specialist result objects were returned. Readio\
      \ does not interpret specialist report schemas or persist a parallel stage status."
