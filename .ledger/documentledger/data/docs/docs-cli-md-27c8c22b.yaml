    summary: CLI reference
    text: "# CLI reference


      Readio's CLI creates or resolves native `.ssmdoc` and `.ssmdbook` workspaces
      and dispatches each stage to its owning specialist package. Use `readio --help`
      and command-specific help for the installed option set.


      ```bash

      readio --help

      readio init --help

      readio plan --help

      readio render-plan --help

      readio run --help

      readio speak --help

      readio doctor --help

      ```"
