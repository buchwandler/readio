    section_hash: 276b3d1c0655fc843171748f06856a33318ad0ffb52b935b5b130f389febf6a8
    summary: Create and plan
    text: "### Create and plan


      ```bash

      readio init article.docx -o article.ssmdoc

      readio plan article.ssmdoc --language en-US

      readio init novel.epub -o novel.ssmdbook

      readio plan novel.ssmdbook --language en-US --chapters 5-17

      ```


      `init` delegates conversion and bundle writing to SSMDConvert. It infers EPUB
      as a book and other supported inputs as documents unless `--kind` is supplied.
      Outputs use the matching `.ssmdoc` or `.ssmdbook` suffix. `plan` delegates compilation
      to UtterPlan; its planner options include language, diagnostics, text preparation,
      overlap/renderability policy, and optional spaCy controls."
    links: []
