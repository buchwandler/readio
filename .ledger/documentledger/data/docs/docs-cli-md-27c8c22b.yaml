    section_hash: 8fca4e1a6d542752d129bb82f43c7f97146686d692b59f95e26ffea48adde5ab
    summary: Verbose diagnostics and timing
    text: "## Verbose diagnostics and timing


      Global `-v`/`--verbose` and `-vv` flags are accepted before or after nested commands.
      `-v` emits INFO diagnostics and elapsed command/stage timings; `-vv` adds DEBUG
      dispatch and inspection details plus tracebacks for unexpected errors. Diagnostic
      output is sent to stderr, leaving normal results and JSON on stdout.


      ```bash

      readio -v status novel.ssmd-bundle --profile narrator.renderprofile.toml

      readio -vv render novel.epub --bundle novel.ssmd-bundle --profile narrator.renderprofile.toml
      --dry-run

      ```


      `--no-progress` suppresses progress callbacks only; verbose diagnostics and timing
      remain enabled. Timings use a monotonic clock and are not persisted."
    links: []
