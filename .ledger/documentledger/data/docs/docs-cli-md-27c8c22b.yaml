    text: "## Dependency diagnostics


      ```bash

      readio doctor

      readio doctor --json

      ```


      Doctor reports specialist package versions, VoiceRender engine availability, and
      compact ONNX Runtime distribution and provider-policy status. A missing or failed
      runtime is shown with a concise diagnostic instead of crashing the report."
