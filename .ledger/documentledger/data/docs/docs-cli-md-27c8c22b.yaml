    summary: Audiobook conversion
    text: "## Audiobook conversion


      ```bash

      readio audiobook convert novel.epub

      readio audiobook convert novel.epub --output novel.ssmdbook --chapters 5-17 --lang
      en-US

      readio audiobook convert novel.epub --json

      ```


      The default workspace path replaces the source suffix with `.ssmdbook`. Conversion
      and workspace structure belong to SSMDConvert. `--chapters` and `--lang` are forwarded
      to its public API."
