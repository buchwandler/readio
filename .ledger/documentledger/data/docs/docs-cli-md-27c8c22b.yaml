    section_hash: 9dd3be223790ba3ecce56b9c23865aab135674a43ee7270ceb06f4b2f833d067
    summary: Removed commands
    text: "## Removed commands


      The current CLI has no `config`, `audiobook`, or former generic project/plan/render-manifest
      command groups. Readio does not read a `readio.toml` or `.readio` state, and provides
      no migration path for its former project format. Use `readio init` to create a
      new native workspace from source material, or use the specialist packages directly."
