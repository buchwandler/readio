    section_hash: 7753f3ba556377f130f44a7622610259b8a155f718f366b6605cb8d2e5349940
    summary: Voice and profile management
    text: '## Voice and profile management


      These command groups delegate to VoiceRender:


      - `engines` and `models` discover, inspect, install, verify, and remove engine
      models.

      - `voices` discovers voices; `voice source` creates and inspects voice-source
      artifacts; `voice clone` creates a specialist RenderProfile.

      - `profile` creates, inspects, validates, refreshes, and manages RenderProfile
      roles.


      Use command-specific help for selectors and options. Install engine backends through
      VoiceRender extras, for example `python -m pip install "voicerender[kokoro]"`.'
    links: []
