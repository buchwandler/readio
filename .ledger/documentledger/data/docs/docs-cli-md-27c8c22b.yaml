    summary: Dependency diagnostics
    text: '## Dependency diagnostics


      ```bash

      readio doctor

      readio doctor --json

      ```


      The doctor reports installed versions of SSMDConvert, UtterPlan, VoiceRender,
      AudioCompose, and AudioExport. It also lists VoiceRender engines and their installation,
      status, version, and compatibility information. Install a missing engine through
      VoiceRender, for example `python -m pip install "voicerender[pocket]"`.'
