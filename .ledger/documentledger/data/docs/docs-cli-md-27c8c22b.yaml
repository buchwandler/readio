    section_hash: 33017f8f2a21e37eda0177256dd54a1c933e04b0156ba213c941002676241a0b
    summary: Source-aware profiles for SSMD documents
    text:
      "### Source-aware profiles for SSMD documents\n\n`profile document` inspects\
      \ explicit voice-role blocks in an existing `.ssmd.md` source using UtterPlan.\
      \ Inspection does not infer speakers from prose or download language/engine models.\
      \ Roles appear in source order, with `narrator` first when present; the block\
      \ counts are useful for reviewing a cast:\n\n```bash\nreadio profile document\
      \ inspect SOURCE [--json]\n```\n\nCreate a complete native VoiceRender RenderProfile\
      \ in one command:\n\n```text\nreadio profile document create SOURCE\n  --engine\
      \ ENGINE --target TARGET --language LANGUAGE\n  [--voice ROLE=VOICE]...\n  [--same-as\
      \ ROLE=ROLE]...\n  [--speaker ROLE=SPEAKER]...\n  [--option ROLE:KEY=VALUE]...\n\
      \  [--default-role ROLE] [--offline] [--refresh]\n  -o OUTPUT [--force] [--json]\n\
      ```\n\nCommon engine, target, and language values are required; Readio does not\
      \ guess them. A bare `--voice ROLE=VOICE` inherits the command engine and target.\
      \ A full VoiceRender selector such as `--voice narrator=kokoro:v1.0/af_heart`\
      \ supplies that role's engine and target and overrides those defaults. `--speaker`\
      \ is mutually exclusive with `--voice` for a role. `--option` repeats for role-specific\
      \ engine options.\n\nEvery discovered role needs a direct voice/speaker binding\
      \ or an explicit alias. For example, four logical roles can share three physical\
      \ voices:\n\n```bash\nreadio profile document create meeting.ssmd.md \\\n  --engine\
      \ kokoro --target v1.0 --language en-US \\\n  --voice narrator=af_heart --voice\
      \ host=af_sarah \\\n  --voice guest=am_michael --same-as analyst=guest \\\n  --default-role\
      \ narrator -o meeting.renderprofile.toml\n```\n\n`--same-as analyst=guest` copies\
      \ the complete `guest` binding while preserving `analyst` as a separate logical\
      \ role. Missing, duplicate, unknown, conflicting, or cyclic assignments fail before\
      \ the final profile is written. Existing output is protected unless `--force`\
      \ is supplied. Profile serialization and validation remain VoiceRender-owned.\n\
      \nInspect output can be JSON for tools; it includes `source`, `roles` with block\
      \ counts, and `default_role_candidate`. Create JSON additionally reports `output`,\
      \ `discovered_roles`, `bound_roles`, `aliases`, `default_role`, and the VoiceRender\
      \ `profile_id` when available.\n\nKeep the two artifacts separate: review the\
      \ generated `*.renderprofile.toml`, then create an intent with `readio intent\
      \ document create SOURCE --profile PROFILE`. Intent creation without `--profile`\
      \ gives an actionable next command for SSMD sources, but does not choose voices\
      \ or create either artifact automatically."
    links: []
