    section_hash: d0746ce4029f5a6b362542421f2144a94094e73e23d4b7bfd2a8bf1f77faa721
    summary: Direct speech
    text: '## Direct speech


      `speak` joins positional arguments with spaces, resolves them through VoiceRender,
      synthesizes literal text, and plays the returned audio through the current device.


      ```bash

      readio speak "Hello from Readio."

      readio speak --voice kokoro:v1.0/af_heart --lang en-US "Hello from Readio."

      readio speak --engine inflect --target micro-v2 --voice default --lang en "Hello."

      ```


      Options:


      - `--voice SELECTOR`: neutral VoiceRender selector in `engine:target[/voice]`
      form, or a voice value interpreted by VoiceRender.

      - `--engine ENGINE` and `--target TARGET`: explicit engine and target. These override
      the corresponding fields in `--voice`.

      - `--lang LANGUAGE`: language passed to VoiceRender. Defaults to `en-US`.

      - `--speaker SPEAKER`: optional VoiceRender speaker selector.

      - `--offline`: restrict resolution to locally available assets.

      - `--refresh`: request refreshed VoiceRender metadata.

      - `--engine-option KEY=VALUE`: repeatable engine-specific option forwarded to
      VoiceRender.


      Install backend extras through VoiceRender, for example `python -m pip install
      "voicerender[kokoro]"`. Playback requires a working audio device.'
