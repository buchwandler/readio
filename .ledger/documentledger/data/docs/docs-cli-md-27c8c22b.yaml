    section_hash: da65da23e65c200e359b8c0ff4fd7c2bff61f29217fea494799147e32a5fcef3
    summary: Manual specialist workflow
    text: '### Manual specialist workflow


      ```bash

      readio render-plan article.ssmdoc --profile narrator.renderprofile.toml --json

      VARIANT="<exact variant returned by render-plan>"

      readio render article.ssmdoc --variant "$VARIANT"

      readio compose article.ssmdoc --variant "$VARIANT"

      readio export article.ssmdoc --variant "$VARIANT" --output article.m4a

      ```


      `render-plan` delegates profile-specific projection to UtterPlan and emits the
      specialist variant. When running stages manually, pass that exact variant unchanged
      to `render`, `compose`, and `export`. `render` delegates to VoiceRender; `compose`
      to AudioCompose; `export` to AudioExport. The export stage requires the optional
      AudioExport integration (install `readio[audioexport]`).'
    links: []
