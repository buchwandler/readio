    summary: Removed commands
    text: "## Removed commands


      Version 0.5.0 removes Readio's former generic project, planning, rendering, synthesis,
      composition, export, engine/catalog, configuration, verification, and Spotify
      commands. Their specialist-owned operations are available from the corresponding
      package CLIs. Readio does not provide compatibility aliases or a migration command
      for old project state."
