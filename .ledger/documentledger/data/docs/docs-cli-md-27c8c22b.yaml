    summary: Dependency diagnostics
    text: "## Dependency diagnostics


      ```bash

      readio doctor

      readio doctor --json

      ```


      Doctor reports specialist package versions and VoiceRender engine availability.
      Progress is written to stderr; JSON results and structured errors are written
      to stdout. `--no-progress` disables progress callbacks on workflows that support
      them."
