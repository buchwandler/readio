    section_hash: 631d8dc55c33509406156d4f59ca76b2306bd9fe46d0c0c2f479fa3051355318
    summary: Unified render workflow
    text:
      "## Unified render workflow\n\nA normal render uses a run-scoped temporary\
      \ workspace. Supply `--bundle PATH` only when the editable SSMD bundle should\
      \ persist. Passing an existing `.ssmd-bundle` as `SOURCE` also selects persistent\
      \ mode. Readio never invents a default persistent bundle path or hidden `.readio/`\
      \ workspace.\n\n```bash\n# One-shot render; intermediate workspace is temporary\
      \ and cleaned afterward.\nreadio render article.docx --profile narrator.renderprofile.toml\
      \ --language en-US\n\n# Persistent editable workspace. Initial conversion materializes\
      \ the full book.\nreadio render novel.epub --bundle novel.ssmd-bundle \\\n  --profile\
      \ narrator.renderprofile.toml --language en-US --chapters 5-17\n\n# Inspect the\
      \ planned work without executing it.\nreadio render --config novel.readio.toml\
      \ --dry-run\nreadio status novel.ssmd-bundle --profile narrator.renderprofile.toml\
      \ --chapters 5-17\nreadio status --config novel.readio.toml\n```\n\n`status` and\
      \ `render --dry-run` use the same read-only workflow inspection. They report workspace\
      \ mode, selected scope, output, and specialist-backed state/action for each workflow\
      \ step. Inspection does not create a temporary workspace or mutate artifacts.\n\
      \n`--rebuild-from STAGE` explicitly rebuilds a stage and downstream derived state;\
      \ choices are `convert`, `compile`, `render-plan`, `render`, `compose`, and `export`.\
      \ Rebuilding from `convert` while targeting a persistent bundle is explicit consent\
      \ to reconvert. `--replace-output` separately allows replacing an existing final\
      \ output; it is not implied by a rebuild. Unknown or unsafe specialist state fails\
      \ closed rather than triggering broad deletion.\n\nProgress and diagnostics go\
      \ to stderr; `--json` keeps the structured result on stdout. `--no-progress` suppresses\
      \ progress callbacks only. AudioExport is included in the core installation; `--ffmpeg\
      \ PATH` and `--ffprobe PATH` select tool executables."
    links: []
  - section_id: md:section:docs/cli.md::render-intents
    doc_path: docs/cli.md
