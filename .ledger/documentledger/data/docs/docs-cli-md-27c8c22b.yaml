    section_hash: bd682dffcb46e578ac542e8b9d508e23cd4e9960ca7e1c05a67a98963e101dff
    summary: Render intents
    text:
      "## Render intents\n\nA render intent is reviewable, user-owned TOML. The\
      \ current schema is `readio.render.v2`; `[input]` describes source content, while\
      \ workspace mode and persistent bundle path belong under `[workspace]`.\n\n```toml\n\
      schema = \"readio.render.v2\"\nkind = \"book\"\n\n[input]\nsource = \"novel.epub\"\
      \nchapters = \"5-17\"\nlanguage = \"en-US\"\n\n[workspace]\nmode = \"bundle\"\n\
      bundle = \"novel.ssmd-bundle\"\n\n[voice]\nprofile = \"narrator.renderprofile.toml\"\
      \n```\n\nUse `mode = \"temporary\"` when intermediate state should be discarded\
      \ after the run. Persistent mode is selected explicitly with a bundle path or\
      \ by using an existing bundle as the source. On first creation, a persistent book\
      \ bundle contains the complete source inventory; `input.chapters` scopes downstream\
      \ planning and rendering, not initial conversion.\n\n```bash\nreadio profile create\
      \ --engine kokoro --target v1.0 --voice af_heart \\\n  --language en-US -o narrator.renderprofile.toml\n\
      readio intent document create article.docx \\\n  --profile narrator.renderprofile.toml\
      \ --language en-US\nreadio intent book create novel.epub \\\n  --profile narrator.renderprofile.toml\
      \ --language en-US --chapters 5-17 \\\n  --bundle novel.ssmd-bundle\nreadio intent\
      \ show novel.readio.toml --resolved\nreadio intent validate novel.readio.toml\n\
      readio render --config novel.readio.toml --dry-run\nreadio render --config novel.readio.toml\n\
      ```\n\nIntent files default to `<source-stem>.readio.toml`; `--output-config`,\
      \ `--stdout`, `--minimal`, and `--force` control persistence. `intent show --toml`\
      \ prints normalized TOML; `--resolved` displays config-relative paths and inferred\
      \ values; `--json` emits structured output. Book intents default to M4B and accept\
      \ `--chapters`; document intents default to MP3. A VoiceRender RenderProfile remains\
      \ a separate, user-owned artifact. CLI values override saved intent values.\n\n\
      For a one-off render without saving an intent, provide `SOURCE` and `--profile`.\
      \ Use `--bundle` to retain the editable workspace; omit it for temporary execution.\
      \ Existing final outputs require `--replace-output` before replacement."
    links: []
