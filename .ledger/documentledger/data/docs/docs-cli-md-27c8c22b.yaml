    section_hash: 16508f1488d0e26ac1adb792c334ed06289a9476df88cd45862426e104ac678a
    summary: Direct speech
    text:
      "## Direct speech\n\n```bash\nreadio speak --voice kokoro:v1.0/af_heart --lang\
      \ en-US \"Hello.\"\nreadio speak --profile narrator.renderprofile.toml --role\
      \ narrator \\\n  --output greeting.wav --no-play \"Hello.\"\n```\n\n`speak` synthesizes\
      \ literal text through VoiceRender and plays by default. `--output` writes WAV\
      \ and `--no-play` skips local playback. Use `--json` for a machine-readable result."
