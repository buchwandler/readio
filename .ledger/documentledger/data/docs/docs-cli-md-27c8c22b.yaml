    section_hash: afb46bbe7b421dfc2f1bd347977b458d08527e8ecf155ee789a387ae850593b3
    summary: Run the complete pipeline
    text:
      "### Run the complete pipeline\n\n```bash\nreadio run article.docx --profile\
      \ narrator.renderprofile.toml \\\n  --language en-US --json\nreadio run novel.ssmdbook\
      \ \\\n  --profile novel.ssmdbook/narrator.renderprofile.toml \\\n  --chapters\
      \ 5-17 --language en-US --export --output novel.m4b\n```\n\n`run` can accept source\
      \ material or an existing workspace. It creates/resolves the native workspace,\
      \ compiles, projects the RenderPlan, renders, and composes. `--export` adds the\
      \ optional export stage. Readio forwards UtterPlan's projected variant unchanged\
      \ across all downstream calls. Stage-specific roots, policies, force flags, chapter\
      \ selection, metadata, and encoder paths are forwarded to specialist APIs rather\
      \ than reimplemented."
    links: []
