    section_hash: 7c0e67348a69a4a0c11df0f5557154c43c3e1c8c2fd6743b81b2985a70b852cc
    summary: Manual specialist workflow
    text:
      "## Manual specialist workflow\n\nFor package-specific control, run the specialist\
      \ CLIs directly. The `VARIANT` value must be the exact variant returned by UtterPlan\
      \ and must be passed unchanged to every later stage.\n\n```bash\nssmdconvert book\
      \ convert novel.epub --chapters 5-17 -o novel.ssmdbook\nutterplan compile-book\
      \ novel.ssmdbook --chapters 5-17\nvoicerender profile create --engine kokoro --target\
      \ v1.0 --voice af_heart \\\n  --language en-US -o narration.renderprofile.toml\n\
      utterplan render-book novel.ssmdbook --chapters 5-17 \\\n  --profile narration.renderprofile.toml\n\
      \nVARIANT=\"<exact variant returned by utterplan render-book>\"\nvoicerender render-book\
      \ novel.ssmdbook --chapters 5-17 --variant \"$VARIANT\" \\\n  --emphasis-policy\
      \ defer-to-compose\naudiocompose compose-book novel.ssmdbook --chapters 5-17 --variant\
      \ \"$VARIANT\"\naudioexport export-book novel.ssmdbook --chapters 5-17 --variant\
      \ \"$VARIANT\" \\\n  --output novel.m4b\n```\n\nConsult each specialist's `--help`\
      \ for its complete options and diagnostics."
