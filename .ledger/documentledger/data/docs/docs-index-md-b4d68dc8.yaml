    section_hash: 032ca8d5eac7563d1ab94535b6398081f7d564b30aa48e608829b3d40d8dadcd
    summary: Installation
    text: '## Installation


      Readio requires Python 3.10 or newer.


      ```bash

      python -m pip install -e ".[cpu]"

      ```


      Use the GPU extra when a GPU-enabled ONNX Runtime is available:


      ```bash

      python -m pip install -e ".[gpu]"

      ```


      PyKokoro may download model and voice assets the first time it is used. Spotify
      publishing additionally requires the separately installed and authenticated `save-to-spotify`
      executable.'
    links: []
  - section_id: md:section:docs/index.md::quick-start
    doc_path: docs/index.md
    heading_path:
      - Readio documentation
      - Quick start
    heading_slug: quick-start
    line_span:
      - 32
      - 49
    section_hash: 8732cc6127d6d55fc72f696bd4dac8f6956925917953004b0e077de496fbef26
    summary: Quick start
    text: '## Quick start


      Read literal text, a file, or standard input:


      ```bash

      readio speak "Hello from the terminal."

      readio speak --file notes.md

      printf ''%s\n'' "Read this text." | readio speak

      ```


      Render a WAV file instead of playing audio:


      ```bash

      readio render --file notes.md -o notes.wav

      ```


      With no explicit output path, Readio writes a uniquely named WAV file below the
      configured output directory. Existing files are not overwritten unless `--force`
      is supplied for an explicit path.'
    links: []
  - section_id: md:section:docs/index.md::input-and-rendering
    doc_path: docs/index.md
