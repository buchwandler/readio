  section_hash: 7f5ca3726bed03872ea8e1a6d4fa620473dcf99e6ed2b972fd811fe39569a534
  summary: Specialist workflow
  text: '## Specialist workflow


    The package-owned stages are:


    ```text

    SSMDConvert → UtterPlan / RenderPlan → VoiceRender → AudioCompose → AudioExport

    ```


    Start with the [architecture guide](architecture.md), use the [CLI reference](cli.md)
    for Readio commands, and see the [Python API guide](api.md) for service calls.
    Consult each specialist package for complete package-specific options.'
  links: []
