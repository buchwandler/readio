  section_hash: 68c5d2b4c992521ee8b1515440d50c93b264ed46fb535ade2aa7a90bdf6454a8
  summary: Readio documentation
  text: '# Readio documentation


    Readio''s workflow gateway uses a visible, user-owned `readio.render.v2` intent
    and a separate VoiceRender RenderProfile to orchestrate specialist speech packages.
    SSMDConvert owns `.ssmd-bundle` workspaces and their book/document manifest kind;
    specialist APIs own stage schemas, validation, persisted artifacts, and detailed
    diagnostics. Readio provides unified workflow sequencing and direct semantic speech
    without hidden workspace state.


    ```{toctree}

    :maxdepth: 1


    architecture

    cli

    api

    changelog

    ```'
