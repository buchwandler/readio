    section_hash: bc26d338eccaa382500ed8ab6ef096878971014f430e1dd3f823b68aa6ce27f8
    summary: Stable platform contracts
    text: "## Stable platform contracts


      `readio.render.v3` is the user-owned intent schema. Workflow plans, render results,
      errors, capabilities, and synthesized speech use separate versioned JSON projections
      from the shared serializer. Workflow reasons, blockers, explicit destructive controls,
      cooperative cancellation limits, and optional nonpersistent execution reports
      are documented in the [Python API guide](api.md).


      The optional MCP server is installed with `readio[mcp]` and launched over stdio.
      It exposes task-oriented tools through the public Readio gateway only. Its render
      tool inspects first, requires explicit paths, and returns blocked plans without
      execution. See the [MCP and ownership architecture](architecture.md#optional-mcp-adapter)."
    links: []
