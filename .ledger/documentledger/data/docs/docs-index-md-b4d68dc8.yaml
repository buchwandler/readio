    section_hash: 305c09e02d8d192ed59982d9274d0d3f7c732437f4170975e3093074dde81247
    summary: No legacy migration
    text: "## No legacy migration


      Version 0.5 deliberately removes Readio-owned projects, settings, plans, manifests,
      and stage records. There is no migration command or compatibility layer. Recreate
      work from source material with `readio init`, or continue with the specialist
      packages directly."
