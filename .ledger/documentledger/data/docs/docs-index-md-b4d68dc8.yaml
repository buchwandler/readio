    section_hash: b3f38db57dcf4ae9952b0a22261a45abe87e4c9e768a3b6e1a5307e6d1d73ed1
    summary: Readio commands
    text: '## Readio commands


      ```bash

      readio init story.txt -o story.ssmdoc

      readio run story.ssmdoc --profile narrator.renderprofile.toml --language en-US

      readio speak --voice kokoro:v1.0/af_heart --lang en-US "Hello."

      readio doctor --json

      ```


      The pipeline commands operate on `.ssmdoc` and `.ssmdbook` bundles. Readio writes
      no parallel project state; stage outputs remain owned by the specialist packages.'
