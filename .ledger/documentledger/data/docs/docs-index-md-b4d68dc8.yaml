    section_hash: b486f0d0c0cd04186657a458023748fc515ae4b0c9156be763f9796e6936b2d9
    summary: Spotify publishing
    text: '## Spotify publishing


      Publishing is explicit:


      ```bash

      readio spotify publish --file episode.ssmd --title "Weekly Review" --format mp3
      --wait

      readio spotify upload recording.m4a --title "Lecture 3" --show-id spotify:show:abc
      --wait 2m

      readio spotify shows --json

      readio spotify status spotify:episode:abc --wait

      readio spotify doctor --json

      ```


      `spotify publish` renders source and delegates the completed media to `save-to-spotify`;
      `spotify upload` accepts existing caller-owned WAV, MP3, M4A, or OGG without rendering
      or deleting it. Without `--output`, publish''s generated media is temporary and
      cleaned up; explicit output is retained. `--timeline FILE` passes through a caller-owned
      JSON object, while `--chapters-from-markers` generates Readio chapters; they are
      mutually exclusive and both wait for READY before setting the timeline.


      Use `--json` for machine-readable output. Global `--json` is accepted before or
      after the command. `--wait` optionally takes a duration and `--wait-timeout` is
      deprecated; `--api-timeout` is separate from readiness waiting.


      Readio does not read Spotify credential files or perform authentication. It delegates
      external writes and account setup to `save-to-spotify`.'
