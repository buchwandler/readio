    heading_slug: ssmd-documents
    line_span:
      - 125
      - 138
    section_hash: 0f93d768f8ddb0727821c9c139e484027f6032e8c94e8a4d1725081d387013d3
    summary: SSMD documents
    text: "## SSMD documents


      Files ending in `.ssmd` are parsed as SSMD. Readio runs consumer preflight before
      rendering when `ssmd.validate_before_render` is enabled:


      ```bash

      readio ssmd check episode.ssmd

      readio ssmd check episode.ssmd --json

      readio ssmd check episode.ssmd --roundtrip

      ```


      Document-local `voice_bindings` are authoritative. Readio supplies only missing
      defaults from the selected provider's configured roles. A voice reference must
      resolve to a document binding, configured logical role, or configured concrete
      voice ID. Unresolved references fail before model inference.


      Plain text remains the default for one-voice narration. Use SSMD when the document
      needs multiple speakers, logical roles, marks, or chapters."
    links: []
