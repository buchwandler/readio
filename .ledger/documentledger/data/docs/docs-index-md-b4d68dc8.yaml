    section_hash: 37478e58ac2ca7a3198b2b7be0b26277edb99dd301393f274e84287d5dedcf12
    summary: Durable render manifests
    text: "## Durable render manifests


      Use `--manifest` when a bounded render produces an artifact that needs durable,
      machine-readable evidence:


      ```bash

      readio render --file notes.md --format mp3 --dry-run --json

      readio render --file notes.md --format mp3 --manifest

      ```


      The successful render writes `<audio>.readio.json` beside the audio. Its `readio.render-manifest.v2`
      payload embeds the exact executed `readio.plan.v2`, a canonical plan digest, the
      final encoded-file hash and byte count, `RenderSummary` audio facts, document
      metadata, and assembled marker offsets. Planning describes intended execution;
      the manifest describes the completed artifact.


      The option is explicit and applies only to bounded `render`. It is rejected with
      `--live` and does not create manifests for `speak`, `plan`, dry runs, or publishing.
      Human output remains the audio path. JSON output remains one object and adds `manifest`
      with the sidecar path, or `null` without the option."
    links: []
  - section_id: md:section:docs/index.md::render-progress
    doc_path: docs/index.md
    heading_path:
      - Readio documentation
      - Render progress
    heading_slug: render-progress
    line_span:
      - 211
      - 221
    section_hash: fea59c3b5423c6e6239bf32e720b989c629e96fab3cc76ef0d88f36b23ee5761
    summary: Render progress
    text: "## Render progress


      `render` uses a dependency-free progress reporter on stderr. In default `auto`
      mode it is enabled only for an interactive stderr; `--progress` forces it and
      `--no-progress` disables it. `--json` keeps stdout to exactly one result object,
      disables automatic progress, and still permits explicit stderr progress:


      ```bash

      readio render --file notes.md -o notes.mp3 --progress

      readio render --file notes.md -o notes.mp3 --json --progress

      ```


      Bounded renders show phases, completed/total units, percentage, elapsed time,
      approximate ETA, generated audio duration, and finalization. Live rendering shows
      elapsed time, cumulative units, and audio duration but no invented percentage
      or ETA."
    links: []
  - section_id: md:section:docs/index.md::verbose-diagnostics
    doc_path: docs/index.md
    heading_path:
      - Readio documentation
      - Verbose diagnostics
    heading_slug: verbose-diagnostics
    line_span:
      - 222
      - 233
    section_hash: 62fd0654366f0d45aeaa3be847df9e5bb5bbf80d6c8d158cb700ffa6ff1577c7
    summary: Verbose diagnostics
    text: '## Verbose diagnostics


      Use `-v` for timestamped INFO lifecycle records and `-vv` for DEBUG details from
      Readio and the selected engine:


      ```bash

      readio -v speak "Hello"

      readio -vv render episode.ssmd -o episode.mp3

      ```


      The option is global and may appear before or after a command. Logs are written
      only to stderr. Human results and JSON remain on stdout, so `readio -v doctor
      --json` still emits valid JSON. `--progress` and `--no-progress` remain independent;
      verbose mode makes progress line-oriented on a TTY. At `-vv`, engine API checks
      emit one compact structured event and include captured probe tracebacks at DEBUG;
      ordinary doctor output never includes stack traces. Review paths, model names,
      and voice identifiers before sharing diagnostics. Complete document text, raw
      audio, Spotify credentials, and authorization responses are not logged.

      Playback-only options are `--queue-size` and `--device`. Audio rendering is streamed
      to an atomic output file through a bounded audio path rather than accumulated
      as one in-memory waveform.'
    links: []
  - section_id: md:section:docs/index.md::configuration
    doc_path: docs/index.md
    heading_path:
      - Readio documentation
      - Configuration
    heading_slug: configuration
    line_span:
      - 234
      - 255
    section_hash: 1b00470d101af3b55c70e6c38c855420d799bc676eaedbd4903c1d62e07c48f0
    summary: Configuration
    text: "## Configuration


      Initialize and inspect the user-owned configuration:


      ```bash

      readio config init

      readio config path

      readio config show

      readio config validate

      readio config set reader.pause_mode auto

      ```


      `READIO_CONFIG` overrides the default configuration file path. Configuration is
      TOML schema 3; Readio does not silently load v0.3 provider-specific voice tables.
      Migrate existing files explicitly with `readio config migrate`; conflicts stop
      for review, and the source is backed up. Legacy authoring keys (`paths.templates`,
      `paths.ingest`, and `[ssmd]` validation/roundtrip options) warn, are ignored,
      and are omitted from new writes; Readio leaves existing authoring files and directories
      untouched.

      The main sections are:


      - `[reader]`: ordinary voice, language, speed, pause, unit, playback queue/device,
      and linguistic planning settings.

      - `[paths]`: runtime audio output directory.

      - `[roles.<role>]`: engine-qualified role targets (`engine`, `voice`, and optional
      `target_id`).

      - `[languages.<locale>]`: validated model, source, quality, voice, ordered lexicons,
      and language policies.


      Use `readio roles bind` to persist a global target, for example `readio roles
      bind analyst kokoro:v1.0/am_michael`. For a v0.3 project manifest, run `readio
      project migrate PROJECT` before opening the project; project migration also keeps
      a backup and rejects conflicting role bindings rather than guessing."
    links: []
  - section_id: md:section:docs/index.md::create-ssmd-with-ssmdstudio
    doc_path: docs/index.md
    heading_path:
      - Readio documentation
      - Create SSMD with SSMDStudio
    heading_slug: create-ssmd-with-ssmdstudio
    line_span:
      - 256
      - 284
    section_hash: cb2db34ac5e712d45d5d368f6021a99be35c600cee37f9010a9c272a24315e0b
    summary: Create SSMD with SSMDStudio
    text: '## Create SSMD with SSMDStudio


      Readio consumes portable `.ssmd` and `.ssmd.md` files; SSMDStudio owns creation,
      starter templates, LLM prompts, portable binding materialization, and structural/roundtrip
      lint. SSMDStudio 0.1.1 is the verified authoring handoff. Install its authoring
      tools separately. If bundled starters are not in the user library, restore them
      intentionally with `ssmdstudio template reset --all`:


      ```bash

      python -m pip install "ssmdstudio[authoring]==0.1.1"

      ssmdstudio template list

      ssmdstudio template use podcast --output episode.ssmd.md

      ssmdstudio draft new --output draft.ssmd.md --template podcast

      ssmdstudio ssmd lint episode.ssmd.md --roundtrip --json

      ```


      Use `ssmdstudio ssmd bind FILE --provider PROVIDER --voice-bind ROLE=VOICE --output
      OUTPUT` to write explicit portable bindings. Then let Readio check local consumer
      compatibility and render readiness:


      ```bash

      readio ssmd check episode.bound.ssmd.md --json

      readio render --file episode.bound.ssmd.md --dry-run --json

      ```


      | Former Readio command | SSMDStudio 0.1.1 replacement / boundary |

      |---|---|

      | `readio template list/show/add/remove/reset` | Corresponding `ssmdstudio template`
      command |

      | `readio template validate --all` | `ssmdstudio template validate --all --roundtrip`
      |

      | `readio template use NAME --name FILE` | `ssmdstudio template use NAME --output
      FILE` |

      | `readio ingest new --name FILE [--template NAME]` | `ssmdstudio draft new --output
      FILE [--template NAME]` |

      | `readio ingest path/list` | No managed ingest directory; use filesystem paths.
      Existing data is untouched. |

      | `readio ssmd bind ...` | `ssmdstudio ssmd bind ...`; this writes the source
      but does not verify local voice availability. |

      | `readio ssmd check FILE --roundtrip` | `ssmdstudio ssmd lint FILE --roundtrip`;
      Readio check remains consumer-only. |'
    links: []
  - section_id: md:section:docs/index.md::ssmd-consumer-checks
    doc_path: docs/index.md
