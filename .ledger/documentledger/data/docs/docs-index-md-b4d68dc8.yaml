    summary: Readio documentation
    text: "# Readio documentation


      Readio orchestrates native SSMDConvert `.ssmdoc` and `.ssmdbook` workspaces through
      specialist speech packages. Specialist APIs own the stage schemas, persisted artifacts,
      and detailed diagnostics; Readio provides workflow sequencing, a CLI, and direct
      literal-text speech.


      ```{toctree}

      :maxdepth: 1


      architecture

      cli

      api

      changelog

      ```"
