    section_hash: 7149da8968b21f3d18d9bc531be661cbcec2151e7ebb77dff228482ca3e1d22a
    summary: Readio commands
    text: '## Readio commands


      ```bash

      readio speak --voice kokoro:v1.0/af_heart --lang en-US "Hello from Readio."

      readio audiobook convert novel.epub --output novel.ssmdbook

      readio audiobook build novel.ssmdbook --profile narration.renderprofile.toml

      readio doctor

      ```


      `speak` accepts literal text and plays VoiceRender''s returned audio through the
      current device. Audiobook conversion and build delegate to the specialist public
      APIs. The specialist packages own all persistent workspace artifacts and stage
      decisions.'
