  section_hash: b069d5bd2c80d121c080853f6e2e66c6d7afad9d4920510328495e7447c5bbf1
  summary: Installation
  text: '## Installation


    Readio requires Python 3.10 or newer. Install it with `python -m pip install readio`,
    then install a speech engine through VoiceRender, for example `python -m pip install
    "readio[kokoro]"`. Optional `readio[documents]` and `readio[spacy]` extras enable
    document formats and UtterPlan spaCy support; AudioExport is included in the core
    installation.'
  links: []
