    section_hash: eaedff759cbf5b75b3f9a169c1ae325eea5460b8abfcaee40f01c739d5b01546
    summary: Installation
    text: '## Installation


      Readio requires Python 3.10 or newer. Install Readio with `python -m pip install
      readio`, then install a synthesis backend through VoiceRender, for example `python
      -m pip install "voicerender[kokoro]"`. Readio does not provide engine extras or
      pin backend implementations.


      Optional Readio extras only pass through specialist functionality: `readio[spacy]`
      enables UtterPlan''s spaCy support, and `readio[documents]` enables SSMDConvert''s
      PDF and DOCX support.'
    links: []
