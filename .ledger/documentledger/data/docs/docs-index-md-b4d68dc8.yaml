    section_hash: 98ff082c16d3260f4277b29eaf0a9611cc08f23d1ad35f5083a8940f1f3a720a
    summary: Configuration
    text: "## Configuration


      Initialize and inspect the user-owned configuration:


      ```bash

      readio config init

      readio config path

      readio config show

      readio config validate

      ```


      `READIO_CONFIG` overrides the default configuration file path. Configuration is
      TOML with schema 1. The main sections are:


      - `[reader]`: `voice`, `lang`, `speed`, `pause_mode`, `unit`, `queue_size`, and
      `device`.

      - `[ssmd]`: the selected `voice_provider` and SSMD validation behavior.

      - `[paths]`: user template, ingest, and WAV output directories.

      - `[voices.<provider>]`: concrete voice IDs and logical role mappings.


      Set values with dotted keys. Aliases `voice`, `lang`, and `speed` target the corresponding
      reader settings:


      ```bash

      readio config set reader.voice bf_emma

      readio config set voices.kokoro.roles.analyst am_michael

      readio config set ssmd.voice_provider kokoro

      ```


      The default provider is `kokoro`. Built-in logical roles include `narrator`, `host`,
      `analyst`, and `guest`. A configured role must resolve to one of the provider's
      configured voice IDs."
    links: []
