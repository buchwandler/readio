    section_hash: da5545f29d83cddad66ee185d12db639a1b7e6fb157356f072c18453fdf0e3d0
    summary: Installation
    text: '## Installation


      Readio requires Python 3.10 or newer. Install it with `python -m pip install readio`,
      then install a speech engine through VoiceRender, for example `python -m pip install
      "readio[kokoro]"`. The optional `readio[documents]`, `readio[spacy]`, and `readio[audioexport]`
      extras enable document formats, UtterPlan spaCy support, and AudioExport respectively.'
    links: []
