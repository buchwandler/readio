    section_hash: 7212846190cf9f8e4729e26f50fbed5830668786d415fca977e5952a566c4d0b
    summary: Installation
    text: '## Installation


      Readio requires Python 3.10 or newer.


      ```bash

      python -m pip install "readio[kokoro,cpu]"

      ```


      Use the GPU extra when a GPU-enabled ONNX Runtime is available:


      ```bash

      python -m pip install "readio[kokoro,gpu]"

      ```


      Install Piper, Pocket, Supertonic, Kitten, or Inflect with `readio[piper,cpu]`,
      `readio[pocket]`, `readio[supertonic]`, `readio[kitten]`, or `readio[inflect]`.
      The `readio[all,cpu]` extra installs all engine packages for a CPU environment.


      Engine packages may download model, voice, or bundle assets on first use. Spotify
      publishing additionally requires the separately installed and authenticated `save-to-spotify`
      executable.'
    links: []
  - section_id: md:section:docs/index.md::quick-start
    doc_path: docs/index.md
    heading_path:
      - Readio documentation
      - Quick start
    heading_slug: quick-start
    line_span:
      - 39
      - 70
    section_hash: 06858c83a41630343c0a70a0bb17c739a2f03b4f5ad142e32fae6ca9c5b3c5de
    summary: Quick start
    text: '## Quick start


      Read literal text, a file, or standard input:


      ```bash

      readio speak "Hello from the terminal."

      readio speak --file notes.md

      printf ''%s\n'' "Read this text." | readio speak

      ```


      `speak` incrementally queues segments through Readio-owned `sounddevice` playback;
      it does not wait for the entire document or apply whole-program mastering. File
      rendering retains full-document mastering. The two execution paths share segment
      synthesis and composition semantics.


      Render an audio file instead of playing audio:


      ```bash

      readio render --file notes.md -o notes.wav

      readio render --file notes.md -o notes.mp3

      readio render --file notes.md --format m4a

      readio render --file notes.md --format ogg

      ```


      Render also supports PCM16 FLAC and Opus; `.ogg` is Ogg/Vorbis and `.opus` is
      separate:


      ```bash

      readio render --file notes.md -o notes.flac

      readio render --file notes.md -o notes.opus

      ```


      WAV is the default. An output suffix selects the encoder, while `--format` selects
      the automatic output suffix or can be combined with a matching explicit suffix.
      Extensionless output is normalized to the selected format. M4A and Opus require
      an `ffmpeg` executable on `PATH`; WAV/FLAC use PCM16, while MP3 and Ogg/Vorbis
      require matching SoundFile/libsndfile codec support.


      With no explicit output path, Readio writes a uniquely named file below the configured
      output directory. Existing files are not overwritten unless `--force` is supplied
      for an explicit path.'
    links: []
