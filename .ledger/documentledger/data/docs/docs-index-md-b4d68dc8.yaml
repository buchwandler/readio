    section_hash: 02c02e3763b873927d5d1c3a0f1fbd9c6135f1de091650a950914df1c4cb4711
    summary: Persistent project exports
    text: "## Persistent project exports


      Generic project export supports WAV, FLAC, MP3, M4A, Ogg/Vorbis, and Opus. `.ogg`
      stays Vorbis; `.opus` is a separate format. Readio defaults M4A to 192k and Opus
      to 96k; those are Readio defaults and do not assert TTSForge parity.


      ```bash

      readio export novel.readio --format flac

      readio export novel.readio --format opus --bitrate 96k

      readio audiobook export novel.ssmdbook --format m4b --cover cover.jpg

      ```


      M4B is available only for audiobook projects through `readio audiobook export`.
      It muxes AAC audio and embedded chapters; title/author default from project metadata
      and cover art is explicit-only (JPEG/PNG). Readio's M4B AAC default is 192k.


      Markdown is a first-class input format. Files ending in `.md`, `.markdown`, `.mdown`,
      or `.mkd` are parsed before synthesis; `.ssmd.md` is detected as SSMD before its
      `.md` suffix. Use `--input-format markdown` for Markdown from stdin or literal
      text:


      ```bash

      readio speak --file README.md

      readio render --file docs/design.md

      cat README.md | readio speak --input-format markdown

      ```


      Headings, lists, links, images, code blocks, block quotes, tables, task lists,
      HTML text, and front matter become speech-friendly text. Markdown styling does
      not create SSMD prosody. Use `.ssmd` or `.ssmd.md` for explicit voices, rate,
      volume, pitch, breaks, or markers; use `--input-format text` to force literal
      reading of a Markdown-looking file.


      The public `InputDocument.provenance` field exposes `DocumentProvenance` for auto-converted
      sources: original format, media type, source name, converter/version, and converter
      metadata. This information is retained on normal document instances without adding
      private converter imports or changing explicit text, Markdown, or SSMD input."
    links: []
  - section_id: md:section:docs/index.md::input-and-rendering
    doc_path: docs/index.md
    heading_path:
      - Readio documentation
      - Input and rendering
    heading_slug: input-and-rendering
    line_span:
      - 95
      - 173
    section_hash: a579e634da5ca919b16f3c99c566768abf17057081fb1d34ec4d7305cc1ddf39
    summary: Input and rendering
    text: '## Input and rendering


      The `speak`, `render`, and `spotify` commands accept the same input forms:


      - Positional text, joined with spaces; exactly one existing regular file token
      is loaded as a file.

      - `--file PATH` for the unambiguous scripting form and UTF-8 text, Markdown, or
      SSMD.

      - Standard input when no positional text or file is provided.

      - `--live` for incremental standard-input playback or rendering. Blank lines close
      live paragraphs.


      A missing path-like positional token is an error rather than literal speech. Use
      `--input-format text` when an existing filename must be spoken literally; explicit
      Markdown and SSMD formats still support positional file detection.


      For non-live input, `--select` can be `all`, `last-paragraph`, or `paragraph:N`.
      The default synthesis unit is controlled by `reader.unit` and can be overridden
      with `--unit sentence` or `--unit paragraph`.


      Synthesis options are available on all three commands:


      ````text

      --voice VOICE             engine voice ID

      --voice-file PATH         PocketSynth reference WAV

      --voice-prompt REF        PocketSynth managed reference prompt

      --engine ENGINE           kokoro, piper, pocket, supertonic, kitten, or inflect

      --model TARGET            model or engine-specific target ID

      --precision int8|fp32     PocketSynth bundle precision

      --temperature FLOAT       PocketSynth generation temperature

      --lsd-steps INT           PocketSynth latent diffusion steps

      --max-frames INT          PocketSynth maximum generated frames

      --frames-after-eos INT    PocketSynth frames after end of sequence

      --lang LANGUAGE           language code, such as en-us

      --lexicon NAME            named lexicon when supported by the engine

      --no-lexicons             disable engine lexicons when supported

      --auto-lexicons            use automatic engine lexicons when supported

      --g2p-fallback MODE       none, espeak, or goruut where supported

      --lexicon-data-policy     auto or installed-only where supported

      --language-detection      off or auto where supported

      --detect-language LANG    repeatable pronunciation-routing hint

      --speed NUMBER            speech speed multiplier

      --voice-level MODE       off or calibrated voice-level handling

      --spacy MODE              linguistic analysis policy

      --short-sentence MODE     off, wrap, phrase, or randomized-phrase (default: phrase)

      --pause-mode MODE         auto, tts, or manual

      --unit UNIT               sentence or paragraph


      Readio''s short-sentence default is `phrase`; Readio resolves the policy before
      engine adapters translate it to engine-native settings.

      Readio requires SSMD >=0.9.3,<0.10 and UtterPlan >=0.4.0,<0.5. Project plans use
      canonical UtterPlan schema-v4 TOML artifacts; the `readio.plan.v2` response remains
      JSON. It supports PyKokoro >=0.10.2,<0.11, PiperSynth >=0.2.1,<0.3, PocketSynth
      >=0.2.5,<0.3, SupertonicSynth >=0.1.2,<0.2, KittenSynth >=0.1.1,<0.2, and InflectSynth
      >=0.1.1,<0.2; each engine package owns its own runtime dependencies and Readio
      does not require OnnxVoice. Canonical engine IDs are `kokoro`, `piper`, `pocket`,
      `supertonic`, `kitten`, and `inflect`; package names such as `inflectsynth` are
      input aliases. Install engines with the matching optional extra; `readio doctor`
      checks each installed package''s public request API without downloading models.



      InflectSynth uses public metadata discovery for current targets including `nano-v2`
      and `micro-v2`, each with the fixed `default` voice. It is English-only; unsupported
      languages and explicit speaker selection, reference voices, pronunciation overrides,
      or native word timings are rejected. Readio owns request boundaries and capacity
      policy; InflectSynth owns G2P and model/runtime internals, while ONNXVoice remains
      a transitive dependency rather than a Readio import. InflectSynth 0.1.1''s public
      capacity contract does not report a trustworthy maximum, so Readio treats capacity
      as unknown and does not guess a token limit. Shared speed and voice-level calibration
      are available in the CLI; API clients can also pass variation and seed through
      `SynthesisRequest.engine_options`.


      Readio''s built-in `pause_mode` is `auto`; an explicit `[reader] pause_mode` setting
      or `--pause-mode tts|manual|auto` override takes precedence.


      Speed is an engine synthesis multiplier, not a composition tempo. Kokoro receives
      the value directly, PiperSynth uses its reciprocal as `length_scale`, PocketSynth
      rejects explicit values other than `1.0`, and Supertonic and InflectSynth forward
      the multiplier to their native APIs.


      Readio, not the engine adapter, owns text-capacity fitting and exact-text subdivision.
      Adapters synthesize one strict request at a time and do not call native splitters.
      Readio preserves legal linguistic and pronunciation boundaries and fails when
      an oversized request has no legal split. InflectSynth 0.1.1 does not advertise
      a known maximum, so Readio does not apply a guessed token limit.


      ```bash

      readio models list --language de --offline

      readio models show de-thorsten --offline

      readio voices list --model de-thorsten --json

      readio models list --preference huggingface --json

      readio models show de-thorsten --preference github --json

      readio defaults set de --model de-thorsten --lexicon crane --offline

      readio defaults show de-at --json

      readio render --lang de --file notes.md

      readio lexicons list --lang de --offline --json

      readio lexicons show crane --lang de --offline --json

      readio voices list --engine supertonic --lang en-us


      readio voices list --engine inflect --lang en-us

      readio voices show inflect:nano-v2/default

      readio render --engine inflect --model nano-v2 --voice default --lang en-us "Hello
      from Inflect."


      readio voices prompts --engine pocket --dataset alba

      ````


      The `--voice`, `--voice-file`, and `--voice-prompt` selectors are mutually exclusive.
      Managed prompts are Pocket-only and apply to the default synthesis voice, not
      per-role bindings.


      `models`, `voices`, and `lexicons` enumerate targets from the unified engine registry.
      They are metadata-only and do not load model weights or instantiate ONNX runtimes.
      `readio voices prompts` separately lists Pocket managed-prompt metadata without
      opening a model or fetching prompt audio. Offline mode uses cached catalogs; refresh
      updates catalog metadata only.

      `--model-source` applies only to engines that advertise distribution-source selection.
      Voice rosters are target-scoped where the engine exposes them, and lexicons are
      listed only for engines that support lexicon discovery. SSMD preflight validates
      role targets against the selected engine catalog.

      Readio uses `readio.engines` as its sole engine registry. The registered engines
      are `kokoro`, `piper`, `pocket`, `supertonic`, `kitten`, and `inflect`; aliases
      such as `inflectsynth` are normalized before target resolution. Lexicon operations
      reject engines that do not advertise lexicon support.'
    links: []
