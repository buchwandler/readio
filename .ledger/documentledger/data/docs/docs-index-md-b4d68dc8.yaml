    summary: Readio documentation
    text: "# Readio documentation


      Readio is a thin convenience layer over specialist speech and audiobook packages.
      For package-specific controls, use the owning specialist CLI directly. Readio's
      main addition is orchestration across the `.ssmdbook` stages and a direct literal-text
      speech command.


      ```{toctree}

      :maxdepth: 1


      architecture

      cli

      api

      changelog

      ```"
