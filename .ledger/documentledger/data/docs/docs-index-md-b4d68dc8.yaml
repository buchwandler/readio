    section_hash: d6c6128dd116f23b5d24940c319fca2d8e0f06a4fde40f4378932f15a259252e
    summary: Diagnostics and development
    text: "## Diagnostics and development


      Run the offline environment check with:


      ```bash

      readio doctor

      ```


      Doctor reports configuration, configured directories, PyKokoro, SSMD, the selected
      provider and voices, sound dependencies, and `save-to-spotify` availability. It
      does not create directories, modify configuration, inspect credentials, or call
      the network.


      Run the test suite and lint checks from a development checkout:


      ```bash

      pytest

      ruff check .

      ```


      The main execution path is `readio/cli.py`. Input normalization is in `readio/document.py`,
      configuration in `readio/config.py`, synthesis orchestration in `readio/reader.py`,
      audio sinks in `readio/audio.py` and `readio/wave.py`, and external Spotify integration
      in `readio/spotify.py`."
