    section_hash: 9eeff08952498581f85505b8540d034e8a045b92b78185d80fd412d9abfaa5e7
    summary: Templates and ingest files
    text: "## Templates and ingest files


      Templates are copied from the package into the user template directory during
      initialization. User copies are not overwritten by normal initialization.


      ```bash

      readio template list

      readio template show podcast

      readio template validate --all

      readio template use podcast --name weekly-review.ssmd

      ```


      Use `--roundtrip` with template validation for strict SSMD authoring checks. `template
      reset NAME` restores a packaged template intentionally.


      Ingest files are retained in the configured ingest directory for later editing
      or rendering:


      ```bash

      readio ingest path

      readio ingest new --name notes.txt

      readio ingest new --template podcast --name weekly-review.ssmd

      readio ingest list

      ```


      Automatic artifact names contain a UTC timestamp and random suffix. Explicit ingest
      names must be single filenames below the ingest directory."
    links: []
