  section_hash: d664bcceebd1d8bf3f43eb7f5f52136f87d6a5fd68de3aaa1e7ef1e47ab445e4
  summary: Readio commands
  text: '## Readio commands


    ```bash

    readio profile create --engine kokoro --target v1.0 --voice af_heart --language
    en-US -o narrator.renderprofile.toml

    readio intent document create story.txt --profile narrator.renderprofile.toml
    --language en-US

    readio render --config story.readio.toml --dry-run

    readio render --config story.readio.toml

    readio render story.txt --profile narrator.renderprofile.toml --bundle story.ssmd-bundle

    readio status story.ssmd-bundle --profile narrator.renderprofile.toml

    readio speak --voice kokoro:v1.0/af_heart --lang en-US "Hello."

    readio doctor --json

    ```


    `readio render` uses temporary intermediate storage unless a persistent bundle
    is explicitly selected or supplied as the source. Specialist CLIs remain available
    for deliberate stage-level control; Readio does not provide a duplicate stage-runner
    namespace.'
