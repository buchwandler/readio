    section_hash: f4b22a021fac606ca00cf6956c7bbf35ec36199b15e6ccb6cd2dd1b2bfdfa22e
    summary: Synthesis planning
    text: "## Synthesis planning


      Non-live rendering is plan-first: `readio render` resolves one `readio.plan.v2`
      execution plan and then executes exactly that plan. Use `readio render --dry-run`
      to display the one-shot plan without loading TTS:


      ```bash

      readio render --file notes.md --lang de --format mp3 --dry-run --json

      readio render --file notes.md --dry-run

      ```


      Keep the layers separate:


      - **Discovery** (`readio models`, `readio voices`, `readio lexicons`) enumerates
      what engines registered in `readio.engines` provide.

      - **Defaults** (`readio defaults`) persist validated per-language preferences.

      - **Planning** (`readio render --dry-run`) resolves one concrete request, including
      engine, target, source, quality, voice, lexicons, SSMD role bindings, output format/backend/path,
      and provenance. Generated output paths are allocated once by the plan and reused
      by the render.

      - **Project planning** (`readio plan`) builds engine-free semantic Utterplan artifacts
      and manages project-local SSMD roles. It does not resolve one-shot engine, model,
      or output choices.

      - **Render result** executes the plan; a plan that fails validation (for example
      `model_language_incompatible`, `model_runtime_unavailable`, `ssmd_unresolved_voice`,
      `encoder_unavailable`) is printed with its diagnostics and no TTS model is loaded.


      Plans preserve engine-neutral render targets, request options, SSMD role bindings,
      and pronunciation-routing hints. Lexicon behavior is supplied only by engines
      that advertise lexicon support; unsupported explicit pronunciation semantics produce
      diagnostics before runtime startup.


      Planning policy stores UtterPlan linguistic options separately from engine render
      controls. Readio compiles one semantic plan, lowers its segments to requests,
      then delegates acoustic synthesis to the selected engine without passing the UtterPlan
      object to adapters.

      UtterPlan receives `synthesis.spacy` and `synthesis.short_sentence` as typed linguistic
      policy. Readio records those settings in the semantic plan; an engine adapter
      maps them only when the selected published engine API supports them.


      One-shot planning is deterministic: `--resolve-voices` is rejected by `render
      --dry-run`; use `--voice-bind ROLE=REF` for an invocation or `readio plan bind
      ROLE REF` for a project setting."
    links: []
  - section_id: md:section:docs/index.md::durable-render-manifests
    doc_path: docs/index.md
