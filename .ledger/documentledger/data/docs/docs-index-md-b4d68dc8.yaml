    section_hash: fe3f662cfe554700a6daeaac70cfd19ec5f132b1ee5f05e6e0515192c739f3b6
    summary: SSMD consumer checks
    text: "## SSMD consumer checks


      Files ending in `.ssmd` or `.ssmd.md` are parsed as SSMD. Readio always performs
      consumer preflight during planning; `readio ssmd check` is an explicit no-audio
      check of rendering compatibility and voice bindings:


      ```bash

      readio ssmd check episode.ssmd

      readio ssmd check episode.ssmd --json

      ```


      Structural and roundtrip authoring lint belongs to SSMDStudio (`ssmdstudio ssmd
      lint FILE --roundtrip`). Document-local SSMD `voice_bindings` remain authoritative
      in their external namespace. Readio resolves missing references against explicit
      invocation bindings, engine-qualified project and global roles, and the selected
      engine's configured voice. A document containing the same role in multiple namespaces
      is ambiguous and fails before model inference.


      Plain text remains the default for one-voice narration. Use SSMD when the document
      needs multiple speakers, logical roles, marks, or chapters."
    links: []
