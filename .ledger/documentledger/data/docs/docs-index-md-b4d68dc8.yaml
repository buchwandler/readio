    section_hash: dbdbf237954516c6b36b57570461d307157c1f8a958526bdbf723614a3bcb19d
    summary: Diagnostics and development
    text: "## Diagnostics and development


      Run the offline environment check with:


      ```bash

      readio doctor

      ```


      The local doctor is human-readable by default and supports `readio doctor --json`.
      It reports configuration, Readio's runtime output directory, dependencies, format
      availability, and the upstream executable/version probe without authentication
      or token access. Use `readio spotify doctor` for the explicit external integration
      check.

      Use `readio doctor --json` to inspect each engine's structured API status (`adapter_unavailable`,
      `package_missing`, `api_incompatible`, `api_version_incompatible`, `api_probe_failed`,
      or `ready`), imported module version/path, missing public names, and captured
      error details. A transitive or lazy-import failure is reported separately from
      a genuinely missing symbol. Probing does not download models or run inference,
      and Readio does not fall back to a legacy pipeline when the published API is incompatible.


      Run the test suite and lint checks from a development checkout:


      ```bash

      pytest

      ruff check .

      ```


      The main execution path is `readio/cli.py`. Project SSMD role discovery and binding
      settings live in `readio/project_roles.py` and `readio/project_settings.py`; project
      synthesis orchestration is in `readio/stages/synthesis.py`. Input normalization
      is in `readio/document.py`, configuration in `readio/config.py`, audio sinks in
      `readio/audio.py` and `readio/wave.py`, and external Spotify integration in `readio/spotify.py`."
