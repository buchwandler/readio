    section_hash: 963b3c0864a15efef9576227bff4485b5590222557c62d948538b59f614817de
    summary: No legacy migration
    text: "## No legacy migration


      Version 0.5.0 removes Readio-owned generic projects, `.readio` state, `project.json`,
      and the old plan, render-manifest, and pipeline APIs. There is no migration command
      or compatibility layer. Readio does not read or attach that state. Convert source
      material to an SSMDConvert-owned `.ssmdbook` workspace, or continue using the
      specialist tools directly."
