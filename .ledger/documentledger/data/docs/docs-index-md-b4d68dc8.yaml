    section_hash: a84398128d1b0c5993b3e00295fee08d5d73801b7d6f1e6d15826ce8f4a00bb7
    summary: Readio documentation
    text: "# Readio documentation


      Readio is a terminal text-to-speech tool. It reads plain text or SSMD documents
      with PyKokoro, plays speech locally, renders WAV files, and can publish completed
      audio through `save-to-spotify`."
    links: []
