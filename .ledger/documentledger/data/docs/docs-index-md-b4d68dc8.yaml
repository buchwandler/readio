      - 152
    section_hash: ef3c54a7e380dc7a5363ee0f5ee3a5407192f3d0eff5a32c886bd2567c9502a1
    summary: Spotify publishing
    text: '## Spotify publishing


      Publishing is explicit:


      ```bash

      readio spotify --file episode.ssmd --title "Weekly Review" --wait

      ```


      The command renders a WAV and invokes `save-to-spotify --json`. Without `--output`,
      the WAV is temporary and is deleted after the operation. With `--output`, the
      requested WAV is retained. `--show-id` and `--new-show` select the destination
      show, while `--summary`, `--image`, and `--language` set episode metadata.


      Use `--json` for a machine-readable result. `--wait` waits for readiness, and
      `--wait-timeout` sets the readiness timeout. `--chapters-from-markers` converts
      SSMD markers into a Spotify timeline and requires the episode to reach `READY`.


      Readio does not read Spotify credential files or perform authentication. It delegates
      the external write operation to `save-to-spotify`.'
    links: []
