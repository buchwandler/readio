    summary: SSMD voice resolution
    text:
      "## SSMD voice resolution\n\nSSMD document bindings use `voice_bindings.PROVIDER.ROLE:\
      \ CONCRETE_VOICE_ID` and remain authoritative. Inspect configured voices and persisted\
      \ role mappings with:\n\n````bash\nreadio voices list --lang de --json\nreadio\
      \ voices list --engine kitten --json\nreadio voices show kokoro:v1.0/af_heart\
      \ --json\nreadio roles list --engine kokoro\n\nFor a selected model, inspect concrete\
      \ voices with `readio voices list --model MODEL --lang LANG --json`. References\
      \ use `SYSTEM:TARGET[/VOICE]`, such as `kokoro:v1.0/af_heart`, `piper:en_US-amy-medium`,\
      \ `pocket:english_2026-04/alba`, or `inflect:nano-v2/default`; numbered voice\
      \ selectors are removed. `--engine`, `--model`, `--lang`, and `--gender` filter\
      \ catalog metadata. Native voice IDs need enough discovery context to resolve\
      \ uniquely; prefer a semantic reference when the target must be explicit. Document\
      \ bindings take precedence over invocation bindings, which take precedence over\
      \ configured portable roles.\nUse `readio roles bind ROLE REF` for an explicit\
      \ persistent mapping. Native voice IDs can be used when their engine and target\
      \ resolve uniquely. For automation, pass missing logical roles only for one invocation:\n\
      \n```bash\nreadio render --file episode.ssmd \\\n  --voice-bind moderator=kokoro:v1.0/af_sarah\
      \ \\\n  --voice-bind architect=kokoro:v1.0/am_michael\n````\n\n`--resolve-voices`\
      \ is an explicit interactive convenience. It prompts once per unique missing role\
      \ only on a usable TTY and never persists choices. JSON and non-TTY execution\
      \ never prompts. For portable source binding materialization, use `ssmdstudio\
      \ ssmd bind FILE --provider PROVIDER --voice-bind ROLE=REF --output OUTPUT`; Readio\
      \ does not write SSMD source."
