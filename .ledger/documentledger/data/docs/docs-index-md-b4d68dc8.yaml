    section_hash: 9d626e8544f93e288d7eeb1478acffa4dc77e41942d9aee63817dd11a86361da
    summary: Specialist workflow
    text: "## Specialist workflow


      The manual workflow makes package ownership explicit:


      ```text

      SSMDConvert → UtterPlan → VoiceRender → AudioCompose → AudioExport

      ```


      Start with the [architecture guide](architecture.md) and use the owning tool's
      documentation for detailed package options. Readio provides the [CLI shorthand](cli.md)
      and a small [Python facade](api.md)."
