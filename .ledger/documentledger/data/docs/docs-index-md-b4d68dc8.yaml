    summary: Readio documentation
    text: "# Readio documentation


      Readio is a terminal text-to-speech tool. It reads plain text or SSMD, resolves
      neutral synthesis requests through registered engines, composes audio timelines
      with AudioCompose, and publishes completed audio through `save-to-spotify`."
    links: []
