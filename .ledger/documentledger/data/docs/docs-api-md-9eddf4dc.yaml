    section_hash: c040a24a76d2c3efdc591a8a104d90933ae292d7ac44a1e82997b0898dd5fd4f
    summary: Source inspection
    text:
      "## Source inspection\n\n`inspect_source()` and `Readio.inspect_source()`\
      \ expose SSMDConvert's normalized, read-only source inspection. They return a\
      \ `SourceInspection` with the resolved source path, kind, metadata, and (for books)\
      \ a tuple of `SourceChapter` records. This does not create a bundle or render\
      \ workspace.\n\n```python\nfrom pathlib import Path\nfrom readio.api import Readio\n\
      \ninspection = Readio().inspect_source(Path(\"novel.epub\"))\nprint(inspection.kind,\
      \ inspection.metadata)\nfor chapter in inspection.chapters:\n    print(chapter.number,\
      \ chapter.title, chapter.source_id)\n```\n\nUse `inspect_source()` when a caller\
      \ needs source metadata or chapter inventory before deciding which workflow to\
      \ request. Use `Readio.inspect(RenderRequest)` to inspect specialist workflow\
      \ state; it remains read-only as well."
