    section_hash: 53bd3ba49d5f534467ad890f0f16f0524316c9ec2fa0524dd97bbaa056999e2b
    summary: Python API
    text: "# Python API


      `readio.api` is the user-facing orchestration gateway. `Readio.synthesize()` is
      the canonical application speech method and returns in-memory audio without playback;
      `Readio.speak()` is its optional-playback convenience wrapper. The file-to-audio
      workflow remains `Readio.inspect(RenderRequest)` and `Readio.render(RenderRequest)`.
      Specialist packages own their stage APIs, schemas, validation, artifacts, and
      reports; Readio normalizes workflow planning and execution without re-exporting
      stage request types as its primary API."
