    section_hash: a1bababd26b58f75834b137e44bb3df2f392d16178f2f7ad45ae8d305bf1e73e
    summary: Render intents
    text:
      "## Render intents\n\n`RenderIntent` and the TOML helpers represent user-owned\
      \ desired configuration. The current schema is `readio.render.v3`; input source\
      \ and scope are separate from workspace policy:\n\n```toml\nschema = \"readio.render.v3\"\
      \nkind = \"document\"\n\n[input]\nsource = \"article.docx\"\nlanguage = \"en-US\"\
      \n\n[workspace]\nmode = \"temporary\"\n\n[voice]\nprofile = \"narrator.renderprofile.toml\"\
      \n[preparation]\nspeech_semantics = \"freeze\"\nspacy = \"md\"\nspeech_profile\
      \ = \"reader.speech.toml\"\n\n[preparation.pronunciations]\n\"Readio\" = \"ree-dee-oh\"\
      \n\n[projection]\npause_timing = \"engaging\"\n```\n\nFor persistence, use `mode\
      \ = \"bundle\"` and provide `workspace.bundle`. `PreparationIntent` and `ProjectionIntent`\
      \ carry source-preparation and RenderPlan timing choices; omitted preparation\
      \ spaCy retains legacy planning settings. The `create_book_intent` and `create_document_intent`\
      \ factories apply kind-specific defaults; `load_render_intent`, `save_render_intent`,\
      \ `parse_render_intent`, and `dump_render_intent` read, validate, and serialize\
      \ the intent. Version 2 files remain readable with no speech profile and fixed\
      \ pause timing, and inspection does not rewrite them. Paths are resolved relative\
      \ to the intent file when `config_path` is supplied. A VoiceRender RenderProfile\
      \ remains a separate, user-owned artifact.\n\n```python\nfrom pathlib import Path\n\
      from readio.api import (\n    PreparationIntent,\n    ProjectionIntent,\n    create_document_intent,\n\
      \    save_render_intent,\n)\n\nintent = create_document_intent(\n    Path(\"article.docx\"\
      ),\n    profile=Path(\"narrator.renderprofile.toml\"),\n    bundle=Path(\"article.ssmd-bundle\"\
      ),\n    preparation=PreparationIntent(\n        spacy=\"md\",\n        speech_profile=Path(\"\
      reader.speech.toml\"),\n    ),\n    projection=ProjectionIntent(pause_timing=\"\
      engaging\"),\n)\nsave_render_intent(intent, Path(\"article.readio.toml\"))\n```"
