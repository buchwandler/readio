  section_hash: 83a31f5b019afdeb8d501d2b739a7e9423c775b21799cb215ce300319f404e01
  summary: Python API
  text: '# Python API


    `readio.api` is the user-facing orchestration gateway. Its primary workflow methods
    are `Readio.speak()`, `Readio.inspect(RenderRequest)`, and `Readio.render(RenderRequest)`.
    Specialist packages own their stage APIs, schemas, validation, artifacts, and
    reports; Readio normalizes workflow planning and execution without re-exporting
    stage request types as its primary API.'
