    section_hash: d107c303338646d5e2f5ac2a3d632318d6f7b5a02919f66752e42d52208d9147
    summary: Workspace lifecycle
    text: '## Workspace lifecycle


      `Readio.create_workspace(source, request=None)` converts source material through
      SSMDConvert and returns an immutable `WorkspaceRef`. EPUB input defaults to a
      `.ssmdbook`; other supported input defaults to `.ssmdoc`. `Readio.resolve_workspace(path)`
      validates and loads an existing native workspace. No Readio project registry or
      migration is involved.


      ```python

      service = Readio()

      workspace = service.create_workspace("article.txt")

      assert workspace.root.suffix == ".ssmdoc"

      ```


      Use `CreateWorkspaceRequest` to select kind, output path, language, chapter range,
      or force behavior. Its source must match the `source` argument.'
