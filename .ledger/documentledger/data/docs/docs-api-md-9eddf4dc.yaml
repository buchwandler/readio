    summary: Direct speech
    text: "## Direct speech


      `readio.api.speak(text, ...)` synthesizes literal text through VoiceRender and
      plays it locally unless `no_play=True`. It accepts a voice selector or a saved
      RenderProfile and role, and can save WAV output. It does not create a workspace
      or invoke UtterPlan, AudioCompose, or AudioExport."
