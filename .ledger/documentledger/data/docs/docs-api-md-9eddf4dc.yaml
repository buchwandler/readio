    section_hash: 72afa6cfd9f1256b785e21b7baa3a5d3b5552e403eeed61967799b44a7a04539
    summary: Planning and pipeline sequencing
    text:
      "## Planning and pipeline sequencing\n\n`Readio.plan(workspace, PlanRequest(...))`\
      \ delegates semantic compilation to UtterPlan. `Readio.render_plan(workspace,\
      \ RenderPlanRequest(profile=...))` returns `RenderPlanResult(native, variant)`.\
      \ The `variant` is the exact value returned by UtterPlan.\n\n`Readio.render`,\
      \ `Readio.compose`, and `Readio.export` dispatch by workspace kind to VoiceRender,\
      \ AudioCompose, and AudioExport. Requests contain Readio routing fields and specialist-native\
      \ option values; artifacts and reports remain package-owned.\n\n`Readio.run(source_or_workspace,\
      \ RunRequest(...))` performs workspace creation/resolution, planning, projection,\
      \ rendering, composition, and optional export. It replaces downstream request\
      \ variants with the exact projected variant before dispatch:\n\n```python\nprofile\
      \ = Path(\"narrator.renderprofile.toml\")\nresult = service.run(\n    workspace.root,\n\
      \    RunRequest(\n        plan=PlanRequest(language=\"en-US\"),\n        render_plan=RenderPlanRequest(profile=profile),\n\
      \        render=VoiceRenderRequest(variant=\"pending\"),\n        compose=ComposeRequest(variant=\"\
      pending\"),\n    ),\n)\nprint(result.variant)  # exact UtterPlan variant\n```\n\
      \n`PipelineResult` retains the workspace, specialist results, projected variant,\
      \ and optional export result. `PipelineEvent` adapts stage progress and retains\
      \ the original event as `source`. Specialist exceptions propagate through a small\
      \ stage-context wrapper."
