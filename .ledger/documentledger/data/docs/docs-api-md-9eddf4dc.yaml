    section_hash: b7124ef5e564a3b5da569f251c64c87603c429550a6affae49328526160aa29b
    summary: Compatibility policy
    text: "## Compatibility policy


      The former Readio project, plan, engine, synthesis, composition, export, catalog,
      verification, and integration API types have been removed. There are no compatibility
      aliases, `.readio` project migrations, or adapters for old result models. Use
      an SSMDConvert `.ssmdbook` workspace and call the specialist package responsible
      for each stage."
