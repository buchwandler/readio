    section_hash: 936d235645228ccedbbd54a4a382dac3103a52062cfccf0f3ffb5dbc6fc4f89d
    summary: Book operations
    text:
      "## Book operations\n\n`convert_book(source, output=None, *, chapters=\"all\"\
      , language=None, on_progress=None)` converts an EPUB through SSMDConvert and writes\
      \ an SSMDConvert-owned `.ssmdbook` workspace. It returns the specialist `BookWorkspace`\
      \ object.\n\n`open_book(workspace)` opens a workspace through SSMDConvert without\
      \ initializing Readio state. It returns the specialist workspace object.\n\nA\
      \ full build uses the small Readio request type and passes each stage through\
      \ the owning package's public API:\n\n```python\nfrom pathlib import Path\n\n\
      from readio.api import BookBuildRequest, build_book, convert_book\n\nworkspace\
      \ = convert_book(\"novel.epub\", \"novel.ssmdbook\", chapters=\"5-17\")\nresult\
      \ = build_book(\n    BookBuildRequest(\n        workspace=workspace.path,\n  \
      \      profile=Path(\"narration.renderprofile.toml\"),\n        chapters=\"5-17\"\
      ,\n        output=Path(\"novel.m4b\"),\n    )\n)\nprint(result.variant)\n```\n\
      \n`BookBuildRequest` accepts:\n\n- `workspace`: an existing specialist-produced\
      \ `.ssmdbook` workspace.\n- `profile`: a VoiceRender RenderProfile path when RenderPlan\
      \ projection is enabled.\n- `chapters`, `force`, and `fail_fast`: forwarded to\
      \ stage APIs where supported.\n- `compile`, `render_plan`, `synthesize`, `compose`,\
      \ and `export`: select build stages.\n- `variant`: an existing specialist variant\
      \ when projection is skipped.\n- `stop_after`: stop after `compile`, `render-plan`,\
      \ `synth`, `compose`, or `export`.\n- `output`, `export_profile`, `metadata`,\
      \ `cover`, and `bitrate`: forwarded to AudioExport.\n\n`build_book` returns a\
      \ `BookBuildResult` containing the workspace path, exact variant, and the actual\
      \ specialist result objects for any executed stages. It does not copy specialist\
      \ result models or persist Readio stage state. `on_progress` receives small Readio\
      \ `BookProgressEvent(stage, kind)` values for stage start and completion. Specialist\
      \ exceptions propagate unchanged."
