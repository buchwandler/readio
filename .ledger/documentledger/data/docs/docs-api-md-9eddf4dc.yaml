- section_id: md:section:docs/api.md::semantic-speech
  doc_path: docs/api.md
  heading_path:
  - Python API
  - Semantic speech
  heading_slug: semantic-speech
  line_span:
  - 5
  - 19
  section_hash: affe9a15587c3302956b3481019b5906b7d9b16cdf75c7987a6916694672050e
  summary: Semantic speech
  text: "## Semantic speech\n\n```python\nfrom readio.api import Readio, SpeakRequest\n\
    \nservice = Readio()\nresult = service.speak(\n    SpeakRequest(text=\"Hello from\
    \ Readio.\", voice=\"kokoro:v1.0/af_heart\"),\n    play=False,\n)\nprint(result.audio.sample_rate,\
    \ result.audio.channels, len(result.audio))\n```\n\nSemantic speech returns an\
    \ `AudioBuffer` in memory. Playback is optional, and this path does not create\
    \ a bundle or intermediate artifacts. The `readio.api.speak(...)` convenience\
    \ function is also available."
  links: []
- section_id: md:section:docs/api.md::complete-file-to-audio-workflow
  doc_path: docs/api.md
  heading_path:
  - Python API
  - Complete file-to-audio workflow
  heading_slug: complete-file-to-audio-workflow
  line_span:
  - 20
  - 44
  section_hash: 12b457b6a85a31390c22de1ab9272ac53a54fc454cbf86a05c4de5038887727d
  summary: Complete file-to-audio workflow
  text: "## Complete file-to-audio workflow\n\n```python\nfrom pathlib import Path\n\
    from readio.api import Readio, RenderRequest\n\nservice = Readio()\nrequest =\
    \ RenderRequest(\n    source=Path(\"article.docx\"),\n    profile=Path(\"narrator.renderprofile.toml\"\
    ),\n    bundle=None,  # temporary workspace by default\n)\nplan = service.inspect(request)\n\
    print([(step.stage, step.action, step.state) for step in plan.steps])\n\nresult\
    \ = service.render(request)\nprint(result.output, result.workspace_mode, result.variant)\n\
    ```\n\n`inspect` is read-only: it does not create a temporary directory, convert\
    \ source material, or mutate specialist artifacts. `render` executes the complete\
    \ workflow and cleans temporary state on success or failure. To persist an editable\
    \ SSMD workspace, set `bundle=Path(\"article.ssmd-bundle\")`; passing an existing\
    \ `.ssmd-bundle` as `source` also selects persistent mode. There is no implicit\
    \ default bundle path.\n\n`RenderRequest` also accepts chapter selection, language,\
    \ output format/path, bitrate, sample rate, channels, and specialist-backed option\
    \ groups (`PlanningOptions`, `VoiceRenderOptions`, `CompositionOptions`, and `ExportOptions`).\
    \ `rebuild_from` requests an explicit workflow rebuild; `replace_output` separately\
    \ authorizes replacement of an existing final output. The dry-run form is `service.render(request,\
    \ dry_run=True)` and returns the same `WorkflowPlan` shape as `inspect`.\n\nThe\
    \ returned `WorkflowPlan` contains the source, workspace mode/path, selected variant\
    \ and output, planned steps, and warnings. `RenderResult` reports the final output,\
    \ workspace mode, exact variant, executed/reused workflow stages, and warnings.\
    \ Normalized `WorkflowEvent` progress is available through the `on_progress` callback."
  links: []
- section_id: md:section:docs/api.md::render-intents
  doc_path: docs/api.md
