    section_hash: c39a7d60620b20d97ccde88b124e9c846a660b73ebe4fb3bdde4c2d9009f9c84
    summary: VoiceRender management
    text: "## VoiceRender management


      `readio.api` provides thin delegates for engine/model discovery and management,
      voice discovery and source/clone operations, selector parsing, and RenderProfile
      creation, validation, refresh, and role management. Calls use VoiceRender's public
      package-root API and preserve its result objects and validation behavior. Readio
      does not provide voice design or an engine implementation."
    links: []
