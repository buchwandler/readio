    summary: Python API
    text:
      "# Python API\n\nThe supported facade is `readio.api`. It contains a small\
      \ set of orchestration and direct-speech operations. Specialist APIs and result\
      \ objects remain authoritative.\n\n```python\nfrom readio.api import (\n    BookBuildRequest,\n\
      \    BookBuildResult,\n    BookProgressEvent,\n    VoiceSelector,\n    build_book,\n\
      \    convert_book,\n    open_book,\n    parse_voice_selector,\n    speak,\n)\n\
      ```"
