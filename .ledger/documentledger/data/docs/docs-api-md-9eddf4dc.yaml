    section_hash: f297b8ff374247aaf34c8c70f41a88de6e6c3842b9217c7d5eeaf3910d6abcd3
    summary: Management delegates
    text: '## Management delegates


      `readio.api` retains module-level delegates for VoiceRender engine/model discovery,
      voice discovery and source/clone operations, selector parsing, and RenderProfile
      creation, validation, refresh, and role management. They preserve specialist results
      and validation behavior for compatibility. Application integrations should use
      `Readio.list_engines()`, `Readio.list_targets()`, `Readio.list_voices()`, and
      `Readio.list_engine_options()` for normalized Readio-owned records.


      ONNX Runtime controls delegate to VoiceRender''s public package-root APIs:


      ```python

      from readio.api import reset_runtime_providers, runtime_status, set_runtime_providers


      status = runtime_status()

      set_runtime_providers("cuda,cpu")

      status = runtime_status()  # policy and resolution for future sessions

      status = reset_runtime_providers()

      ```'
