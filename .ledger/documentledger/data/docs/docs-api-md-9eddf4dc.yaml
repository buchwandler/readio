  - section_id: md:section:docs/api.md::complete-file-to-audio-workflow
    doc_path: docs/api.md
    heading_path:
      - Python API
      - Complete file-to-audio workflow
    heading_slug: complete-file-to-audio-workflow
    line_span:
      - 61
      - 89
    section_hash: 1c9dd1080761667c843df541faa0a0f6a6a5560e55257b3579379eac280ba5f4
    summary: Complete file-to-audio workflow
    text:
      "## Complete file-to-audio workflow\n\n```python\nfrom pathlib import Path\n\
      from readio.api import Readio, RenderRequest\n\nservice = Readio()\nrequest =\
      \ RenderRequest(\n    source=Path(\"article.docx\"),\n    profile=Path(\"narrator.renderprofile.toml\"\
      ),\n    bundle=None,  # temporary workspace by default\n)\nplan = service.inspect(request)\n\
      print([(step.stage, step.action, step.state) for step in plan.steps])\n\nresult\
      \ = service.render(request)\nprint(result.output, result.workspace_mode, result.variant)\n\
      ```\n\n`inspect` is read-only: it does not create a temporary directory, convert\
      \ source material, or mutate specialist artifacts. `render` executes the complete\
      \ workflow and cleans temporary state on success or failure. To persist an editable\
      \ SSMD workspace, set `bundle=Path(\"article.ssmd-bundle\")`; passing an existing\
      \ `.ssmd-bundle` as `source` also selects persistent mode. There is no implicit\
      \ default bundle path.\n\n`RenderRequest` also accepts chapter selection, language,\
      \ output format/path, bitrate, sample rate, channels, Readio-owned preparation/projection\
      \ options, and specialist-backed option groups (`PlanningOptions`, `VoiceRenderOptions`,\
      \ `CompositionOptions`, and `ExportOptions`). `rebuild_from` requests an explicit\
      \ workflow rebuild; `replace_output` separately authorizes replacement of an existing\
      \ final output. The dry-run form is `service.render(request, dry_run=True)` and\
      \ returns the same `WorkflowPlan` shape as `inspect`.\n\nThe returned `WorkflowPlan`\
      \ contains the source, workspace mode/path, selected variant and output, planned\
      \ steps, and warnings. `RenderResult` reports the final output, workspace mode,\
      \ exact variant, executed/reused workflow stages, and warnings. Normalized `WorkflowEvent`\
      \ progress is available through the `on_progress` callback.\n\n`on_progress` callbacks\
      \ run synchronously. An executed stage emits `stage.started`, zero or more normalized\
      \ specialist events, then `stage.completed`. A reused stage emits only `stage.reused`\
      \ and does not call its specialist operation. Progress events preserve specialist\
      \ `current` and `total` counters, `kind`, and `elapsed_seconds` when supplied.\
      \ Additional data is available in `WorkflowEvent.details`; chapter identifiers\
      \ are normalized to `chapter_id`, `chapter_number`, and `chapter_title` when the\
      \ event is clearly chapter-scoped. Generic counters are not chapter numbers.\n\
      \nReadio does not synthesize workflow timing or ETA. AudioExport's public `export_bundle`\
      \ API has no progress callback, so export has no intermediate counters or current-stage\
      \ ETA. Consumers may still track their own total wall-clock time around `render()`."
