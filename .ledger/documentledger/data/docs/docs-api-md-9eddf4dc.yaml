    section_hash: a8fc99bfea7708d65bc632f72fff9c349d121d7efde199aa377092eb7f02acb7
    summary: Book operations
    text: "## Book operations


      `Readio.create_workspace()` converts EPUB input into a native `.ssmdbook`; `CreateWorkspaceRequest`
      can select chapters and conversion language. `PlanRequest`, `RenderPlanRequest`,
      `VoiceRenderRequest`, and `ComposeRequest` carry book chapter selectors to the
      corresponding specialists. Use `BookExportRequest` when requesting book export
      through the Python service.


      Store a book's RenderProfile inside its workspace so UtterPlan can record a workspace-relative
      provenance reference during projection."
