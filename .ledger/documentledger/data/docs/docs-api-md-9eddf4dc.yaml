    section_hash: be9275d27c390520b07e5e12ff3c7ec960f2b42b94fb34bd50a21e39cf85f6f9
    summary: Compatibility policy
    text: "## Compatibility policy


      Version 0.5 is a clean break. Readio-owned project directories, settings, plans,
      manifests, and old stage APIs are unsupported. There is no migration, compatibility
      alias, or hidden state attachment. Use SSMDConvert to create native `.ssmdoc`/`.ssmdbook`
      workspaces from source material, or use the specialist packages directly."
