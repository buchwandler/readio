    section_hash: 049c203c240db5340210254d33366aca3b1bc51ae3c597c55263c1d660a74591
    summary: Converting and running saved intents
    text: '## Converting and running saved intents


      `render_request_from_intent()` resolves a saved `RenderIntent` and maps its values
      to the canonical `RenderRequest`. Paths in the intent are resolved relative to
      its config file when `config_path` is provided. The bridge does not execute specialist
      stages.


      ```python

      from pathlib import Path

      from readio.api import Readio, load_render_intent, render_request_from_intent


      intent_path = Path("article.readio.toml")

      intent = load_render_intent(intent_path)

      request = render_request_from_intent(intent, config_path=intent_path)

      service = Readio()


      plan = service.inspect(request)

      result = service.render(request)

      ```


      `service.request_from_intent()` is the instance equivalent. `service.inspect_intent()`
      and `service.render_intent()` are convenience wrappers over the same request bridge
      and canonical workflows. For example, `service.render_intent(intent, dry_run=True)`
      returns a `WorkflowPlan`; it does not run conversion or rendering. Persistent
      book requests convert the full source inventory, while chapter selection limits
      downstream processing.'
