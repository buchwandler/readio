  section_hash: 8141a0228a3982e07cb61a4b6c59ceeb94edd564660d32bd3370a5a4d5d531c2
  summary: Management delegates
  text: '## Management delegates


    `readio.api` also exposes delegates for VoiceRender engine/model discovery, voice
    discovery and source/clone operations, selector parsing, and RenderProfile creation,
    validation, refresh, and role management. These calls preserve specialist results
    and validation behavior.


    ONNX Runtime controls delegate to VoiceRender''s public package-root APIs:


    ```python

    from readio.api import reset_runtime_providers, runtime_status, set_runtime_providers


    status = runtime_status()

    set_runtime_providers("cuda,cpu")

    status = runtime_status()  # policy and resolution for future sessions

    status = reset_runtime_providers()

    ```


    `runtime_status()` describes the imported distribution/build, available providers,
    configured policy and its source, and resolution for new sessions; it does not
    report a provider active in an initialized synthesis session. A distribution/package
    is distinct from an execution provider. Environment variables such as `ONNXVOICE_PROVIDER`
    override the saved preference, and reset does not unset them. Readio does not
    install or switch runtime distributions.'
  links: []
