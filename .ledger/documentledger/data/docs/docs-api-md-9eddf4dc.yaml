    section_hash: 4061499943c28967190b046f4be1c1b5f9478b364d37970c7d44ae34e2f15b54
    summary: Direct speech
    text:
      "## Direct speech\n\n`speak(text, *, voice=None, engine=None, target=None,\
      \ language=\"en-US\", speaker=None, offline=False, refresh=False, engine_options=None)`\
      \ resolves and synthesizes through VoiceRender, then plays the returned audio\
      \ through the current device.\n\n```python\nfrom readio.api import parse_voice_selector,\
      \ speak\n\nselector = parse_voice_selector(\"kokoro:v1.0/af_heart\")\nassert selector.engine\
      \ == \"kokoro\"\nassert selector.target_id == \"v1.0\"\nassert selector.voice\
      \ == \"af_heart\"\n\nrendered = speak(\n    \"A short sentence.\",\n    voice=\"\
      kokoro:v1.0/af_heart\",\n    language=\"en-US\",\n)\n```\n\nThe selector syntax\
      \ is neutral. Readio does not maintain an engine registry or backend alias table.\
      \ VoiceRender owns engine selection, session lifecycle, capacity handling, and\
      \ synthesis. The returned value is the specialist rendered-speech object."
