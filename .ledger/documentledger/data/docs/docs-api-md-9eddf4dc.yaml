  section_hash: 134105f52dde3098f3be5a338ee121acb7acd5fc21aa1d6d0825f1913c09162e
  summary: Render intents
  text: "## Render intents\n\n`RenderIntent` and the TOML helpers represent user-owned\
    \ desired configuration. The current schema is `readio.render.v2`; input source\
    \ and scope are separate from workspace policy:\n\n```toml\nschema = \"readio.render.v2\"\
    \nkind = \"document\"\n\n[input]\nsource = \"article.docx\"\nlanguage = \"en-US\"\
    \n\n[workspace]\nmode = \"temporary\"\n\n[voice]\nprofile = \"narrator.renderprofile.toml\"\
    \n```\n\nFor persistence, use `mode = \"bundle\"` and provide `workspace.bundle`.\
    \ The `create_book_intent` and `create_document_intent` factories apply kind-specific\
    \ defaults; `load_render_intent`, `save_render_intent`, `parse_render_intent`,\
    \ and `dump_render_intent` read, validate, and serialize the intent. A VoiceRender\
    \ RenderProfile remains a separate, user-owned artifact.\n\n```python\nfrom pathlib\
    \ import Path\nfrom readio.api import create_document_intent, save_render_intent\n\
    \nintent = create_document_intent(\n    Path(\"article.docx\"),\n    profile=Path(\"\
    narrator.renderprofile.toml\"),\n    bundle=Path(\"article.ssmd-bundle\"),\n)\n\
    save_render_intent(intent, Path(\"article.readio.toml\"))\n```"
  links: []
