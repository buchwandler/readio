    section_hash: c6084215d911b7d6cc5370ffe34ec5879273cdcea98f26ce29aca45a2a25cd74
    summary: Source preparation, projection, and spaCy resources
    text:
      "## Source preparation, projection, and spaCy resources\n\n`PreparationOptions`\
      \ configures SSMDConvert conversion. Select a speech profile explicitly; SSMDConvert\
      \ loads and validates it and applies its own replacement precedence. A concrete\
      \ preparation spaCy tier is also applied to UtterPlan planning. `ProjectionOptions.pause_timing`\
      \ selects `fixed`, `natural`, or `engaging` RenderPlan projection timing. It does\
      \ not configure AudioCompose pause policy.\n\n```python\nfrom pathlib import Path\n\
      from readio.api import PreparationOptions, ProjectionOptions, RenderRequest\n\n\
      request = RenderRequest(\n    source=Path(\"article.docx\"),\n    profile=Path(\"\
      narrator.renderprofile.toml\"),\n    preparation=PreparationOptions(\n       \
      \ speech_semantics=\"preserve\",\n        spacy=\"md\",\n        speech_profile=Path(\"\
      reader.speech.toml\"),\n        pronunciations={\"Readio\": \"ree-dee-oh\"},\n\
      \    ),\n    projection=ProjectionOptions(pause_timing=\"engaging\"),\n)\n```\n\
      \nUse `list_spacy_models(language)` to inventory the concrete `sm`, `md`, `lg`,\
      \ and `trf` tiers. It returns `SpacyModelInfo` records in that stable order with\
      \ each resolved package name, package installation state, model version, and spaCy\
      \ version when known. It reads distribution metadata only. It does not load models,\
      \ download packages, install spaCy, or mutate the environment.\n\n```python\n\
      from readio.api import list_spacy_models\n\nfor model in list_spacy_models(\"\
      en-US\"):\n    print(model.tier, model.model, model.installed, model.model_version,\
      \ model.spacy_version)\n```\n\nUse `inspect_spacy_model(language, tier)` to validate\
      \ a selected model; this stronger check can load the model. Pass `offline=True`\
      \ to `ensure_spacy_model(language, tier)` to fail rather than provision when the\
      \ model is missing. Provisioning occurs only when `ensure_spacy_model()` is explicitly\
      \ called. Source conversion, compilation, and projection do not download models.\
      \ Install the optional `readio[spacy]` extra to enable spaCy support."
