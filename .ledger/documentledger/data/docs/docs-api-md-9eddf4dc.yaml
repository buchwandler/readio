    summary: Python API
    text:
      "# Python API\n\n`readio.api` exposes a small orchestration service and management\
      \ functions that delegate to specialist package-root APIs. Specialist results\
      \ are returned unchanged; Readio does not mirror their option schemas or translate\
      \ their exceptions.\n\n```python\nfrom pathlib import Path\nfrom readio.api import\
      \ (\n    BookExportRequest,\n    CreateWorkspaceRequest,\n    ComposeRequest,\n\
      \    PlanRequest,\n    Readio,\n    RenderPlanRequest,\n    RunRequest,\n    VoiceRenderRequest,\n\
      )\n```"
