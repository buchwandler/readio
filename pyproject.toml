[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readio"
dynamic = ["version"]
description = "Read text aloud in the terminal with streaming TTS and an Agent Skill for LLM invocation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "pykokoro[playback]>=0.8.6,<0.9",
  "platformdirs>=4.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.17"]
gpu = ["onnxruntime-gpu>=1.17"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
readio = "readio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["readio*"]
exclude = ["tests*", "skill*"]

[tool.setuptools_scm]
fallback_version = "0+unknown"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
