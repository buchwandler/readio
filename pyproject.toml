[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readio"
dynamic = ["version"]
description = "Thin orchestration and speech convenience over specialist packages"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.23",
  "utterplan>=0.6.6,<0.7",
  "voicerender>=0.2.6,<0.3",
  "audiocompose>=0.3.3,<0.4",
  "ssmdconvert>=0.2.2,<0.3",
  "sounddevice>=0.4.6,<1.0",
]
[project.optional-dependencies]
spacy = ["utterplan[spacy]>=0.6.6,<0.7"]
documents = ["ssmdconvert[pdf,docx]>=0.2.2,<0.3"]
audioexport = ["audioexport>=0.1.4,<0.2"]
kokoro = ["voicerender[kokoro]>=0.2.6,<0.3"]
piper = ["voicerender[piper]>=0.2.6,<0.3"]
pocket = ["voicerender[pocket]>=0.2.6,<0.3"]
kitten = ["voicerender[kitten]>=0.2.6,<0.3"]
supertonic = ["voicerender[supertonic]>=0.2.6,<0.3"]
inflect = ["voicerender[inflect]>=0.2.6,<0.3"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
readio = "readio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["readio*"]
exclude = ["tests*", "skill*"]

[tool.setuptools.package-data]
readio = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "0+unknown"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["01_todo.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: tests requiring real model execution and external model assets",
]
