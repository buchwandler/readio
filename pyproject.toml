[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readio"
dynamic = ["version"]
description = "Read text aloud in the terminal with streaming TTS and an Agent Skill for LLM invocation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.23",
  "utterplan>=0.4.0,<0.5",
  "audiocompose>=0.2.0,<0.3",
  "ssmd>=0.9.3,<0.10",
  "ssmdconvert>=0.1.3,<0.2",
  "platformdirs>=4.0",
  "soundfile>=0.12",
  "sounddevice>=0.4.6,<1.0",
  "tomli>=2.0; python_version < '3.11'",
  "typing_extensions>=4.0",
  "tomli-w>=1.0",
  "rich-argparse>=1.7,<2",
]
[project.optional-dependencies]
kokoro = ['pykokoro>=0.10.2,<0.11']
piper = ['pipersynth>=0.2.1,<0.3']
pocket = ['pocketsynth[cpu]>=0.2.5,<0.3']
kitten = ['kittensynth[cpu]>=0.1.1,<0.2']
supertonic = ['supertonicsynth[cpu]>=0.1.2,<0.2']
inflect = ['inflectsynth[cpu]>=0.1.1,<0.2']
spacy = ['utterplan[spacy]>=0.4.0,<0.5']
documents = ["ssmdconvert[pdf,docx]>=0.1.3,<0.2"]
verification = ["moondream>=2.4,<3"]
benchmark = ["moondream>=2.4,<3"]
all = [
  'pykokoro>=0.10.2,<0.11',
  'pipersynth>=0.2.1,<0.3',
  'pocketsynth[cpu]>=0.2.5,<0.3',
  'kittensynth[cpu]>=0.1.1,<0.2',
  'supertonicsynth[cpu]>=0.1.2,<0.2',
  'inflectsynth[cpu]>=0.1.1,<0.2',
  'utterplan[spacy]>=0.4.0,<0.5',
]
cpu = ["onnxruntime>=1.17"]
gpu = ["onnxruntime-gpu>=1.17"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
readio = "readio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["readio*"]
exclude = ["tests*", "skill*"]

[tool.setuptools.package-data]
readio = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "0+unknown"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["01_todo.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: tests requiring real model execution and external model assets",
]
