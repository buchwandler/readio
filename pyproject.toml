[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readio"
dynamic = ["version"]
description = "Read text aloud in the terminal with streaming TTS and an Agent Skill for LLM invocation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "utterplan>=0.2.0,<0.3",
  "audiocompose>=0.1.1,<0.2",
  "platformdirs>=4.0",
  "soundfile>=0.12",
  "tomli>=2.0; python_version < '3.11'",
  "typing_extensions>=4.0",
  "tomli-w>=1.0",
  "PyYAML>=6.0",
  "ssmd>=0.8.7,<0.9",
  "onnxvoice>=0.1.8,<0.2",
  "markdown-it-py>=3.0,<5.0",
  "epub2text>=0.2.8,<0.3",
  "mdit-py-plugins>=0.4,<1.0",
]
[project.optional-dependencies]
kokoro = ['pykokoro[playback]>=0.9.11,<0.10']
piper = ['pipersynth>=0.1.3,<0.2']
spacy = ['utterplan[spacy]>=0.1.4,<0.2']
all = ['pykokoro[playback]>=0.9.11,<0.10', 'pipersynth>=0.1.3,<0.2', 'utterplan[spacy]>=0.1.4,<0.2']
cpu = ["onnxruntime>=1.17"]
gpu = ["onnxruntime-gpu>=1.17"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
readio = "readio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["readio*"]
exclude = ["tests*", "skill*"]

[tool.setuptools.package-data]
readio = ["resources/templates/*.ssmd"]

[tool.setuptools_scm]
fallback_version = "0+unknown"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["01_todo.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
